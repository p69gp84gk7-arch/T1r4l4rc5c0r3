<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Arc Club Luchonnais</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">

  <!-- C'est cette page qu'iOS interroge pour l'icône du raccourci : elle doit
       donc déclarer elle-même l'apple-touch-icon, ce que la page de Google ne
       fait pas. -->
  <link rel="apple-touch-icon" href="icone/icone-180.png">
  <link rel="apple-touch-icon" sizes="512x512" href="icone/icone-512.png">
  <link rel="icon" type="image/png" href="icone/icone-512.png">
  <link rel="manifest" href="manifest.json">

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Arc Club">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#15594a">

  <style>
    /*
     * L'application tourne dans un cadre, et un cadre ne connaît pas les
     * encoches ni la barre d'accueil du téléphone. Cette page les mesure et
     * transmet les valeurs à l'application, qui étire elle-même son entête
     * sous l'heure et sa barre d'onglets jusqu'au bas de l'écran : aucune
     * bande de couleur ne vient couper l'image.
     */
    :root { color-scheme: light dark; --bord: #f4f3ef; --haut: #15594a; --bas: #f4f3ef; }
    @media (prefers-color-scheme: dark) { :root { --bord: #0d1311; --bas: #0d1311; } }

    html, body { margin: 0; height: 100%; overflow: hidden; }
    /* Visible seulement le temps du chargement, derrière le cadre. */
    html { background: var(--bas); }
    body { background: var(--bas); }

    /* Sondes de mesure : leur taille vaut exactement la marge de l'écran. */
    .sonde {
      position: fixed; left: 0; width: 1px; pointer-events: none;
      visibility: hidden; z-index: -1;
    }
    #sondeHaut { top: 0; height: env(safe-area-inset-top, 0px); }
    #sondeBas { bottom: 0; height: env(safe-area-inset-bottom, 0px); }

    /* Le cadre occupe tout l'écran, marges comprises, et reçoit seul les appuis. */
    iframe {
      border: 0; width: 100%; height: 100%; display: block;
      background: var(--bord); position: relative; z-index: 1;
    }

    /* Filet de sécurité : masqué tant que l'application se charge normalement,
       il ne doit jamais recouvrir le cadre — sinon il avale les appuis et les
       champs de saisie deviennent inertes. */
    .secours {
      position: fixed; inset: 0; z-index: 2; display: none;
      align-items: center; justify-content: center; padding: 24px;
      text-align: center; color: #fff; background: #15594a;
      font: 15px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .secours.visible { display: flex; }
    .secours a { color: #fff; font-weight: 600; }

    /* Bandeau d'autorisation des notifications : il ne s'affiche qu'une fois,
       et seulement si le téléphone peut les afficher. */
    .notifs {
      position: fixed; left: 0; right: 0; top: 0; z-index: 3; display: none;
      align-items: center; gap: 10px; padding: 10px 14px;
      padding-top: calc(10px + env(safe-area-inset-top, 0px));
      background: #15594a; color: #fff; box-shadow: 0 2px 10px rgba(0,0,0,.25);
      font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .notifs.visible { display: flex; }
    .notifs p { margin: 0; flex: 1; }
    .notifs button {
      border: 0; border-radius: 9px; padding: 8px 12px; font-size: 14px; font-weight: 600;
      background: #fff; color: #15594a;
    }
    .notifs button.plus-tard { background: transparent; color: #fff; font-weight: 500; }
  </style>
</head>
<body>
  <iframe id="app" title="Espace archers" allow="clipboard-write"></iframe>

  <div class="sonde" id="sondeHaut"></div>
  <div class="sonde" id="sondeBas"></div>

  <div class="notifs" id="notifs">
    <p>Être prévenu des nouveaux messages du club sur ce téléphone ?</p>
    <button type="button" id="notifsOui">Activer</button>
    <button type="button" class="plus-tard" id="notifsNon">Plus tard</button>
  </div>

  <div class="secours" id="secours">
    <p>L’application met du temps à répondre.<br>
      <a id="lienDirect" href="#">L’ouvrir directement</a></p>
  </div>

  <script>
    // ⬇ Remplacer par l'URL /exec de VOTRE déploiement Apps Script.
    var APPLICATION = 'https://script.google.com/macros/s/AKfycbyqRoX7RZV70caSdqwOw3iVkLtzwp0O7CTmN5OZbkZvtXoYrZcWShqwTL68bssyXw5PUw/exec';

    // La clé d'accès direct doit traverser l'enrobage : sans cela, le raccourci
    // rouvrirait l'écran de connexion à chaque fois.
    var adresse = APPLICATION + (location.search || '');
    var cadre = document.getElementById('app');
    var secours = document.getElementById('secours');

    document.getElementById('lienDirect').href = adresse;
    cadre.src = adresse;

    /* ------------------------------------------------------------------
       L'application vit dans le cadre, mais c'est CETTE page qui est
       installée sur l'écran d'accueil : elle seule peut poser la pastille sur
       l'icône et afficher une notification. L'application lui envoie ce qu'il
       y a à montrer ; on n'écoute que les messages venus de Google.
       ------------------------------------------------------------------ */
    function sourceFiable(origine) {
      return /^https:\/\/([a-z0-9-]+\.)*(googleusercontent\.com|google\.com)$/.test(origine);
    }

    /* ------------------------------------------------------------------
       Marges de l'écran : le cadre ne peut pas les mesurer (env() y vaut
       toujours zéro). On les mesure ici et on les lui envoie.
       ------------------------------------------------------------------ */
    var sondeHaut = document.getElementById('sondeHaut');
    var sondeBas = document.getElementById('sondeBas');

    function envoyerMarges() {
      if (!cadre.contentWindow) return;
      var installee = window.navigator.standalone === true ||
        (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
      var haut = sondeHaut.offsetHeight;
      // Depuis l'écran d'accueil, l'heure du téléphone se pose sur la page :
      // même sans encoche déclarée, il lui faut de la place.
      if (installee && haut < 20) haut = 20;
      try {
        cadre.contentWindow.postMessage(
          { arc: true, type: 'marges', haut: haut, bas: sondeBas.offsetHeight }, '*');
      } catch (e) { /* cadre pas encore prêt */ }
    }

    /* ------------------------------------------------------------------
       « Rester connecté » : l'adresse du cadre change à chaque visite, sa
       mémoire est donc perdue. Cette page-ci garde toujours la même adresse :
       c'est elle qui conserve la session, et la rend au démarrage.
       ------------------------------------------------------------------ */
    var CLE_SESSION = 'arc.session';

    function garderSession(valeur) {
      try {
        if (valeur) localStorage.setItem(CLE_SESSION, valeur);
        else localStorage.removeItem(CLE_SESSION);
      } catch (e) { /* navigation privée */ }
    }

    function rendreSession(fenetre, origine) {
      var v = null;
      try { v = localStorage.getItem(CLE_SESSION); } catch (e) { /* rien gardé */ }
      try { fenetre.postMessage({ arc: true, type: 'jeton', valeur: v }, origine); } catch (e) {}
    }

    function posterPastille(nombre) {
      try {
        if (nombre > 0 && navigator.setAppBadge) navigator.setAppBadge(nombre);
        else if (navigator.clearAppBadge) navigator.clearAppBadge();
      } catch (e) { /* téléphone sans pastille : sans conséquence */ }
    }

    function afficherNotification(titre, corps) {
      try {
        if (typeof Notification === 'undefined' || Notification.permission !== 'granted') return;
        new Notification(titre || 'Arc Club Luchonnais', {
          body: corps || '', tag: 'arc-club', icon: 'icone/icone-192.png', badge: 'icone/icone-192.png',
        });
      } catch (e) { /* refusé : la pastille suffira */ }
    }

    var bandeauNotifs = document.getElementById('notifs');
    function proposerNotifications() {
      try {
        if (localStorage.getItem('arc.notifs') === 'non') return;
      } catch (e) { /* stockage indisponible */ }
      if (typeof Notification === 'undefined' || Notification.permission !== 'default') return;
      // Hors écran d'accueil, iOS n'affiche aucune notification : inutile de demander.
      var installee = window.navigator.standalone === true ||
        (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
      var iphone = /iPad|iPhone|iPod/.test(navigator.userAgent);
      if (iphone && !installee) return;
      bandeauNotifs.classList.add('visible');
    }

    document.getElementById('notifsOui').addEventListener('click', function () {
      bandeauNotifs.classList.remove('visible');
      try {
        var d = Notification.requestPermission();
        if (d && d.then) d.then(function () { /* rien de plus à faire */ });
      } catch (e) { /* refus silencieux */ }
    });
    document.getElementById('notifsNon').addEventListener('click', function () {
      bandeauNotifs.classList.remove('visible');
      try { localStorage.setItem('arc.notifs', 'non'); } catch (e) { /* tant pis */ }
    });

    window.addEventListener('message', function (e) {
      var m = e.data;
      if (!m || m.arc !== true || !sourceFiable(e.origin)) return;
      // L'application parle : elle est donc en place pour recevoir les marges.
      envoyerMarges();
      if (m.type === 'couleurs') {
        // L'application connaît le thème choisi par l'archer : on s'y accorde.
        if (m.haut) document.documentElement.style.setProperty('--haut', m.haut);
        if (m.bas) {
          document.documentElement.style.setProperty('--bas', m.bas);
          document.documentElement.style.setProperty('--bord', m.bas);
          // iOS peint lui-même le tour de l'écran avec cette couleur : elle
          // doit être celle du bas de l'application, jamais le vert d'origine.
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', m.bas);
        }
      } else if (m.type === 'demanderJeton') {
        rendreSession(e.source, e.origin);
      } else if (m.type === 'jeton') {
        garderSession(m.valeur || null);
      } else if (m.type === 'pastille') {
        posterPastille(Number(m.nombre) || 0);
        proposerNotifications();
      } else if (m.type === 'notification') {
        afficherNotification(m.titre, m.corps);
      }
    });

    var chargee = false;
    cadre.addEventListener('load', function () { chargee = true; envoyerMarges(); });
    window.addEventListener('resize', envoyerMarges);
    window.addEventListener('orientationchange', function () { setTimeout(envoyerMarges, 250); });

    // Le secours n'apparaît que si le cadre n'a rien affiché au bout de 12 s.
    setTimeout(function () {
      if (!chargee) secours.classList.add('visible');
    }, 12000);
  </script>
</body>
</html>
