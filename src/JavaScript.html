const CRITERES_CLASSEMENT = [
  { code: 'general', label: 'Général', lire: function (l) { return l.indice; },
    afficher: function (l) { return l.indice + '<span class="muet"> /100</span>'; } },
  { code: 'moyenne', label: 'Moyenne', lire: function (l) { return l.moyenne; },
    afficher: function (l) { return l.moyenne + '<span class="muet"> pts/fl.</span>'; },
    colonne: function (p) { return p.moyenne + ' pts/fl.'; } },
  { code: 'fleches', label: 'Flèches tirées', lire: function (l) { return l.fleches; },
    afficher: function (l) { return l.fleches.toLocaleString('fr-FR'); },
    colonne: function (p) { return p.fleches + ' flèches'; } },
  { code: 'parties', label: 'Parties', lire: function (l) { return l.parties; },
    afficher: function (l) { return l.parties; } },
  { code: 'score', label: 'Meilleur score', lire: function (l) { return l.meilleurScore && l.meilleurScore.pct; },
    partie: function (l) { return l.meilleurScore; },
    afficher: function (l) {
      return l.meilleurScore.score + '/' + l.meilleurScore.max +
        '<br><span class="muet">' + l.meilleurScore.pct + ' % · ' + dateFr(l.meilleurScore.date) + '</span>';
    } },
  { code: 'volee', label: 'Meilleure volée', lire: function (l) { return l.meilleureVolee && l.meilleureVolee.pct; },
    partie: function (l) { return l.meilleureVolee; },
    afficher: function (l) {
      return l.meilleureVolee.total + '/' + l.meilleureVolee.max +
        '<br><span class="muet">volée ' + l.meilleureVolee.volee + ' · ' + dateFr(l.meilleureVolee.date) + '</span>';
    } },
  { code: 'centrage', label: 'Meilleur centrage', petitMieux: true,
    lire: function (l) { return l.meilleurCentrage && l.meilleurCentrage.cm; },
    partie: function (l) { return l.meilleurCentrage; },
    afficher: function (l) {
      return l.meilleurCentrage.cm + ' cm<br><span class="muet">du centre · ' +
        dateFr(l.meilleurCentrage.date) + '</span>';
    } },
  { code: 'centrageMoyen', label: 'Centrage moyen', petitMieux: true, lire: function (l) { return l.centrageMoyen; },
    afficher: function (l) { return l.centrageMoyen + ' cm<br><span class="muet">du centre</span>'; },
    colonne: function (p) { return p.ecart === null ? '—' : p.ecart + ' cm du centre'; } },
  { code: 'perimetre', label: 'Meilleur périmètre', petitMieux: true,
    lire: function (l) { return l.meilleurPerimetre && l.meilleurPerimetre.cm; },
    partie: function (l) { return l.meilleurPerimetre; },
    afficher: function (l) {
      return l.meilleurPerimetre.cm + ' cm<br><span class="muet">volée ' + l.meilleurPerimetre.volee +
        ' · ' + dateFr(l.meilleurPerimetre.date) + '</span>';
    } },
  { code: 'perimetreMoyen', label: 'Périmètre moyen', petitMieux: true,
    lire: function (l) { return l.perimetreMoyen; },
    afficher: function (l) { return l.perimetreMoyen + ' cm<br><span class="muet">par volée</span>'; },
    colonne: function (p) { return p.perimetre === null ? '—' : p.perimetre + ' cm / volée'; } },
  { code: 'dix', label: 'Taux de 10', lire: function (l) { return l.tauxDix; },
    afficher: function (l) { return l.tauxDix + ' %'; },
    colonne: function (p) { return p.dix + ' × 10'; } },
  { code: 'regularite', label: 'Régularité', petitMieux: true, lire: function (l) { return l.regularite; },
    afficher: function (l) { return '± ' + l.regularite + '<br><span class="muet">pts/flèche</span>'; },
    colonne: function (p) { return p.moyenne + ' pts/fl.'; } },
];

const FILTRES_CLASSEMENT_VIDES = {
  discipline: '', distance: '', periode: '', arme: '', categorie: '', minParties: '1',
};

function rendreClassement() {
  etat.classement = etat.classement || {
    critere: 'general',
    filtres: Object.assign({}, FILTRES_CLASSEMENT_VIDES),
    donnees: null,
    ouvert: null,
  };
  const c = etat.classement;
  const el = document.getElementById('classementContenu');
  const f = c.filtres;

  const choix = function (cle, valeurs, vide) {
    return '<select onchange="filtrerClassement(\'' + cle + '\', this.value)">' +
      (vide ? '<option value="">' + esc(vide) + '</option>' : '') +
      valeurs.map(function (v) {
        return typeof v === 'object' ? option(v.valeur, v.libelle, f[cle]) : option(v, v, f[cle]);
      }).join('') + '</select>';
  };

  el.innerHTML = '<div class="criteres">' + CRITERES_CLASSEMENT.map(function (k) {
      return '<button type="button" class="' + (k.code === c.critere ? 'actif' : '') +
        '" data-critere="' + k.code + '" onclick="changerCritereClassement(\'' + k.code + '\')">' +
        esc(k.label) + '</button>';
    }).join('') + '</div>' +
    '<details class="carte compacte menu-filtres" id="menuFiltresClassement"' + (c.filtresOuverts ? ' open' : '') + '>' +
    '<summary><span>Filtres</span><span class="muet" id="resumeFiltresClassement"></span></summary>' +
    '<div class="duo" style="margin-top:10px">' +
    '<div><label>Discipline</label>' + choix('discipline', (etat.ref.disciplines || []).map(function (d) {
      return { valeur: d.label, libelle: d.label };
    }), 'Toutes') + '</div>' +
    '<div><label>Distance</label>' + choix('distance', (etat.ref.distances || []).map(function (d) {
      return { valeur: d, libelle: d + ' m' };
    }), 'Toutes') + '</div>' +
    '<div><label>Période</label>' + choix('periode', [
      { valeur: '30', libelle: '30 derniers jours' }, { valeur: '90', libelle: '3 derniers mois' },
      { valeur: '365', libelle: '12 derniers mois' }], 'Depuis toujours') + '</div>' +
    '<div><label>Arme</label>' + choix('arme', etat.ref.armes || [], 'Toutes') + '</div>' +
    '<div><label>Catégorie</label>' + choix('categorie', (etat.ref.categories || []).map(function (k) {
      return { valeur: k.code, libelle: k.label };
    }), 'Toutes') + '</div>' +
    '<div><label>Parties minimum</label>' + choix('minParties', [
      { valeur: '1', libelle: '1 partie' }, { valeur: '3', libelle: '3 parties' },
      { valeur: '5', libelle: '5 parties' }, { valeur: '10', libelle: '10 parties' }]) + '</div>' +
    '</div><div class="actions" style="margin-top:10px">' +
    '<button type="button" class="secondaire" onclick="effacerFiltresClassement()">Effacer les filtres</button>' +
    '</div></details><div id="listeClassement"></div>';

  document.getElementById('menuFiltresClassement').addEventListener('toggle', function () {
    c.filtresOuverts = this.open;
  });
  majResumeFiltres();
  if (c.donnees) afficherClassement();
  else chargerClassement();
}

/** Résumé des filtres actifs, visible menu fermé. */
function majResumeFiltres() {
  const el = document.getElementById('resumeFiltresClassement');
  if (!el) return;
  const f = etat.classement.filtres;
  const actifs = [];
  if (f.discipline) actifs.push(f.discipline);
  if (f.distance) actifs.push(f.distance + ' m');
  if (f.periode) actifs.push(f.periode === '365' ? '12 mois' : f.periode === '90' ? '3 mois' : '30 jours');
  if (f.arme) actifs.push(f.arme);
  if (f.categorie) actifs.push(f.categorie);
  if (f.minParties && f.minParties !== '1') actifs.push(f.minParties + ' parties min.');
  el.textContent = actifs.length ? actifs.join(' · ') : 'aucun';
}

function chargerClassement() {
  const zone = document.getElementById('listeClassement');
  if (zone) zone.innerHTML = '<div class="chargement">Calcul du classement…</div>';
  api('apiClassementClub', etat.classement.filtres).then(function (r) {
    if (!r.ok) { notifier(r.message, true); return; }
    etat.classement.donnees = r;
    afficherClassement();
  });
}

function filtrerClassement(cle, valeur) {
  etat.classement.filtres[cle] = valeur;
  etat.classement.donnees = null;
  etat.classement.ouvert = null;
  majResumeFiltres();
  chargerClassement();
}

function effacerFiltresClassement() {
  etat.classement.filtres = Object.assign({}, FILTRES_CLASSEMENT_VIDES);
  etat.classement.donnees = null;
  etat.classement.ouvert = null;
  rendreClassement();
}

/** Changer de critère ne redemande rien au serveur : le tri se fait ici. */
function changerCritereClassement(code) {
  etat.classement.critere = code;
  etat.classement.ouvert = null;
  Array.prototype.forEach.call(document.querySelectorAll('.criteres button'), function (b) {
    b.classList.toggle('actif', b.dataset.critere === code);
  });
  afficherClassement();
}

function critereClassement() {
  const code = etat.classement.critere;
  return CRITERES_CLASSEMENT.filter(function (k) { return k.code === code; })[0];
}

function afficherClassement() {
  const zone = document.getElementById('listeClassement');
  const c = etat.classement;
  if (!zone || !c.donnees) return;
  const critere = critereClassement();

  const classes = c.donnees.archers.filter(function (l) {
    const v = critere.lire(l);
    return v !== null && v !== undefined;
  }).sort(function (a, b) {
    const d = critere.lire(a) - critere.lire(b);
    return (critere.petitMieux ? d : -d) || b.parties - a.parties;
  });
  const nonClasses = c.donnees.archers.length - classes.length;

  if (!classes.length) {
    zone.innerHTML = '<div class="vide">Aucun archer classé avec ces filtres.' +
      (/centrage|perimetre/i.test(critere.code) ? '<br>Ce critère demande des flèches pointées sur la cible.' : '') +
      '</div>';
    return;
  }

  let rang = 0;
  let precedent = null;
  const lignes = classes.map(function (l, i) {
    const v = critere.lire(l);
    if (v !== precedent) { rang = i + 1; precedent = v; }       // ex æquo : même rang
    const ouvert = c.ouvert === l.id;
    return '<div class="ligne' + (l.moi ? ' moi' : '') + (ouvert ? ' deplie' : '') +
      '" onclick="deplierArcherClassement(\'' + l.id + '\')">' +
      '<span class="rang' + (rang <= 3 ? ' r' + rang : '') + '">' + rang + '</span>' +
      '<div class="infos"><div class="nom">' + esc(l.nom) + (l.moi ? ' <span class="puce">vous</span>' : '') + '</div>' +
      '<div class="detail">' + l.parties + ' partie' + (l.parties > 1 ? 's' : '') + ' · ' +
      l.fleches.toLocaleString('fr-FR') + ' flèches · ' + l.moyenne + ' pts/fl.' +
      (l.categorie || l.arme ? ' · ' + esc([l.categorie, l.arme].filter(Boolean).join(' ')) : '') +
      '</div></div><div class="valeur-classement">' + critere.afficher(l) + '</div>' +
      '<span class="chevron">' + (ouvert ? '▴' : '▾') + '</span></div>' +
      (ouvert ? '<div class="detail-classement" id="detailClassement"></div>' : '');
  }).join('');

  const p = c.donnees.poids || {};
  zone.innerHTML = '<div class="titre-section"><h2>' + esc(critere.label) + '</h2>' +
    '<span class="muet">' + classes.length + ' archer' + (classes.length > 1 ? 's' : '') + ' classé' +
    (classes.length > 1 ? 's' : '') + '</span></div>' +
    '<div class="carte">' + lignes + '</div>' +
    (nonClasses ? '<p class="muet">' + nonClasses + ' archer' + (nonClasses > 1 ? 's' : '') +
      ' sans donnée pour ce critère.</p>' : '') +
    (critere.code === 'general'
      ? '<div class="carte compacte"><p class="muet" style="margin:0">L’indice général compare chaque ' +
        'archer au meilleur du club : moyenne par flèche (' + p.moyenne + ' %), meilleur score (' +
        p.meilleurScore + ' %), centrage moyen (' + p.centrage + ' %), périmètre moyen (' + p.perimetre +
        ' %), flèches tirées (' + p.fleches + ' %) et nombre de parties (' + p.parties + ' %). Sans flèches ' +
        'pointées sur la cible, centrage et périmètre ne comptent pas : l’archer n’est pas pénalisé.</p></div>'
      : '') +
    (/centrage/.test(critere.code)
      ? '<p class="muet">Centrage : distance entre le centre du groupe de flèches et le centre de ' +
        'la cible. Plus elle est courte, mieux c’est.</p>' : '') +
    (/perimetre/.test(critere.code)
      ? '<p class="muet">Périmètre : longueur d’une ficelle passée autour des flèches d’une volée. ' +
        'Plus elle est courte, plus les flèches sont groupées. Pensez au filtre Distance : ' +
        'un groupe à 18 m et à 50 m ne se comparent pas.</p>' : '');

  if (c.ouvert) remplirDetailClassement();
}

/** Toucher un archer déplie, sous sa ligne, la partie ou les parties concernées. */
function deplierArcherClassement(id) {
  const c = etat.classement;
  c.ouvert = c.ouvert === id ? null : id;
  c.partieOuverte = null;
  afficherClassement();
  const zone = document.getElementById('detailClassement');
  if (zone) zone.previousElementSibling.scrollIntoView({ block: 'start', behavior: 'smooth' });
}

function archerOuvertClassement() {
  const c = etat.classement;
  return c.donnees.archers.filter(function (l) { return l.id === c.ouvert; })[0];
}

function remplirDetailClassement() {
  const zone = document.getElementById('detailClassement');
  const l = archerOuvertClassement();
  if (!zone || !l) return;
  const critere = critereClassement();
  const record = critere.partie ? critere.partie(l) : null;
  const c = etat.classement;

  // Record porté par une partie : on l'affiche directement.
  if (record && !c.partieOuverte) {
    ouvrirPartieClassement(record.id, false);
    return;
  }
  if (c.partieOuverte) {
    ouvrirPartieClassement(c.partieOuverte, true);
    return;
  }

  // Critère calculé sur plusieurs parties : on les liste.
  const colonne = critere.colonne || function (p) { return p.score + '/' + p.max; };
  zone.innerHTML = '<div class="titre-section" style="margin-top:4px"><h3>Parties retenues</h3>' +
    '<span class="muet">' + l.liste.length + '</span></div>' +
    l.liste.map(function (p) {
      return '<div class="ligne" onclick="event.stopPropagation();ouvrirPartieClassement(\'' + p.id + '\', true)">' +
        '<div class="infos"><div class="nom">' + esc(p.seance) + '</div>' +
        '<div class="detail">' + dateFr(p.date) + (p.blason ? ' · ' + esc(p.blason) : '') +
        ' · ' + p.score + '/' + p.max + '</div></div>' +
        '<div class="valeur-classement">' + esc(colonne(p)) + '</div></div>';
    }).join('');
}

/** Détail d'une partie dans le classement. `depuisListe` : bouton de retour à la liste. */
function ouvrirPartieClassement(id, depuisListe) {
  const zone = document.getElementById('detailClassement');
  if (!zone) return;
  const c = etat.classement;
  const l = archerOuvertClassement();
  c.partieOuverte = depuisListe ? id : null;
  zone.innerHTML = '<div class="chargement">Chargement de la partie…</div>';
  api('apiStatistiquesPartie', id).then(function (r) {
    const ici = document.getElementById('detailClassement');
    if (!ici || c.ouvert !== (l && l.id)) return;
    if (!r.ok) { ici.innerHTML = '<div class="vide">' + esc(r.message) + '</div>'; return; }
    const critere = critereClassement();
    const record = critere.partie && l ? critere.partie(l) : null;
    ici.innerHTML = '<div class="actions" style="margin:4px 0 12px">' +
      (depuisListe || (record && l.liste.length > 1)
        ? '<button class="secondaire" onclick="event.stopPropagation();listePartiesClassement()">' +
          (depuisListe ? '← Parties' : 'Toutes ses parties') + '</button>' : '') +
      '<button class="secondaire" onclick="event.stopPropagation();voirStatsPartie(\'' + r.partie.id +
      '\', \'' + (l ? l.id : '') + '\')">Statistiques</button></div>' +
      detailSeance(r);
  });
}

function listePartiesClassement() {
  const c = etat.classement;
  c.partieOuverte = null;
  const zone = document.getElementById('detailClassement');
  if (!zone) return;
  // Force la liste, même pour un critère à record.
  const critere = critereClassement();
  const partie = critere.partie;
  critere.partie = null;
  try { remplirDetailClassement(); } finally { critere.partie = partie; }
}

/**
 * Lien personnel à mettre en signet : il ouvre l'application déjà connectée.
 * Indispensable sur téléphone, où le raccourci repart d'une page vierge à
 * chaque fois.
 */
function creerLienDirect() {
  api('apiLienDirect').then(function (r) {
    if (!r.ok) { notifier(r.message, true); return; }
    modale('<h2>Mon lien d’accès direct</h2>' +
      '<p class="muet">Ce lien ouvre l’application déjà connectée sous le nom de ' +
      esc(r.nom) + '. Gardez-le pour vous : il vaut mot de passe.</p>' +
      '<div class="champ"><textarea id="lienDirect" readonly ' +
      'style="min-height:96px;font-size:12.5px">' + esc(r.url) + '</textarea></div>' +
      '<div class="actions"><button class="principal" onclick="copierLien()">Copier le lien</button>' +
      '<button class="secondaire" onclick="fermerModale()">Fermer</button></div>' +
      '<div class="carte" style="margin-top:14px"><strong>Le mettre sur l’écran d’accueil</strong>' +
      '<ol class="muet" style="margin:8px 0 0;padding-left:18px;line-height:1.7">' +
      '<li>Copiez le lien, ouvrez-le dans Safari ou Chrome.</li>' +
      '<li>Menu <em>Partager</em> ▸ <em>Sur l’écran d’accueil</em>.</li>' +
      '<li>Le raccourci ouvrira l’application sans rien saisir.</li>' +
      '</ol></div>' +
      '<p class="muet" style="margin-top:12px">Le lien reste valable un an, et cesse ' +
      'de fonctionner dès que vous changez votre mot de passe.</p>');
  });
}

function copierLien() {
  const champ = document.getElementById('lienDirect');
  if (!champ) return;
  champ.select();
  champ.setSelectionRange(0, 99999);
  const fini = function (ok) {
    notifier(ok ? 'Lien copié.' : 'Copie impossible : sélectionnez le texte à la main.', !ok);
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(champ.value).then(function () { fini(true); },
      function () { fini(false); });
  } else {
    fini(document.execCommand && document.execCommand('copy'));
  }
}

function ouvrirChangementMotDePasse(obligatoire) {
  modale((obligatoire
      ? '<h2>Choisissez votre mot de passe</h2>' +
        '<p class="muet">Votre compte utilise encore le mot de passe de départ, que tout le ' +
        'monde connaît. Choisissez-en un autre pour que vos scores restent à vous.</p>'
      : '<h2>Changer mon mot de passe</h2>') +
    '<form id="formMotDePasse" style="margin-top:14px">' +
    '<div class="champ"><label>Mot de passe actuel</label>' +
    '<input id="mActuel" type="password" autocomplete="current-password" required' +
    (obligatoire ? ' value="' + esc(etat.motDePasseDefaut || '') + '"' : '') + '></div>' +
    '<div class="champ"><label>Nouveau mot de passe (4 caractères minimum)</label>' +
    '<input id="mNouveau" type="password" autocomplete="new-password" minlength="4" required></div>' +
    '<div class="actions"><button type="submit" class="principal">Enregistrer</button>' +
    (obligatoire
      ? '<button type="button" class="secondaire" onclick="reporterMotDePasse()">Plus tard</button>'
      : '<button type="button" class="secondaire" onclick="fermerModale()">Annuler</button>') +
    '</div></form>');

  document.getElementById('formMotDePasse').addEventListener('submit', function (e) {
    e.preventDefault();
    api('apiChangerMotDePasse', document.getElementById('mActuel').value,
      document.getElementById('mNouveau').value).then(function (r) {
      notifier(r.ok ? r.message : r.message, !r.ok);
      if (r.ok) {
        etat.motDePasseParDefaut = false;
        fermerModale();
        rendreProfil();
      }
    });
  });
}

/**
 * « Plus tard » : la demande revient à la prochaine ouverture, et un rappel
 * reste visible tant que le mot de passe de départ n'a pas changé.
 */
function reporterMotDePasse() {
  fermerModale();
  notifier('Mot de passe inchangé : n’importe qui peut ouvrir votre compte. ' +
    'Changez-le dans l’onglet Profil.', true);
}

/* ---------- Amorçage ---------- */

(function () {
  // Un lien d'accès direct porte le jeton dans son adresse : c'est le seul
  // moyen fiable de rester connecté, la mémoire du navigateur étant perdue
  // d'une visite à l'autre dans le cadre où Google affiche l'application.
  const direct = typeof JETON_INITIAL === 'string' ? JETON_INITIAL : '';
  const memorise = direct || jetonMemorise();
  if (!memorise) return;

  jeton = memorise;
  if (direct) memoriserJeton(direct, true);
  // Pas de vérification préalable : le démarrage contrôle lui-même la session,
  // ce qui économise un aller-retour complet avec le serveur.
  document.getElementById('ecranConnexion').style.display = 'none';
  // Affichage immédiat avec la dernière réponse connue, s'il y en a une.
  const garde = demarrageMemorise();
  if (garde) {
    try {
      appliquerDemarrage(garde, true);
    } catch (e) {
      console.warn('Affichage immédiat impossible : ' + (e && e.message));
      document.getElementById('ecranChargement').style.display = '';
    }
  } else {
    document.getElementById('ecranChargement').style.display = '';
  }
  demarrer();
})();
</script>
