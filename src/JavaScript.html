    id: 'gRangs', actif: (etat.graphesActifs || {}).gRangs,
    mesures: mesuresRangs([{ nom: nomArcher, parVolee: an.parVolee }]),
  });
  if (grapheRangs) {
    html += '<div class="titre-section"><h2>Au fil des volées</h2></div><div class="carte">' + grapheRangs + '</div>';
  }

  html += '<div class="titre-section"><h2>Liste des parties</h2></div><div class="carte">';
  html += (s.parties || []).map(function (p) {
    return '<div class="ligne" onclick="filtrerStats(\'scoreId\', \'' + p.id + '\')">' +
      '<div class="infos"><div class="nom">' + esc(p.seance || p.discipline) +
      (p.distance ? ' · ' + p.distance + ' m' : '') + '</div>' +
      '<div class="detail">' + dateFr(p.date) +
      (p.lieu ? ' · ' + esc(p.lieu) : '') +
      (p.groupement ? ' · périmètre ' + p.groupement.perimetre + ' cm' : '') + '</div></div>' +
      '<div style="text-align:right"><div style="font-weight:700">' + p.score + '</div>' +
      '<div class="muet" style="font-size:11.5px">' + p.moyenne + ' pts/fl.</div></div></div>';
  }).join('') + '</div>';

  el.innerHTML = html;
}

/**
 * Mesures affichées sous la carte des impacts : celles de l'ensemble, et
 * celles de chaque partie — elles s'affichent quand le curseur du graphique
 * passe sur son point.
 */
function tableMesuresParties(s, an) {
  const g = s.groupement || {};
  const bloc = function (ecart, perimetre, dispersion, note) {
    return '<div class="grille-3" style="margin-bottom:4px">' +
      stat(ecart === null || ecart === undefined ? '—' : ecart + ' cm', 'Centrage') +
      stat(perimetre === null || perimetre === undefined ? '—' : perimetre + ' cm', 'Périmètre / volée') +
      stat(dispersion === null || dispersion === undefined ? '—' : dispersion + ' cm', 'Dispersion') +
      '</div>' + (note ? '<p class="muet" style="margin:6px 0 0;text-align:center">' + note + '</p>' : '');
  };
  const table = {
    '*': bloc(g.ecartCentre, an.perimetre || null, g.rayonMoyen,
      an.parties.length + ' partie(s) · ' + s.nbFleches + ' flèches · ' + s.moyenneFleche + ' pts/flèche'),
  };
  (an.parties || []).forEach(function (p) {
    table[p.id] = bloc(p.ecartCentre, p.perimetre, p.dispersion,
      '<strong>' + dateFr(p.date) + '</strong>' + (p.seance ? ' · ' + esc(p.seance) : '') +
      ' · ' + p.score + '/' + p.max + ' · ' + p.moyenne + ' pts/flèche' +
      (p.jaunes !== null ? ' · ' + p.jaunes + ' % jaunes' : ''));
  });
  return table;
}

/** Bandeau de filtres : archer, séance, période, discipline, distance, lieu. */
function filtresStats(s, f) {
  let html = '<div class="carte compacte">';

  if (etat.voitScores) {
    html += '<div class="champ" style="margin-bottom:10px"><label>Archer</label>' +
      '<select onchange="changerArcherStats(this.value)">' +
      (etat.inscrits || []).map(function (a) {
        return option(a.id, a.prenom + ' ' + a.nom, etat.statsArcher);
      }).join('') + '</select></div>';
  }

  html += '<div class="champ" style="margin-bottom:10px"><label>Séance</label>' +
    '<select onchange="filtrerStats(\'scoreId\', this.value)">' +
    '<option value="">Toutes les parties</option>' +
    (s.filtres.seances || []).map(function (p) {
      return option(p.id, dateFr(p.date) + ' — ' + (p.seance || p.discipline) +
        (p.lieu ? ' (' + p.lieu + ')' : '') + ' · ' + p.score, f.scoreId);
    }).join('') + '</select></div>';

  if (!f.scoreId) {
    html += '<div class="champ" style="margin-bottom:10px"><label>Période</label>' +
      '<select onchange="filtrerStats(\'periode\', this.value)">' +
      [{ v: '', l: 'Depuis toujours' }, { v: '30', l: '30 derniers jours' },
       { v: '90', l: '3 derniers mois' }, { v: '365', l: '12 derniers mois' },
       { v: 'perso', l: 'Dates précises…' }].map(function (o) {
        return option(o.v, o.l, f.periode);
      }).join('') + '</select></div>' +
      (f.periode === 'perso'
        ? '<div class="duo" style="margin-bottom:10px">' +
          '<div><label>Du</label><input type="date" value="' + esc(f.depuis || '') +
          '" onchange="filtrerStats(\'depuis\', this.value)"></div>' +
          '<div><label>Au</label><input type="date" value="' + esc(f.jusqua || '') +
          '" onchange="filtrerStats(\'jusqua\', this.value)"></div></div>'
        : '') +
      '<div class="duo">' +
      '<div><label>Discipline</label><select onchange="filtrerStats(\'discipline\', this.value)">' +
      '<option value="">Toutes</option>' +
      (s.filtres.disciplines || []).map(function (d) { return option(d, d, f.discipline); }).join('') +
      '</select></div>' +
      '<div><label>Distance</label><select onchange="filtrerStats(\'distance\', this.value)">' +
      '<option value="">Toutes</option>' +
      (s.filtres.distances || []).map(function (d) { return option(d, d + ' m', f.distance); }).join('') +
      '</select></div></div>' +
      ((s.filtres.lieux || []).length
        ? '<div class="champ" style="margin:10px 0 0"><label>Lieu</label>' +
          '<select onchange="filtrerStats(\'lieu\', this.value)">' +
          '<option value="">Tous</option>' +
          s.filtres.lieux.map(function (l) { return option(l, l, f.lieu); }).join('') +
          '</select></div>'
        : '');
  }

  if (estFiltre(f)) {
    html += '<div class="actions"><button class="secondaire" onclick="reinitialiserFiltres()">' +
      'Voir toutes les parties</button></div>';
  }
  return html + '</div>';
}

function changerArcherStats(id) {
  etat.statsFiltres = {};
  chargerStats(id, {});
}

/** Ouvre l'onglet Statistiques sur un archer donné. */
function voirStats(adherentId) {
  fermerModale();
  etat.statsFiltres = {};
  allerA('Progression');
  const b = document.querySelector('#sousOnglets button[data-sous="Stats"]');
  if (b) b.click();
  chargerStats(adherentId);
}

function estFiltre(f) {
  return !!(f.scoreId || f.discipline || f.distance || f.lieu || f.depuis || f.jusqua || f.periode);
}

/** Applique un filtre et recharge : séance, période, discipline, distance ou lieu. */
function filtrerStats(champ, valeur) {
  const f = etat.statsFiltres || {};
  f[champ] = valeur;

  if (champ === 'scoreId' && valeur) {
    // Une séance précise l'emporte sur les bornes de période.
    f.periode = ''; f.depuis = ''; f.jusqua = '';
  }
  if (champ === 'periode') {
    if (valeur === 'perso') {
      f.depuis = f.depuis || '';
      f.jusqua = f.jusqua || '';
    } else {
      f.jusqua = '';
      f.depuis = valeur ? ilYAJours(Number(valeur)) : '';
    }
  }
  etat.statsFiltres = f;
  chargerStats(etat.statsArcher, f);
}

function reinitialiserFiltres() {
  etat.statsFiltres = {};
  chargerStats(etat.statsArcher, {});
}

/** Date ISO d'il y a n jours. */
function ilYAJours(n) {
  const d = new Date(Date.now() - n * 86400000);
  const p = function (x) { return (x < 10 ? '0' : '') + x; };
  return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
}

/**
 * Ouvre une partie dans l'onglet Statistiques, qui en donne le détail complet
 * sur toute la largeur de la page. `adherentId` sert quand la partie vient de
 * la vue « Tous les archers ».
 */
function voirStatsPartie(id, adherentId) {
  fermerModale();
  etat.statsFiltres = { scoreId: id };
  const archer = adherentId ||
    (etat.progressionArcher && etat.progressionArcher !== 'club' ? etat.progressionArcher : null) ||
    etat.statsArcher || etat.moi.id;
  allerA('Progression');
  const b = document.querySelector('#sousOnglets button[data-sous="Stats"]');
  if (b) b.click();
  chargerStats(archer, etat.statsFiltres);
  window.scrollTo(0, 0);
}

/** Histogramme du nombre de flèches par valeur de zone (10 → M). */
function histogrammeZones(synthese) {
  const data = synthese.parZone;
  const maxi = Math.max.apply(null, data.map(function (z) { return z.nombre; })) || 1;
  return '<div class="histo">' + data.map(function (z) {
    const h = Math.round((z.nombre / maxi) * 100);
    return '<div class="colonne" title="' + z.nombre + ' flèche(s) — ' + z.pourcentage + ' %">' +
      '<div class="nombre">' + (z.nombre || '') + '</div>' +
      '<div class="barre-v" style="height:' + h + '%;background:' + couleurZoneFixe(z.valeur) + '"></div></div>';
  }).join('') + '</div>' +
  '<div class="histo" style="height:auto;align-items:flex-start">' + data.map(function (z) {
    return '<div class="colonne"><div class="etiquette">' + z.zone + '</div></div>';
  }).join('') + '</div>';
}

/** Barre empilée par couronne du blason + légende. */
function couronnes(synthese) {
  const data = synthese.parCouronne.filter(function (c) { return c.nombre; });
  if (!data.length) return '';
  return '<div class="empile">' + data.map(function (c) {
    return '<span style="width:' + c.pourcentage + '%;background:' + c.couleur + '" title="' +
      esc(c.label) + ' : ' + c.nombre + '"></span>';
  }).join('') + '</div><div class="legende">' + data.map(function (c) {
    return '<span><span class="pastille-c" style="background:' + c.couleur + '"></span>' +
      esc(c.label) + ' ' + c.pourcentage + ' %</span>';
  }).join('') + '</div>';
}

/* ---------- Comparaison de deux archers ---------- */

function rendreComparaison() {
  const el = document.getElementById('comparaisonContenu');
  const libre = etat.voitScores;             // choix libre des archers
  const actifs = (etat.inscrits || []).filter(function (a) { return a.statut !== 'Inactif'; });
  if (libre && !actifs.length) {
    el.innerHTML = '<div class="vide">Aucun archer inscrit à comparer.</div>';
    return;
  }

  // Deux façons de comparer : deux archers, ou deux parties d'un même archer.
  let c = etat.comparaison;
  if (!c) {
    const autre = actifs.filter(function (x) { return x.id !== etat.moi.id; })[0];
    c = { mode: libre && autre ? 'archers' : 'parties', a: etat.moi.id,
      b: autre ? autre.id : etat.moi.id, archer: etat.moi.id, seanceA: '', seanceB: '' };
  }
  if (!libre) { c.mode = 'parties'; c.archer = etat.moi.id; }
  if (c.mode === 'parties') { c.a = c.archer; c.b = c.archer; }
  etat.comparaison = c;

  const choixArcher = function (cle, valeur) {
    return '<select onchange="changerComparaison(\'' + cle + '\', this.value)">' +
      actifs.map(function (a) { return option(a.id, a.prenom + ' ' + a.nom, valeur); }).join('') +
      '</select>';
  };

  el.innerHTML =
    (libre
      ? '<div class="segment" style="margin-bottom:12px">' +
        '<button type="button" class="' + (c.mode === 'archers' ? 'actif' : '') +
        '" onclick="changerComparaison(\'mode\', \'archers\')">Deux archers</button>' +
        '<button type="button" class="' + (c.mode === 'parties' ? 'actif' : '') +
        '" onclick="changerComparaison(\'mode\', \'parties\')">Deux parties d’un archer</button></div>'
      : '') +
    '<div class="carte compacte">' +
    (c.mode === 'archers'
      ? '<div class="duo"><div><label>Archer 1</label>' + choixArcher('a', c.a) + '</div>' +
        '<div><label>Archer 2</label>' + choixArcher('b', c.b) + '</div></div>' +
        '<p class="muet" style="margin:10px 0 0">Toutes les parties de chacun. Pour comparer ' +
        'deux séances précises, passez à « Deux parties d’un archer ».</p>'
      : (libre
        ? '<div class="champ" style="margin-bottom:10px"><label>Archer</label>' +
          choixArcher('archer', c.archer) + '</div>'
        : '<p class="muet" style="margin:0 0 10px">Comparez deux de vos séances, ou l’ensemble ' +
          'de vos séances à l’une d’elles.</p>') +
      '<div class="duo" id="choixSeancesComparaison"></div>') +
    '</div><div id="resultatComparaison" class="chargement">Comparaison en cours…</div>';

  const filtre = function (scoreId) { return scoreId ? { scoreId: scoreId } : {}; };
  const optionsA = c.mode === 'parties' ? filtre(c.seanceA) : {};
  const optionsB = c.mode === 'parties' ? filtre(c.seanceB) : {};
  api('apiComparaison', c.a, c.b, optionsA, optionsB).then(function (r) {
    const zone = document.getElementById('resultatComparaison');
    if (!zone) return;
    zone.className = '';
    if (!r.ok) { zone.innerHTML = '<div class="vide">' + esc(r.message) + '</div>'; return; }

    if (c.mode === 'parties') {
      const menu = function (cle, valeur, numero) {
        return '<div><label>Partie ' + numero + '</label>' +
          '<select onchange="changerComparaison(\'' + cle + '\', this.value)">' +
          '<option value="">Toutes les séances</option>' +
          (r.a.seances || []).map(function (p) {
            return option(p.id, dateFr(p.date) + ' — ' + (p.seance || p.discipline) + ' · ' + p.score, valeur);
          }).join('') + '</select></div>';
      };
      const zoneSeances = document.getElementById('choixSeancesComparaison');
      if (zoneSeances) zoneSeances.innerHTML = menu('seanceA', c.seanceA, 1) + menu('seanceB', c.seanceB, 2);
      if (!(r.a.seances || []).length) {
        zone.innerHTML = '<div class="vide">Aucune partie enregistrée pour cet archer.</div>';
        return;
      }
      // Premier affichage : l'ensemble des séances face à la dernière.
      if (!c.seanceA && !c.seanceB && !c.seancesPretes) {
        c.seancesPretes = true;
        c.seanceB = r.a.seances[0].id;
        rendreComparaison();
        return;
      }
    }
    zone.innerHTML = r.memeSelection
      ? '<div class="vide">Choisissez deux parties différentes pour les comparer.</div>'
      : comparaisonHtml(r);
  });
}

function changerComparaison(cle, valeur) {
  const c = etat.comparaison || {};
  c[cle] = valeur;
  // Changer d'archer en mode « parties » remet les deux choix de séance.
  if (cle === 'archer' || cle === 'mode') { c.seanceA = ''; c.seanceB = ''; c.seancesPretes = false; }
  etat.comparaison = c;
  rendreComparaison();
}

function comparaisonHtml(r) {
  // Deux séances d'un même archer : les colonnes portent la séance, pas le nom.
  const meme = r.a.id === r.b.id;
  const nomAffiche = function (x) {
    if (!meme) return x.nom;
    return x.partie
      ? dateFr(x.partie.date) + (x.partie.seance ? ' · ' + x.partie.seance : '')
      : 'Toutes les séances';
  };
  const a = Object.assign({}, r.a, { nom: nomAffiche(r.a) });
  const b = Object.assign({}, r.b, { nom: nomAffiche(r.b) });
  const mieux = function (x, y, grandMieux) {
    if (x === y || x === null || y === null) return ['', ''];
    const gagne = grandMieux ? x > y : x < y;
    return gagne ? ['gagnant', ''] : ['', 'gagnant'];
  };

  const ligne = function (libelle, va, vb, grandMieux, suffixe) {
    const cl = mieux(va, vb, grandMieux);
    const fmt = function (v, classe) {
      return '<td class="' + classe + '">' +
        (v === null || v === undefined || v === '' ? '—' : v + (suffixe || '')) + '</td>';
    };
    return '<tr><td>' + esc(libelle) + '</td>' + fmt(va, cl[0]) + fmt(vb, cl[1]) + '</tr>';
  };

  const an = function (x, cle) {
    const v = x.analyse ? x.analyse[cle] : null;
    return v === 0 && (cle === 'perimetre' || cle === 'aire') ? null : v;
  };
  // Une séance : régularité de ses volées ; un ensemble : régularité des parties.
  const regularite = function (x) {
    if (x.partie && x.analyse && x.analyse.parties[0]) return x.analyse.parties[0].regularite;
    return x.analyse ? x.analyse.regularite : null;
  };
  let html = '<table class="tableau comparaison"><thead><tr><th></th>' +
    '<th>' + esc(a.nom) + '</th><th>' + esc(b.nom) + '</th></tr></thead><tbody>' +
    ligne('Catégorie', a.categorie, b.categorie) +
    ligne('Arme', a.arme, b.arme) +
    ligne('Parties', a.nbParties, b.nbParties, true) +
    ligne('Flèches', a.nbFleches, b.nbFleches, true) +
    ligne('Moyenne par flèche', a.moyenneFleche, b.moyenneFleche, true) +
    ligne('% jaunes (9-10)', an(a, 'jaunes'), an(b, 'jaunes'), true, ' %') +
    ligne('% de 10', an(a, 'dix'), an(b, 'dix'), true, ' %') +
    ligne('Centrage (écart au centre)', a.groupement ? a.groupement.ecartCentre : null,
          b.groupement ? b.groupement.ecartCentre : null, false, ' cm') +
    ligne('Dispersion', a.groupement ? a.groupement.rayonMoyen : null,
          b.groupement ? b.groupement.rayonMoyen : null, false, ' cm') +
    ligne('Périmètre moyen / volée', an(a, 'perimetre'), an(b, 'perimetre'), false, ' cm') +
    ligne('Surface moyenne / volée', an(a, 'aire'), an(b, 'aire'), false, ' cm²') +
    ligne(a.partie && b.partie ? 'Écart-type des volées' : 'Écart-type des parties',
          regularite(a), regularite(b), false) +
    ligne('Meilleure volée', a.analyse && a.analyse.meilleureVolee
            ? a.analyse.meilleureVolee.total + '/' + a.analyse.meilleureVolee.max : null,
          b.analyse && b.analyse.meilleureVolee
            ? b.analyse.meilleureVolee.total + '/' + b.analyse.meilleureVolee.max : null) +
    ligne('Meilleure partie', a.meilleure ? a.meilleure.score + '/' + a.meilleure.max : null,
          b.meilleure ? b.meilleure.score + '/' + b.meilleure.max : null) +
    '</tbody></table>';

  html = '<div class="carte">' + html +
    '<p class="muet" style="margin:10px 0 0">La valeur la plus favorable est mise en avant. ' +
    'Un périmètre plus court vaut mieux : les flèches sont plus groupées.</p></div>';

  if ((a.impacts || []).length || (b.impacts || []).length) {
    html += '<div class="titre-section"><h2>Cartes des impacts</h2></div>' +
      '<div class="carte"><div class="duo">' +
      [a, b].map(function (x) {
        return '<div><div class="etiquette-mini">' + esc(x.nom) + '</div>' +
          ((x.impacts || []).length
            ? dessinerCible({ blason: x.blasonReference, rayon: x.rayonReference, impacts: x.impacts, centre: x.groupement })
            : '<div class="vide" style="padding:14px">Aucune flèche pointée</div>') + '</div>';
      }).join('') + '</div></div>';
  }

  // Deux séances : volée par volée ; sinon partie par partie.
  const profils = [a, b];
  let evolution = '';
  if (a.volees && b.volees) {
    evolution = grapheMesures({ id: 'gComp', actif: (etat.graphesActifs || {}).gComp, mesures: mesuresVolees(profils) });
    if (evolution) {
      html += '<div class="titre-section"><h2>Volée par volée</h2></div><div class="carte">' + evolution + '</div>';
    }
  } else {
    evolution = grapheMesures({
      id: 'gComp', actif: (etat.graphesActifs || {}).gComp,
      mesures: mesuresParties(profils.map(function (x) {
        return { nom: x.nom, parties: (x.analyse && x.analyse.parties) || [] };
      }), true),
    });
    if (evolution) {
      html += '<div class="titre-section"><h2>Évolution comparée</h2>' +
        '<span class="muet">une séance seule apparaît en pointillés</span></div>' +
        '<div class="carte">' + evolution + '</div>';
    } else if ((a.evolution || []).length > 1 || (b.evolution || []).length > 1) {
      html += '<div class="titre-section"><h2>Évolution comparée</h2>' +
        '<span class="muet">moyenne par flèche</span></div>' +
        '<div class="carte">' + courbeDouble(a, b) + '</div>';
    }
  }

  // Répartition des touches, zone par zone, en pourcentage.
  if (a.synthese && b.synthese && (a.synthese.total || b.synthese.total)) {
    const zones = (a.synthese.parZone || []).map(function (z) { return z.zone; });
    const g = grapheMesures({
      id: 'gCompZones',
      mesures: [{ code: 'zones', libelle: 'Zones touchées', unite: '%', type: 'barres', groupe: true, aligne: true,
        etiquettes: zones,
        aide: 'Part des flèches dans chaque zone, pour comparer à nombre de flèches différent.',
        series: profils.map(function (x) {
          return { nom: x.nom, points: (x.synthese.parZone || []).map(function (z) {
            return { v: x.synthese.total ? z.pourcentage : null, texte: '<span class="muet">(' + z.nombre + ')</span>' };
          }) };
        }) }],
    });
    if (g) {
      html += '<div class="titre-section"><h2>Répartition des touches</h2></div><div class="carte">' + g +
        profils.map(function (x) {
          return x.synthese.total
            ? '<div class="etiquette-mini" style="margin-top:12px">' + esc(x.nom) + '</div>' + couronnes(x.synthese) : '';
        }).join('') + '</div>';
    }
  }

  const rangs = grapheMesures({
    id: 'gCompRangs', actif: (etat.graphesActifs || {}).gCompRangs,
    mesures: mesuresRangs(profils.map(function (x) {
      return { nom: x.nom, parVolee: x.analyse && x.analyse.parVolee };
    })),
  });
  if (rangs) html += '<div class="titre-section"><h2>Au fil des volées</h2></div><div class="carte">' + rangs + '</div>';
  return html;
}

/* ---------- Graphique à mesures multiples, relié à un blason ---------- */

/*
 * Un graphique, plusieurs mesures au choix (puces au-dessus). Chaque point
 * peut porter un `lien` (partie ou volée) : sous le doigt ou la souris, seules
 * les flèches correspondantes restent visibles sur le blason relié
 * (`cible` : id du bloc qui contient ce blason) ; sinon toutes y sont.
 *
 * mesure : { code, libelle, unite, sens ('haut' | 'bas'), type ('ligne' |
 *   'barres'), groupe (barres côte à côte), aligne (même abscisse pour toutes
 *   les séries), etiquettes (abscisses alignées), aide,
 *   series: [{ nom, couleur, points: [{ v, texte, lien, etiquette }] }] }
 */
const COULEURS_SERIES = ['var(--accent)', 'var(--z-rouge)', 'var(--or)', 'var(--z-bleu)'];

function grapheMesures(o) {
  o.mesures = (o.mesures || []).filter(function (m) {
    const n = m.series.reduce(function (t, x) {
      return Math.max(t, x.points.filter(function (p) { return p && p.v !== null && p.v !== undefined; }).length);
    }, 0);
    return n >= (m.aligne ? 1 : 2);
  });
  if (!o.mesures.length) return '';
  etat.graphes = etat.graphes || {};
  etat.graphes[o.id] = o;
  if (!o.mesures.some(function (m) { return m.code === o.actif; })) o.actif = o.mesures[0].code;
  return '<div class="graphe-mesures" id="' + o.id + '">' + contenuGrapheMesures(o) + '</div>';
}

function contenuGrapheMesures(o) {
  const m = o.mesures.filter(function (x) { return x.code === o.actif; })[0];
  if (o.ouvrir) m.ouvrir = o.ouvrir;
  const puces = o.mesures.length > 1
    ? '<div class="criteres mesures">' + o.mesures.map(function (x) {
      return '<button type="button" class="' + (x.code === o.actif ? 'actif' : '') +
        '" onclick="changerMesure(\'' + o.id + '\', \'' + x.code + '\')">' + esc(x.libelle) + '</button>';
    }).join('') + '</div>'
    : '';
  return puces + dessinMesure(m, o.cible) +
    (m.aide ? '<p class="muet" style="margin:6px 0 0;font-size:12px">' + esc(m.aide) + '</p>' : '');
}

function changerMesure(id, code) {
  etat.graphesActifs = etat.graphesActifs || {};
  etat.graphesActifs[id] = code;
  const o = (etat.graphes || {})[id];
  const el = document.getElementById(id);
  if (!o || !el) return;
  o.actif = code;
  const rang = el.querySelector('.criteres');
  const defilement = rang ? rang.scrollLeft : 0;
  el.innerHTML = contenuGrapheMesures(o);
  // La rangée de pilules garde sa position : celle qu'on vient de toucher
  // reste sous le doigt au lieu de repartir au début.
  const nouveau = el.querySelector('.criteres');
  if (nouveau) {
    nouveau.scrollLeft = defilement;
    const actif = nouveau.querySelector('button.actif');
    if (actif && actif.scrollIntoView) {
      actif.scrollIntoView({ block: 'nearest', inline: 'nearest' });
    }
  }
  if (o.cible) revelerImpacts(o.cible, null);
}

function formatMesure(v, m) {
  if (v === null || v === undefined) return '—';
  const u = m.unite || '';
  const txt = (Math.round(v * 100) / 100).toLocaleString('fr-FR');
  return txt + (u ? (u === '%' ? ' %' : ' ' + u) : '');
}

function dessinMesure(m, cible) {
  const L = 300, H = 150, marge = 26, basAxe = H - 18;
  const series = m.series.map(function (x, k) {
    return Object.assign({ couleur: COULEURS_SERIES[k % COULEURS_SERIES.length] }, x);
  });
  const valeurs = [];
  series.forEach(function (x) {
    x.points.forEach(function (p) { if (p && p.v !== null && p.v !== undefined) valeurs.push(p.v); });
  });
  let mini = Math.min.apply(null, valeurs);
  let maxi = Math.max.apply(null, valeurs);
  const depuisZero = m.type === 'barres' && m.zero !== false;
  if (depuisZero && mini >= 0) mini = 0;
  let ech = graduations(mini, maxi, 4);
  // La plus faible valeur doit rester visible au-dessus de l'axe.
  if (!depuisZero && ech.bas >= mini - 0.0001 && ech.haut - ech.bas > 0 && mini > 0) {
    ech = graduations(Math.max(0, mini - ech.pas / 2), maxi, 4);
  }
  const y = function (v) { return basAxe - ((v - ech.bas) / (ech.haut - ech.bas || 1)) * (basAxe - 8); };

  const n = m.aligne
    ? Math.max.apply(null, series.map(function (x) { return x.points.length; }).concat([(m.etiquettes || []).length]))
    : 0;
  const largeur = m.aligne ? (L - marge - 4) / Math.max(1, n) : 0;
  const centre = function (i) { return marge + i * largeur + largeur / 2; };
  const xSerie = function (x, i) {
    if (m.aligne) return centre(i);
    const len = x.points.length;
    return len < 2 ? marge : marge + (i * (L - marge - 4)) / (len - 1);
  };

  let dessin = '';
  const donnees = [];
  series.forEach(function (x, k) {
    const barres = m.type === 'barres' && (m.groupe || k === 0);
    if (barres) {
      const nb = m.groupe ? series.length : 1;
      const lb = (largeur * 0.76) / nb;
      x.points.forEach(function (p, i) {
        if (!p || p.v === null || p.v === undefined) return;
        const sommet = y(p.v);
        const x0 = marge + i * largeur + largeur * 0.12 + (m.groupe ? k * lb : 0);
        dessin += '<rect x="' + x0.toFixed(1) + '" y="' + Math.min(sommet, y(Math.max(ech.bas, 0))).toFixed(1) +
          '" width="' + lb.toFixed(1) + '" height="' + Math.max(1, Math.abs(y(Math.max(ech.bas, 0)) - sommet)).toFixed(1) +
          '" rx="1.5" style="fill:' + x.couleur + ';opacity:' + (m.groupe ? '.85' : '.35') +
          ';stroke:' + x.couleur + ';stroke-width:.8"/>';
      });
    } else if (!m.aligne && x.points.filter(function (p) { return p && p.v !== null; }).length === 1) {
      // Une seule valeur (une séance face à un ensemble) : ligne de référence.
      const p = x.points.filter(function (q) { return q && q.v !== null; })[0];
      dessin += '<line x1="' + marge + '" x2="' + L + '" y1="' + y(p.v).toFixed(1) + '" y2="' + y(p.v).toFixed(1) +
        '" style="stroke:' + x.couleur + ';stroke-width:1.6;stroke-dasharray:5 3"/>';
    } else {
      let d = '';
      let leve = true;
      x.points.forEach(function (p, i) {
        if (!p || p.v === null || p.v === undefined) { leve = true; return; }
        d += (leve ? 'M' : 'L') + xSerie(x, i).toFixed(1) + ' ' + y(p.v).toFixed(1) + ' ';
        leve = false;
      });
      dessin += '<path class="trait" style="stroke:' + x.couleur + '" d="' + d + '"/>';
      if (x.points.length <= 60) {
        x.points.forEach(function (p, i) {
          if (!p || p.v === null || p.v === undefined) return;
          dessin += '<circle cx="' + xSerie(x, i).toFixed(1) + '" cy="' + y(p.v).toFixed(1) +
            '" r="2.3" style="fill:' + x.couleur + '"/>';
        });
      }
    }
    if (!m.aligne) {
      x.points.forEach(function (p, i) {
        if (!p || p.v === null || p.v === undefined) return;
        donnees.push({ x: Math.round(xSerie(x, i) * 10) / 10, lien: p.lien === undefined ? null : p.lien,
          texte: (series.length > 1 ? '<span style="color:' + x.couleur + '">●</span> ' + esc(x.nom) + ' · ' : '') +
            (p.texte || '') + ' · <strong>' + formatMesure(p.v, m) + '</strong>' });
      });
    }
  });

  if (m.aligne) {
    for (let i = 0; i < n; i++) {
      const morceaux = [];
      let lien = null;
      series.forEach(function (x) {
        const p = x.points[i];
        if (!p || p.v === null || p.v === undefined) return;
        if (lien === null && p.lien !== undefined) lien = p.lien;
        morceaux.push((series.length > 1 ? '<span style="color:' + x.couleur + '">●</span> ' + esc(x.nom) + ' ' : '') +
          '<strong>' + formatMesure(p.v, m) + '</strong>' + (p.texte ? ' ' + p.texte : ''));
      });
      if (!morceaux.length) continue;
      donnees.push({ x: Math.round(centre(i) * 10) / 10, lien: lien,
        texte: '<strong>' + esc((m.etiquettes || [])[i] || String(i + 1)) + '</strong> · ' + morceaux.join(' · ') });
    }
  }

  let abscisses = '';
  if (m.aligne) {
    const pas = n > 14 ? Math.ceil(n / 12) : 1;
    for (let i = 0; i < n; i += pas) {
      abscisses += '<text class="graduation" x="' + centre(i).toFixed(1) + '" y="' + (H + 1) +
        '" text-anchor="middle">' + esc((m.etiquettes || [])[i] || String(i + 1)) + '</text>';
    }
  } else {
    const ref = series.filter(function (x) { return x.points.length >= 2; })[0] || series[0];
    const premier = ref.points[0] || {};
    const dernier = ref.points[ref.points.length - 1] || {};
    abscisses = '<text class="graduation" x="' + marge + '" y="' + (H + 1) + '">' + esc(premier.etiquette || '') + '</text>' +
      '<text class="graduation" x="' + L + '" y="' + (H + 1) + '" text-anchor="end">' + esc(dernier.etiquette || '') + '</text>';
  }

  const sens = m.sens === 'bas' ? ' <span class="muet">(plus bas = mieux)</span>'
    : m.sens === 'haut' ? ' <span class="muet">(plus haut = mieux)</span>' : '';
  const legende = series.length > 1 || m.legende
    ? '<div class="legende" style="margin-top:6px">' + series.map(function (x) {
      return '<span><span class="pastille-c" style="background:' + x.couleur + '"></span>' + esc(x.nom) + '</span>';
    }).join('') + '</div>'
    : '';
  const geste = surOrdinateur() ? 'Survolez' : 'Glissez le doigt sur';
  const consigne = (cible
    ? geste + ' le graphique : seules les flèches du point lu restent sur le blason, avec ses mesures.'
    : geste + ' le graphique pour lire chaque point.') +
    (m.ouvrir === 'partie' ? ' Touchez un point pour ouvrir la partie.'
      : m.ouvrir === 'volee' ? ' Touchez un point pour agrandir la volée.' : '');

  return '<div class="graphe-volees" data-cible="' + esc(cible || '') + '"' +
    (m.ouvrir ? ' data-ouvrir="' + esc(m.ouvrir) + '"' : '') +
    ' data-volees="' + esc(JSON.stringify(donnees)) + '">' +
    '<div class="lecture" aria-live="polite"><span class="muet">' + esc(m.libelle) + (m.unite ? ' (' + esc(m.unite) + ')' : '') + '</span>' + sens + '</div>' +
    '<svg class="courbe" style="height:170px" viewBox="0 0 ' + L + ' ' + (H + 2) + '">' +
    grilleY(ech, y, L, marge) + dessin +
    '<line class="axe" x1="' + marge + '" y1="' + basAxe + '" x2="' + L + '" y2="' + basAxe + '"/>' + abscisses +
    '<line class="curseur" x1="0" y1="6" x2="0" y2="' + basAxe + '" style="display:none"/>' +
    '</svg>' + legende +
    '<p class="muet" style="margin:6px 0 0;font-size:12px">' + consigne + '</p></div>';
}

/**
 * Mesures affichées sous un blason : une version par point du graphique
 * (`table[lien]`) et celle de l'ensemble (`table['*']`).
 */
function mesuresLiees(cibleId, table) {
  etat.mesuresLiees = etat.mesuresLiees || {};
  etat.mesuresLiees[cibleId] = table;
  return '<div class="mesures-liees">' + (table['*'] || '') + '</div>';
}

/** Ne laisse sur le blason que les flèches du point lu ; `lien` nul : toutes. */
function revelerImpacts(cibleId, lien, libelle) {
  const bloc = document.getElementById(cibleId);
  if (!bloc) return;
  const table = (etat.mesuresLiees || {})[cibleId];
  const zone = bloc.querySelector('.mesures-liees');
  if (table && zone) {
    const html = (lien === null || lien === undefined) ? table['*'] : table[lien];
    zone.innerHTML = html === undefined ? (table['*'] || '') : html;
  }
  const filtre = lien !== null && lien !== undefined;
  let n = 0;
  Array.prototype.forEach.call(bloc.querySelectorAll('.impact[data-l]'), function (c) {
    const garde = !filtre || c.getAttribute('data-l') === String(lien);
    c.classList.toggle('eteint', !garde);
    if (garde) n++;
  });
  bloc.classList.toggle('filtre-impacts', filtre);
  const info = bloc.querySelector('.revele-info');
  if (info) {
    info.innerHTML = filtre
      ? (n ? '<strong>' + n + '</strong> flèche' + (n > 1 ? 's' : '') + ' · ' + (libelle || '') : 'Aucune flèche pointée pour ce point')
      : 'Toutes les flèches';
  }
}

/** Efface curseurs et filtres des graphiques qui ne sont plus survolés. */
function relacherGraphes(sauf) {
  Array.prototype.forEach.call(document.querySelectorAll('.graphe-volees[data-affiche="1"]'), function (bloc) {
    if (bloc === sauf) return;
    delete bloc.dataset.affiche;
    const c = bloc.querySelector('.curseur');
    if (c) c.style.display = 'none';
    if (bloc.dataset.cible) revelerImpacts(bloc.dataset.cible, null);
  });
}

/** Mesures d'une série de parties, une série par profil ({ nom, parties }). */
function mesuresParties(profils, comparaison) {
  const pts = function (parties, cle) {
    return (parties || []).map(function (p) {
      return { v: p[cle] === undefined ? null : p[cle], lien: p.id, etiquette: dateFr(p.date),
        texte: '<strong>' + dateFr(p.date) + '</strong>' + (p.seance ? ' · ' + esc(p.seance) : '') };
    });
  };
  const serie = function (cle) {
    return profils.map(function (x) { return { nom: x.nom, points: pts(x.parties, cle) }; });
  };
  const liste = [
    { code: 'moyenne', libelle: 'Moy./flèche', unite: 'pts', sens: 'haut' },
    { code: 'score', cle: 'pct', libelle: 'Score %', unite: '%', sens: 'haut' },
    { code: 'centrage', cle: 'ecartCentre', libelle: 'Centrage', unite: 'cm', sens: 'bas',
      aide: 'Distance entre le centre du groupe de flèches et le centre du blason.' },
    { code: 'perimetre', libelle: 'Périmètre', unite: 'cm', sens: 'bas',
      aide: 'Périmètre moyen du groupe de chaque volée : la longueur de ficelle pour faire le tour des flèches.' },
    { code: 'aire', libelle: 'Surface', unite: 'cm²', sens: 'bas', aide: 'Surface moyenne couverte par les flèches d’une volée.' },
    { code: 'jaunes', libelle: '% jaunes', unite: '%', sens: 'haut', aide: 'Part des flèches à 9 ou 10.' },
    { code: 'dix', libelle: '% de 10', unite: '%', sens: 'haut' },
    { code: 'regularite', libelle: 'Régularité', unite: 'pts', sens: 'bas',
      aide: 'Écart-type des scores de volée : plus il est bas, plus la partie est régulière.' },
    { code: 'manquees', libelle: 'Manquées', unite: '', sens: 'bas' },
  ].map(function (m) {
    return Object.assign({ type: 'ligne', series: serie(m.cle || m.code) }, m);
  });
  if (!comparaison) {
    const x = profils[0];
    liste.splice(3, 0, {
      code: 'decalage', libelle: 'Décalage', unite: 'cm', type: 'ligne', legende: true,
      aide: 'Position du centre du groupe : horizontal positif = à droite, vertical positif = en bas. Idéal : 0.',
      series: [
        { nom: 'Horizontal (+ droite)', points: pts(x.parties, 'centreX') },
        { nom: 'Vertical (+ bas)', points: pts(x.parties, 'centreY'), couleur: 'var(--or)' },
      ],
    });
  }
  return liste;
}

/** Moyenne par flèche selon le numéro de volée. */
function mesuresRangs(profils) {
  const pts = function (liste, prefixe) {
    return (liste || []).map(function (r) {
      return { v: r.moyenne, texte: '<span class="muet">(' + r.n + ' fl.)</span>', etiquette: prefixe + r.numero };
    });
  };
  const etiquettes = function (cle, prefixe) {
    const n = Math.max.apply(null, profils.map(function (x) { return (x[cle] || []).length; }).concat([0]));
    const out = [];
    for (let i = 0; i < n; i++) out.push(prefixe + (i + 1));
    return out;
  };
  const multi = profils.length > 1;
  return [
    { code: 'numero', libelle: 'Numéro de volée', unite: 'pts', sens: 'haut', type: multi ? 'ligne' : 'barres', zero: false,
      aligne: true, etiquettes: etiquettes('parVolee', 'V'),
      aide: 'Moyenne par flèche selon le numéro de volée : mise en route, puis fatigue en fin de partie ?',
      series: profils.map(function (x) { return { nom: x.nom, points: pts(x.parVolee, 'V') }; }) },
  ];
}

/** Mesures volée par volée d'une séance (liens : numéro de volée). */
function mesuresVolees(profils) {
  const multi = profils.length > 1;
  const etiquettes = [];
  const n = Math.max.apply(null, profils.map(function (x) { return (x.volees || []).length; }).concat([0]));
  for (let i = 0; i < n; i++) etiquettes.push('V' + (i + 1));
  const pts = function (volees, f) {
    return (volees || []).map(function (v) {
      const val = f(v);
      return { v: val === undefined ? null : val, lien: multi ? undefined : v.numero,
        texte: multi ? '' : '<span class="muet">' + v.total + '/' + v.max + '</span>' };
    });
  };
  const serie = function (f) {
    return profils.map(function (x) { return { nom: x.nom, points: pts(x.volees, f) }; });
  };
  const g = function (cle) { return function (v) { return v.groupement ? v.groupement[cle] : (v[cle] !== undefined ? v[cle] : null); }; };
  const base = { aligne: true, etiquettes: etiquettes };
  const liste = [
    Object.assign({ code: 'total', libelle: 'Score', unite: 'pts', sens: 'haut', type: multi ? 'ligne' : 'barres', zero: false,
      series: serie(function (v) { return v.total; }) }, base),
    Object.assign({ code: 'moyenne', libelle: 'Moy./flèche', unite: 'pts', sens: 'haut', type: 'ligne',
      series: serie(function (v) { return v.moyenne; }) }, base),
    Object.assign({ code: 'perimetre', libelle: 'Périmètre', unite: 'cm', sens: 'bas', type: multi ? 'ligne' : 'barres',
      series: serie(function (v) { return v.perimetre || null; }),
      aide: 'Longueur de ficelle pour faire le tour des flèches de la volée.' }, base),
    Object.assign({ code: 'aire', libelle: 'Surface', unite: 'cm²', sens: 'bas', type: multi ? 'ligne' : 'barres',
      series: serie(function (v) { return v.aire || null; }) }, base),
    Object.assign({ code: 'centrage', libelle: 'Centrage', unite: 'cm', sens: 'bas', type: 'ligne',
      series: serie(g('ecartCentre')),
      aide: 'Distance entre le centre du groupe de la volée et le centre du blason.' }, base),
  ];
  if (!multi) {
    const x = profils[0];
    let points = 0;
    let fleches = 0;
    liste.splice(2, 0, Object.assign({ code: 'cumul', libelle: 'Moy. cumulée', unite: 'pts', sens: 'haut', type: 'ligne',
      aide: 'Moyenne par flèche depuis le début de la partie : la séance monte-t-elle ou s’essouffle-t-elle ?',
      series: [{ nom: '', points: (x.volees || []).map(function (v) {
        points += v.total;
        fleches += v.nbFleches || v.fleches.length;
        return { v: fleches ? Math.round((points / fleches) * 100) / 100 : null, lien: v.numero,
          texte: '<span class="muet">après ' + fleches + ' fl.</span>' };
      }) }] }, base));
    liste.push(Object.assign({ code: 'decalage', libelle: 'Décalage', unite: 'cm', type: 'ligne', legende: true,
      aide: 'Centre du groupe de la volée : horizontal positif = à droite, vertical positif = en bas.',
      series: [
        { nom: 'Horizontal (+ droite)', points: pts(x.volees, g('centreX')) },
        { nom: 'Vertical (+ bas)', points: pts(x.volees, g('centreY')), couleur: 'var(--or)' },
      ] }, base));
  }
  return liste;
}

/* ---------- Graphiques : graduations et repères ---------- */

/**
 * Choisit des graduations rondes pour un intervalle donné.
 * Renvoie { bas, haut, pas, valeurs } — la plage est élargie aux graduations.
 */
function graduations(min, max, nombre) {
  const cible = nombre || 4;
  let etendue = max - min;
  if (etendue <= 0) etendue = Math.abs(max) * 0.1 || 1;

  const brut = etendue / cible;
  const magnitude = Math.pow(10, Math.floor(Math.log(brut) / Math.LN10));
  const normalise = brut / magnitude;
  const pas = (normalise >= 5 ? 5 : normalise >= 2 ? 2 : normalise >= 1 ? 1 : 0.5) * magnitude;

  const bas = Math.floor(min / pas) * pas;
  const haut = Math.ceil(max / pas) * pas;
  const valeurs = [];
  for (let v = bas; v <= haut + pas / 1000; v += pas) {
    valeurs.push(Math.round(v * 100) / 100);
  }
  return { bas: bas, haut: haut, pas: pas, valeurs: valeurs };
}

/** Grille horizontale + étiquettes de l'axe vertical. */
function grilleY(ech, y, L, marge) {
  return ech.valeurs.map(function (v) {
    const py = y(v);
    return '<line class="grille" x1="' + marge + '" y1="' + py.toFixed(1) +
      '" x2="' + L + '" y2="' + py.toFixed(1) + '"/>' +
      '<text class="graduation" x="0" y="' + (py - 1.5).toFixed(1) + '">' + v + '</text>';
  }).join('');
}

/** Courbe SVG d'une série chronologique (`cle` : 'moyenne' ou 'pct'). */
function courbe(serie, cle) {
  const champ = cle || 'moyenne';
  const pts = (serie || []).slice(-24);
  if (pts.length < 2) return '<div class="muet">Au moins deux parties sont nécessaires pour tracer la courbe.</div>';

  const L = 300, H = 124, marge = 22, basAxe = H - 16;
  const valeurs = pts.map(function (p) { return p[champ]; });
  const ech = graduations(Math.min.apply(null, valeurs), Math.max.apply(null, valeurs), 4);

  const x = function (i) { return marge + (i * (L - marge - 4)) / (pts.length - 1); };
  const y = function (v) { return basAxe - ((v - ech.bas) / (ech.haut - ech.bas)) * (basAxe - 8); };

  const chemin = pts.map(function (p, i) {
    return (i ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(p[champ]).toFixed(1);
  }).join(' ');
  const aire = chemin + ' L' + x(pts.length - 1).toFixed(1) + ' ' + basAxe +
    ' L' + marge + ' ' + basAxe + ' Z';
  const cercles = pts.map(function (p, i) {
    return '<circle class="pt" cx="' + x(i).toFixed(1) + '" cy="' + y(p[champ]).toFixed(1) + '" r="2.4">' +
      '<title>' + dateFr(p.date) + ' — ' + p.score + '/' + p.max +
      ' (' + p.moyenne + ' pts/flèche)</title></circle>';
  }).join('');

  return '<svg class="courbe" viewBox="0 0 ' + L + ' ' + (H + 2) + '">' +
    grilleY(ech, y, L, marge) +
    '<path class="aire" d="' + aire + '"/><path class="trait" d="' + chemin + '"/>' + cercles +
    '<line class="axe" x1="' + marge + '" y1="' + basAxe + '" x2="' + L + '" y2="' + basAxe + '"/>' +
    '<text class="graduation" x="' + marge + '" y="' + (H + 1) + '">' + dateFr(pts[0].date) + '</text>' +
    '<text class="graduation" x="' + L + '" y="' + (H + 1) + '" text-anchor="end">' +
    dateFr(pts[pts.length - 1].date) + '</text>' +
    '</svg>';
}

/**
 * Évolution d'une partie : une barre par volée et la courbe de la moyenne
 * cumulée. Un curseur se déplace au doigt pour lire chaque volée.
 */
function graphiqueVolees(volees) {
  if (!volees.length) return '';
  const L = 300, H = 138, marge = 24, basAxe = H - 20;

  let cumulPoints = 0;
  let cumulFleches = 0;
  const cumul = volees.map(function (v) {
    const n = v.nbFleches || v.fleches.length;
    cumulPoints += v.total;
    cumulFleches += n;
    return {
      valeur: (cumulPoints / cumulFleches) * n,
      moyenne: Math.round((cumulPoints / cumulFleches) * 100) / 100,
    };
  });

  const toutes = volees.map(function (v) { return v.total; })
    .concat(cumul.map(function (c) { return c.valeur; }));
  const mini = Math.min.apply(null, toutes);
  const maxi = Math.max.apply(null, toutes);
  let ech = graduations(mini, maxi, 4);
  // La plus faible volée doit rester visible : on descend d'une graduation
  // quand elle tombe pile sur la base de l'échelle.
  if (ech.bas >= mini - 0.0001) ech = graduations(mini - ech.pas, maxi, 4);
  const y = function (v) { return basAxe - ((v - ech.bas) / (ech.haut - ech.bas)) * (basAxe - 8); };

  const largeur = (L - marge - 4) / volees.length;
  const centre = function (i) { return marge + i * largeur + largeur / 2; };

  const barres = volees.map(function (v, i) {
    const sommet = y(v.total);
    return '<rect class="barre-volee" x="' + (marge + i * largeur + largeur * 0.15).toFixed(1) +
      '" y="' + sommet.toFixed(1) + '" width="' + (largeur * 0.7).toFixed(1) +
      '" height="' + Math.max(1, basAxe - sommet).toFixed(1) + '" rx="2"/>';
  }).join('');

  const chemin = cumul.map(function (c, i) {
    return (i ? 'L' : 'M') + centre(i).toFixed(1) + ' ' + y(c.valeur).toFixed(1);
  }).join(' ');
  const points = cumul.map(function (c, i) {
    return '<circle class="pt" cx="' + centre(i).toFixed(1) + '" cy="' + y(c.valeur).toFixed(1) + '" r="2.2"/>';
  }).join('');

  const etiquettes = volees.map(function (v, i) {
    if (volees.length > 12 && i % 2) return '';
    return '<text class="graduation" x="' + centre(i).toFixed(1) + '" y="' + (H - 5) +
      '" text-anchor="middle">V' + v.numero + '</text>';
  }).join('');

  // Données du curseur : lues par le glissement du doigt.
  const donnees = volees.map(function (v, i) {
    return { x: Math.round(centre(i) * 10) / 10, numero: v.numero, total: v.total,
      max: v.max, moyenne: v.moyenne, cumul: cumul[i].moyenne,
      perimetre: v.perimetre || 0, aire: v.aire || 0 };
  });

  return '<div class="graphe-volees" data-volees="' + esc(JSON.stringify(donnees)) + '">' +
    '<div class="lecture" aria-live="polite"></div>' +
    '<svg class="courbe" style="height:160px" viewBox="0 0 ' + L + ' ' + (H + 2) + '">' +
    grilleY(ech, y, L, marge) + barres +
    '<path class="trait" d="' + chemin + '"/>' + points + etiquettes +
    '<line class="axe" x1="' + marge + '" y1="' + basAxe + '" x2="' + L + '" y2="' + basAxe + '"/>' +
    '<line class="curseur" x1="0" y1="6" x2="0" y2="' + basAxe + '" style="display:none"/>' +
    '</svg>' +
    '<div class="legende" style="margin-top:8px">' +
    '<span><span class="pastille-c" style="background:var(--accent-clair);' +
    'border:1px solid var(--accent)"></span>Score de la volée</span>' +
    '<span><span class="pastille-c" style="background:var(--accent)"></span>Moyenne cumulée</span>' +
    '</div><p class="muet" style="margin:8px 0 0">Faites glisser le doigt sur le graphique ' +
    'pour lire chaque volée.</p></div>';
}

/**
 * Curseur du graphique des volées : un seul écouteur pour toute la page,
 * les graphiques étant redessinés à chaque changement de séance.
 */
let departGraphe = null;
document.addEventListener('pointerdown', function (e) {
  const bloc = e.target.closest ? e.target.closest('.graphe-volees') : null;
  // Toucher ailleurs remet toutes les flèches sur les blasons.
  relacherGraphes(bloc);
  if (!bloc) return;
  bloc.dataset.actif = '1';
  departGraphe = { x: e.clientX, y: e.clientY, bloc: bloc };
  majCurseurVolees(bloc, e.clientX);
});

document.addEventListener('pointermove', function (e) {
  const bloc = document.querySelector('.graphe-volees[data-actif="1"]');
  if (bloc) {
    e.preventDefault();
    majCurseurVolees(bloc, e.clientX);
    return;
  }
  // Souris : le simple survol lit le graphique ; en sortir rend toutes les flèches.
  if (e.pointerType !== 'mouse') return;
  const survole = e.target.closest ? e.target.closest('.graphe-volees') : null;
  relacherGraphes(survole);
  if (survole) majCurseurVolees(survole, e.clientX);
});

document.addEventListener('pointerup', function (e) {
  Array.prototype.forEach.call(document.querySelectorAll('.graphe-volees[data-actif="1"]'),
    function (bloc) { delete bloc.dataset.actif; });
  // Un simple toucher (sans glisser) ouvre le point lu.
  const d = departGraphe;
  departGraphe = null;
  if (!d || !d.bloc.dataset.ouvrir) return;
  if (Math.abs(e.clientX - d.x) > 8 || Math.abs(e.clientY - d.y) > 8) return;
  const lien = d.bloc.dataset.lien;
  if (!lien) return;
  if (d.bloc.dataset.ouvrir === 'partie') filtrerStats('scoreId', lien);
  else if (d.bloc.dataset.ouvrir === 'volee') agrandirVolee(Number(lien));
});

function majCurseurVolees(bloc, clientX) {
  const svg = bloc.querySelector('svg');
  const donnees = JSON.parse(bloc.dataset.volees || '[]');
  if (!svg || !donnees.length) return;

  const rect = svg.getBoundingClientRect();
  const vue = svg.viewBox.baseVal;
  const x = ((clientX - rect.left) / rect.width) * vue.width;

  let proche = donnees[0];
  donnees.forEach(function (d) {
    if (Math.abs(d.x - x) < Math.abs(proche.x - x)) proche = d;
  });

  const curseur = svg.querySelector('.curseur');
  curseur.style.display = '';
  curseur.setAttribute('x1', proche.x);
  curseur.setAttribute('x2', proche.x);
  bloc.dataset.affiche = '1';
  bloc.dataset.lien = (proche.lien === null || proche.lien === undefined) ? '' : String(proche.lien);
  if (bloc.dataset.cible) {
    const court = String(proche.texte || '').replace(/<[^>]+>/g, '').split(' · ').slice(0, 2).join(' · ');
    revelerImpacts(bloc.dataset.cible, proche.lien, court);
  }

  if (proche.texte) { bloc.querySelector('.lecture').innerHTML = proche.texte; return; }
  bloc.querySelector('.lecture').innerHTML =
    '<strong>Volée ' + proche.numero + '</strong> · ' + proche.total + '/' + proche.max +
    ' · moyenne ' + proche.moyenne +
    (proche.perimetre ? ' · périmètre ' + proche.perimetre + ' cm' : '') +
    (proche.aire ? ' · ' + proche.aire.toLocaleString('fr-FR') + ' cm²' : '') +
    ' · cumul ' + proche.cumul + ' pts/flèche';
}

/**
 * Évolution de la moyenne par flèche, partie après partie, avec la tendance
 * (moyenne glissante sur 5 parties). Le doigt lit chaque point.
 */
function courbeEvolution(serie, club) {
  const pts = (serie || []).filter(function (p) { return p && p.moyenne !== undefined; });
  if (pts.length < 2) {
    return '<div class="muet">Au moins deux parties sont nécessaires pour tracer l’évolution.</div>';
  }
  const L = 300, H = 150, marge = 24, basAxe = H - 18;
  const n = pts.length;
  const glissante = pts.map(function (p, i) {
    const fenetre = pts.slice(Math.max(0, i - 4), i + 1);
    return fenetre.reduce(function (t, x) { return t + x.moyenne; }, 0) / fenetre.length;
  });
  const valeurs = pts.map(function (p) { return p.moyenne; });
  const ech = graduations(Math.min.apply(null, valeurs), Math.max.apply(null, valeurs), 4);
  const x = function (i) { return marge + (i * (L - marge - 4)) / (n - 1); };
  const y = function (v) { return basAxe - ((v - ech.bas) / (ech.haut - ech.bas || 1)) * (basAxe - 8); };
  const trace = function (liste) {
    return liste.map(function (v, i) {
      return (i ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(v).toFixed(1);
    }).join(' ');
  };
  const chemin = trace(valeurs);
  const aire = chemin + ' L' + x(n - 1).toFixed(1) + ' ' + basAxe + ' L' + marge + ' ' + basAxe + ' Z';
  const cercles = n <= 60 ? pts.map(function (p, i) {
    return '<circle class="pt" cx="' + x(i).toFixed(1) + '" cy="' + y(p.moyenne).toFixed(1) + '" r="2.2"/>';
  }).join('') : '';

  const donnees = pts.map(function (p, i) {
    return {
      x: Math.round(x(i) * 10) / 10,
      texte: '<strong>' + dateFr(p.date) + '</strong>' + (p.seance ? ' · ' + esc(p.seance) : '') +
        ' · ' + p.score + '/' + p.max + ' · <strong>' + p.moyenne + '</strong> pts/flèche' +
        ' · tendance ' + glissante[i].toFixed(2),
    };
  });

  const debut = glissante[Math.min(4, n - 1)];
  const ecart = Math.round((glissante[n - 1] - debut) * 100) / 100;
  const resume = n >= 6
    ? '<span class="puce ' + (ecart >= 0 ? 'vert' : 'orange') + '">' + (ecart >= 0 ? '▲ +' : '▼ ') +
      ecart.toFixed(2) + ' pts/flèche</span> <span class="muet">tendance depuis le début</span>'
    : '';

  return (resume ? '<div style="margin-bottom:8px">' + resume + '</div>' : '') +
    '<div class="graphe-volees" data-volees="' + esc(JSON.stringify(donnees)) + '">' +
    '<div class="lecture" aria-live="polite"></div>' +
    '<svg class="courbe" style="height:170px" viewBox="0 0 ' + L + ' ' + (H + 2) + '">' +
    grilleY(ech, y, L, marge) +
    '<path class="aire" d="' + aire + '"/><path class="trait" d="' + chemin + '"/>' +
    '<path class="trait tendance" d="' + trace(glissante) + '"/>' + cercles +
    '<line class="axe" x1="' + marge + '" y1="' + basAxe + '" x2="' + L + '" y2="' + basAxe + '"/>' +
    '<text class="graduation" x="' + marge + '" y="' + (H + 1) + '">' + dateFr(pts[0].date) + '</text>' +
    '<text class="graduation" x="' + L + '" y="' + (H + 1) + '" text-anchor="end">' +
    dateFr(pts[n - 1].date) + '</text>' +
    '<line class="curseur" x1="0" y1="6" x2="0" y2="' + basAxe + '" style="display:none"/>' +
    '</svg><div class="legende" style="margin-top:8px">' +
    '<span><span class="pastille-c" style="background:var(--accent)"></span>' +
    (club ? 'Moyenne du club par jour' : 'Moyenne de la partie') + '</span>' +
    '<span><span class="pastille-c" style="background:var(--or)"></span>Tendance (5 parties)</span>' +
    '</div></div>';
}

/** Deux séries superposées : une couleur par archer. */
function courbeDouble(a, b) {
  const series = [
    { nom: a.nom, points: (a.evolution || []).slice(-24), couleur: 'var(--accent)' },
    { nom: b.nom, points: (b.evolution || []).slice(-24), couleur: 'var(--z-rouge)' },
  ].filter(function (s) { return s.points.length > 1; });
  if (!series.length) return '<div class="muet">Pas assez de parties pour tracer les courbes.</div>';

  const toutes = series.reduce(function (t, s) { return t.concat(s.points); }, []);
  const valeurs = toutes.map(function (p) { return p.moyenne; });
  const ech = graduations(Math.min.apply(null, valeurs), Math.max.apply(null, valeurs), 4);

  const L = 300, H = 128, marge = 24, basAxe = H - 16;
  const y = function (v) { return basAxe - ((v - ech.bas) / (ech.haut - ech.bas)) * (basAxe - 8); };

  const chemins = series.map(function (s) {
    const n = s.points.length;
    const x = function (i) { return marge + (i * (L - marge - 4)) / (n - 1); };
    const d = s.points.map(function (p, i) {
      return (i ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(p.moyenne).toFixed(1);
    }).join(' ');
    return '<path class="trait" style="stroke:' + s.couleur + '" d="' + d + '"/>' +
      s.points.map(function (p, i) {
        return '<circle cx="' + x(i).toFixed(1) + '" cy="' + y(p.moyenne).toFixed(1) +
          '" r="2.2" fill="' + s.couleur + '"><title>' + esc(s.nom) + ' — ' + dateFr(p.date) +
          ' : ' + p.moyenne + ' pts/flèche</title></circle>';
      }).join('');
  }).join('');

  return '<svg class="courbe" viewBox="0 0 ' + L + ' ' + H + '">' +
    grilleY(ech, y, L, marge) + chemins +
    '<line class="axe" x1="' + marge + '" y1="' + basAxe + '" x2="' + L + '" y2="' + basAxe + '"/>' +
    '</svg>' +
    '<div class="legende" style="margin-top:8px">' + series.map(function (s) {
      return '<span><span class="pastille-c" style="background:' + s.couleur + '"></span>' +
        esc(s.nom) + '</span>';
    }).join('') + '</div>';
}

/* ---------- Photo de profil ---------- */

/**
 * Réduit une image choisie par l'archer à une vignette carrée avant envoi :
 * une photo de téléphone pèse plusieurs méga-octets, la vignette quelques
 * kilo-octets, ce qui tient dans une cellule du classeur.
 */
function reduireImage(fichier, cote, qualite) {
  return new Promise(function (resolve, reject) {
    const lecteur = new FileReader();
    lecteur.onerror = function () { reject(new Error('Image illisible.')); };
    lecteur.onload = function () {
      const img = new Image();
      img.onerror = function () { reject(new Error('Image illisible.')); };
      img.onload = function () {
        const taille = cote || 192;
        const canevas = document.createElement('canvas');
        canevas.width = taille;
        canevas.height = taille;
        const ctx2d = canevas.getContext('2d');

        // Recadrage carré centré, sans déformer le visage.
        const c = Math.min(img.width, img.height);
        ctx2d.drawImage(img, (img.width - c) / 2, (img.height - c) / 2, c, c, 0, 0, taille, taille);
        resolve(canevas.toDataURL('image/jpeg', qualite || 0.72));
      };
      img.src = lecteur.result;
    };
    lecteur.readAsDataURL(fichier);
  });
}

function choisirPhoto(adherentId) {
  const champ = document.createElement('input');
  champ.type = 'file';
  champ.accept = 'image/*';
  champ.addEventListener('change', function () {
    const fichier = champ.files && champ.files[0];
    if (!fichier) return;
    notifier('Préparation de la photo…');
    reduireImage(fichier, 192, 0.72).then(function (image) {
      return api('apiEnregistrerPhoto', adherentId, image);
    }).then(function (r) {
      if (!r.ok) { notifier(r.message, true); return; }
      notifier(r.message);
      if (adherentId === etat.moi.id) {
        etat.moi.photo = r.photo;
        etat.moi.aPhoto = true;
        rendreProfil();
      } else {
        ouvrirFiche(adherentId);
      }
    }).catch(function (e) {
      notifier(e.message || 'Photo non enregistrée.', true);
    });
  });
  champ.click();
}

function retirerPhoto(adherentId) {
  confirmer({ titre: 'Retirer la photo de profil ?', message: '', valider: 'Retirer' }).then(function (oui) {
    if (!oui) return;
    api('apiSupprimerPhoto', adherentId).then(function (r) {
      notifier(r.message, !r.ok);
      if (!r.ok) return;
      if (adherentId === etat.moi.id) {
        etat.moi.photo = '';
        etat.moi.aPhoto = false;
        rendreProfil();
      } else {
        ouvrirFiche(adherentId);
      }
    });
  });
}

/** Vignette d'un archer : sa photo, ou ses initiales. */
function avatar(a, taille) {
  const cote = taille || 38;
  const style = 'width:' + cote + 'px;height:' + cote + 'px;flex-basis:' + cote + 'px;' +
    'font-size:' + Math.round(cote / 2.8) + 'px';
  if (a.photo) {
    return '<span class="pastille photo" style="' + style + '">' +
      '<img src="' + esc(a.photo) + '" alt=""></span>';
  }
  return '<span class="pastille" style="' + style + '">' +
    esc(initiales(a.prenom, a.nom)) + '</span>';
}

/* ---------- Licence au format PDF ---------- */

function deposerLicence(adherentId) {
  const champ = document.createElement('input');
  champ.type = 'file';
  champ.accept = 'application/pdf';
  champ.addEventListener('change', function () {
    const fichier = champ.files && champ.files[0];
    if (!fichier) return;
    if (fichier.size > 4 * 1024 * 1024) {
      notifier('PDF trop lourd : 4 Mo maximum.', true);
      return;
    }
    notifier('Envoi de la licence…');

    const lecteur = new FileReader();
    lecteur.onload = function () {
      api('apiDeposerLicence', adherentId, {
        nom: fichier.name,
        type: 'application/pdf',
        donnees: String(lecteur.result).split(',')[1],
      }).then(function (r) {
        if (!r.ok) { notifier(r.message, true); return; }
        notifier(r.message);
        if (adherentId === etat.moi.id) {
          etat.moi.aLicence = true;
          etat.moi.licenceDepot = r.depot;
          etat.moi.licenceUrl = r.url;
          rendreProfil();
        } else {
          ouvrirFiche(adherentId);
        }
      });
    };
    lecteur.readAsDataURL(fichier);
  });
  champ.click();
}

function supprimerLicence(adherentId) {
  confirmer({ titre: 'Supprimer la licence ?', message: 'Le PDF enregistré sera supprimé.', valider: 'Supprimer' }).then(function (oui) {
    if (!oui) return;
    api('apiSupprimerLicence', adherentId).then(function (r) {
      notifier(r.message, !r.ok);
      if (!r.ok) return;
      if (adherentId === etat.moi.id) {
        etat.moi.aLicence = false;
        etat.moi.licenceDepot = '';
        etat.moi.licenceUrl = '';
        rendreProfil();
      } else {
        ouvrirFiche(adherentId);
      }
    });
  });
}

/** Bloc « licence » d'une fiche : dépôt, consultation, remplacement. */
function blocLicence(a) {
  const lien = a.licenceUrl
    ? '<a href="' + esc(a.licenceUrl) + '" target="_blank" rel="noopener">Ouvrir le PDF</a>'
    : '';
  return '<div class="carte">' +
    '<div style="display:flex;align-items:center;gap:10px;margin-bottom:10px">' +
    '<svg viewBox="0 0 24 24" style="width:20px;height:20px;color:var(--accent)">' +
    '<use href="#ico-document"/></svg><strong>Licence</strong></div>' +
    (a.aLicence
      ? '<p class="muet" style="margin:0 0 10px">Déposée le ' + dateFr(a.licenceDepot) +
        (lien ? ' · ' + lien : '') + '</p>'
      : '<p class="muet" style="margin:0 0 10px">Aucune licence enregistrée.</p>') +
    '<div class="actions" style="margin:0">' +
    '<button class="secondaire" onclick="deposerLicence(\'' + a.id + '\')">' +
    (a.aLicence ? 'Remplacer le PDF' : 'Déposer le PDF') + '</button>' +
    (a.aLicence
      ? '<button class="danger" onclick="supprimerLicence(\'' + a.id + '\')">Supprimer</button>'
      : '') +
    '</div></div>';
}

/* ---------- Calendrier ---------- */

function chargerCalendrier() {
  const el = document.getElementById('calendrierContenu');
  el.innerHTML = '<div class="chargement">Chargement du calendrier…</div>';
  document.getElementById('recapCalendrier').innerHTML = '';
  api('apiCalendrier').then(function (r) {
    if (!r.ok) { el.innerHTML = '<div class="vide">' + esc(r.message) + '</div>'; return; }
    etat.calendrier = r;
    rendreCalendrier(r);
  });
}

function rendreCalendrier(r) {
  const el = document.getElementById('calendrierContenu');
  if (!r.seances.length) {
    el.innerHTML = '<div class="vide">Aucune séance programmée.</div>';
    return;
  }
  document.getElementById('recapCalendrier').innerHTML = r.recap ? recapCalendrier(r) : '';

  const jours = [];
  r.seances.forEach(function (s) {
    if (jours.indexOf(s.jour) === -1) jours.push(s.jour);
  });
  document.getElementById('calendrierJours').textContent = 'séances le ' + jours.join(' et le ');

  el.innerHTML = r.seances.map(function (s) {
    const boutons = (r.reponses || []).map(function (rep) {
      const actif = s.maReponse === rep;
      return '<button type="button" class="reponse ' + classeReponse(rep) +
        (actif ? ' actif' : '') + '" onclick="repondreSeance(\'' + s.date + '\', \'' +
        (actif ? '' : rep) + '\')">' + rep + '</button>';
    }).join('');

    const detail = s.participants && s.participants.length
      ? '<details class="participants-seance"><summary>' + s.participants.length +
        ' réponse(s)</summary>' + s.participants.map(function (p) {
          return '<div class="ligne" style="cursor:default"><div class="infos">' +
            '<div class="nom">' + esc(p.archer) + '</div>' +
            (p.commentaire ? '<div class="detail">' + esc(p.commentaire) + '</div>' : '') +
            '</div><span class="puce ' + classeReponse(p.reponse) + '">' +
            esc(p.reponse) + '</span></div>';
        }).join('') + '</details>'
      : '';

    return '<div class="carte seance">' +
      '<div class="seance-entete">' +
      '<div><strong>' + s.jour.charAt(0).toUpperCase() + s.jour.slice(1) + ' ' +
      dateFr(s.date) + '</strong>' +
      '<div class="muet">' + s.presents + ' présent(s) · ' + s.peutEtre +
      ' peut-être · ' + s.absents + ' absent(s)</div></div>' +
      (s.maReponse ? '<span class="puce ' + classeReponse(s.maReponse) + '">' +
        esc(s.maReponse) + '</span>' : '') + '</div>' +
      '<div class="reponses">' + boutons + '</div>' + detail + '</div>';
  }).join('');
}

/**
 * Récapitulatif de l'encadrement : une ligne par archer, une colonne par
 * séance. P présent, A absent, ? peut-être, — pas de réponse.
 */
function recapCalendrier(r) {
  const lettres = { 'Présent': 'P', 'Absent': 'A', 'Peut-être': '?' };
  const dates = r.recap.dates.slice(0, etat.recapTout ? 99 : 8);
  const archers = r.recap.archers;
  if (!archers.length) return '';

  const enTete = dates.map(function (d, i) {
    return '<th' + (i === 0 ? ' class="prochaine"' : '') + '>' +
      d.jour.slice(0, 3) + '<br><span class="muet">' + dateFr(d.date).slice(0, 5) + '</span></th>';
  }).join('');

  const lignes = archers.map(function (a) {
    const cellules = dates.map(function (d, i) {
      const rep = a.reponses[i];
      const valeur = rep ? rep.reponse : '';
      const titre = a.nom + ' — ' + dateFr(d.date) + ' : ' + (valeur || 'sans réponse') +
        (rep && rep.commentaire ? ' (' + rep.commentaire + ')' : '');
      return '<td' + (i === 0 ? ' class="prochaine"' : '') + '><span class="etat ' +
        (valeur ? classeReponse(valeur) : 'neutre') + '" title="' + esc(titre) + '">' +
        (lettres[valeur] || '—') + '</span></td>';
    }).join('');
    const absentPartout = a.reponses.slice(0, dates.length).every(function (x) { return !x; });
    return '<tr' + (absentPartout ? ' class="muette"' : '') + '><th class="nom">' + esc(a.nom) +
      '</th>' + cellules + '</tr>';
  }).join('');

  const total = function (cle, libelle, classe) {
    return '<tr class="totaux"><th class="nom"><span class="puce ' + classe + '">' + libelle + '</span></th>' +
      dates.map(function (d, i) {
        return '<td' + (i === 0 ? ' class="prochaine"' : '') + '>' + d[cle] + '</td>';
      }).join('') + '</tr>';
  };

  const prochaine = r.recap.dates[0];
  return '<div class="titre-section"><h2>Récapitulatif</h2>' +
    '<span class="muet">' + archers.length + ' archer' + (archers.length > 1 ? 's' : '') + ' actif' +
    (archers.length > 1 ? 's' : '') + '</span></div>' +
    '<div class="carte">' +
    '<p class="muet" style="margin:0 0 10px">Prochaine séance ' +
    prochaine.jour + ' ' + dateFr(prochaine.date) + ' : <strong>' + prochaine.presents +
    ' présent' + (prochaine.presents > 1 ? 's' : '') + '</strong>, ' + prochaine.peutEtre +
    ' peut-être, ' + prochaine.absents + ' absent' + (prochaine.absents > 1 ? 's' : '') + ', ' +
    prochaine.sansReponse + ' sans réponse.</p>' +
    '<div class="recap"><table class="recap-table"><thead><tr><th class="nom">Archer</th>' +
    enTete + '</tr></thead><tbody>' + lignes + '</tbody><tfoot>' +
    total('presents', 'P', 'vert') + total('peutEtre', '?', 'orange') +
    total('absents', 'A', 'rouge') + total('sansReponse', '—', 'neutre') +
    '</tfoot></table></div>' +
    '<div class="legende" style="margin-top:10px">' +
    '<span><span class="pastille-c" style="background:var(--vert)"></span>P présent</span>' +
    '<span><span class="pastille-c" style="background:var(--orange)"></span>? peut-être</span>' +
    '<span><span class="pastille-c" style="background:var(--rouge)"></span>A absent</span>' +
    '<span><span class="pastille-c" style="background:var(--trait)"></span>— sans réponse</span>' +
    '</div>' +
    (r.recap.dates.length > 8
      ? '<div class="actions"><button class="secondaire" onclick="basculerRecap()">' +
        (etat.recapTout ? 'Voir les 8 prochaines séances' : 'Voir les ' + r.recap.dates.length +
          ' séances') + '</button></div>'
      : '') +
    '</div>';
}

/** Récapitulatif court (8 séances) ou complet. */
function basculerRecap() {
  etat.recapTout = !etat.recapTout;
  if (etat.calendrier) rendreCalendrier(etat.calendrier);
}

function classeReponse(reponse) {
  if (reponse === 'Présent') return 'vert';
  if (reponse === 'Absent') return 'rouge';
  return 'orange';
}

function repondreSeance(date, reponse) {
  api('apiRepondreCalendrier', date, reponse, '').then(function (r) {
    if (!r.ok) { notifier(r.message, true); return; }
    notifier(r.message);
    chargerCalendrier();
  });
}

/* ---------- Messagerie ---------- */

function chargerMessages() {

      }), '', 'Tout le club');

        (prive ? '<span class="puce orange">message privé</span>' : '') +

        (m.auteurId === r.moi || etat.estAdmin
          ? '<button class="lien-discret" onclick="supprimerMessage(\'' + m.id +
            '\')">Supprimer</button>'

document.getElementById('formMessage').addEventListener('submit', function (e) {
  e.preventDefault();
  const btn = document.getElementById('btnMessage');
  const texte = document.getElementById('messageTexte').value;
  const dest = document.getElementById('messageDestinataire');
  if (!texte.trim()) return;

  btn.disabled = true;

function supprimerMessage(id) {

/** Pastille de l'onglet Messages. */
function majBadgeMessages(nombre) {
  const badge = document.getElementById('badgeMessages');
  if (badge) {
    badge.textContent = nombre > 9 ? '9+' : String(nombre);
    badge.hidden = !nombre;
  }
  pastilleAppareil(nombre);
}

/*
 * L'application tourne dans le cadre de la page d'accueil du club. C'est cette
 * page-là qui est installée sur l'écran d'accueil : elle seule peut poser la
 * pastille sur l'icône et afficher une notification du téléphone. On lui
 * transmet donc ce qu'il y a à montrer.
 */
function versPageAccueil(message) {
  try {
    if (window.top === window) return false;
    window.top.postMessage(Object.assign({ arc: true }, message), '*');
    return true;
  } catch (e) {
    return false;
  }
}

/** Pastille sur l'icône : nombre de messages non lus. */
function pastilleAppareil(nombre) {
  const n = Number(nombre) || 0;
  if (versPageAccueil({ type: 'pastille', nombre: n })) return;
  try {
    if (n && navigator.setAppBadge) navigator.setAppBadge(n);
    else if (navigator.clearAppBadge) navigator.clearAppBadge();
  } catch (e) { /* non géré par ce téléphone */ }
}

/**
 * Notification des nouveaux messages : la page interroge le serveur toutes les
 * minutes tant qu'elle est ouverte, et signale ce qui est arrivé depuis la
 * dernière consultation.
 */
function surveillerMessages(initial) {
  if (etat.minuteurMessages) clearInterval(etat.minuteurMessages);
  if (etat.minuteurCompetition) clearInterval(etat.minuteurCompetition);
  let premiere = true;

  const traiter = function (r) {
      if (!r) return;

      // Messagerie pas encore installée : on le dit une fois et on arrête de
      // sonder — sinon l'absence de notification reste inexpliquée.
      if (!r.ok) {
        if (r.absent) {
          clearInterval(etat.minuteurMessages);
          if (!etat.messagerieSignalee) {
            etat.messagerieSignalee = true;
            notifier(r.message, true);
          }
        }
        return;
      }

      const avant = etat.messagesNonLus || 0;
      etat.messagesNonLus = r.nombre;
      majBadgeMessages(r.nombre);

      if (premiere) {
        // À l'ouverture, on annonce franchement ce qui attend l'archer.
        premiere = false;
        if (r.nombre) annoncerMessages(r);
      } else if (r.nombre > avant && r.dernier) {
        notifier('Nouveau message de ' + r.dernier.auteur);
        notificationSysteme('Nouveau message de ' + r.dernier.auteur,
          (r.dernier.texte || '').slice(0, 120));
      }
  };

  const verifier = function () {
    if (!jeton || document.hidden) return;
    appel('apiMessagesNonLus', jeton).then(traiter).catch(function (e) {
      console.warn('Vérification des messages impossible : ' + (e && e.message));
    });
  };

  // Une mini-compétition ouverte par l'encadrement s'annonce d'elle-même.
  const guetterCompetition = function () {
    if (!jeton || document.hidden || estEnDirect() || etat.competitionProposee) return;
    appel('apiCompetitionEnCours', jeton).then(function (r) {
      if (!r || !r.ok || !r.competition) return;
      etat.competitionProposee = r.competition;
      majBandeauDirect();
      notifier('Mini-compétition en cours : rejoignez-la depuis l’onglet Score.');
    }).catch(function () { /* sans conséquence */ });
  };
  etat.minuteurCompetition = setInterval(guetterCompetition, 60000);
  etat.minuteurMessages = setInterval(verifier, 60000);
  // Le démarrage apporte déjà le premier décompte : inutile de le redemander.
  if (initial) traiter(initial); else verifier();
}

/**
 * Notification du système, si le navigateur l'autorise.
 *
 * Une application Apps Script s'affiche dans un cadre : ni service worker ni
 * notification « poussée » n'y sont possibles. On se contente donc d'une
 * notification locale, pendant que l'application est ouverte — l'email reste
 * le seul canal qui atteint un téléphone fermé.
 */
function notificationSysteme(titre, corps) {
  // Dans le cadre, la notification est affichée par la page d'accueil : c'est
  // elle qui porte l'autorisation du téléphone.
  if (versPageAccueil({ type: 'notification', titre: titre, corps: corps })) return;
  try {
    if (typeof Notification === 'undefined') return;
    if (Notification.permission !== 'granted') return;
    new Notification(titre, { body: corps, tag: 'tirarc-message' });
  } catch (e) {
    /* notifications refusées : la pastille suffira */
  }
}

/**
 * Safari sur iPhone n'accorde les notifications qu'aux applications installées
 * disposant d'un service worker : dans le cadre où Google affiche une
 * application Apps Script, la demande est toujours refusée. On ne propose donc
 * le bouton que là où il a une chance d'aboutir.
 */
function surIphone() {
  return /iPad|iPhone|iPod/.test(navigator.userAgent) ||
    (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
}

function notificationsPossibles() {
  // Dans le cadre, c'est la page d'accueil qui demande l'autorisation : elle
  // affiche son propre bandeau, l'application n'a rien à proposer.
  if (window.top !== window) return false;
  return typeof Notification !== 'undefined' &&
    Notification.permission === 'default' && !surIphone();
}

function demanderNotifications() {
  try {
    const demande = Notification.requestPermission();
    if (!demande || !demande.then) { expliquerNotifications(); return; }
    demande.then(function (choix) {
      if (choix === 'granted') {
        notifier('Notifications activées sur cet appareil.');
        rendreProfil();
      } else {
        expliquerNotifications();
      }
    }, expliquerNotifications);
  } catch (e) {
    expliquerNotifications();
  }
}

function expliquerNotifications() {
  modale('<h2>Notifications du téléphone</h2>' +
    '<p>Votre navigateur les refuse ici, et c’est normal : l’application est ' +
    'affichée par Google dans un cadre, où Safari comme Chrome interdisent les ' +
    'notifications système. Aucun réglage de l’application ne peut passer outre.</p>' +
    '<div class="carte"><strong>Ce qui vous prévient quand même</strong>' +
    '<ul class="muet" style="margin:8px 0 0;padding-left:18px;line-height:1.7">' +
    '<li><strong>Les emails</strong> : ils arrivent sur le téléphone comme une ' +
    'notification, même application fermée. À activer dans l’onglet Paramètres du ' +
    'classeur, ligne « Notifications messages ».</li>' +
    '<li>La fenêtre à l’ouverture de l’application et la pastille rouge sur ' +
    'l’onglet Messages.</li></ul></div>' +
    '<button class="principal" onclick="fermerModale()">Compris</button>');
}

/** Annonce d'entrée de jeu les messages non lus. */
function annoncerMessages(r) {
  const pluriel = r.nombre > 1;
  modale('<div style="text-align:center">' +
    '<svg viewBox="0 0 24 24" style="width:42px;height:42px;margin:0 auto 8px;color:var(--accent)">' +
    '<use href="#ico-messages"/></svg>' +
    '<h2>' + r.nombre + (pluriel ? ' nouveaux messages' : ' nouveau message') + '</h2>' +
    (r.dernier
      ? '<p class="muet">Dernier message de <strong>' + esc(r.dernier.auteur) + '</strong></p>' +
        '<div class="carte" style="text-align:left"><p class="message-texte" style="margin:0">' +
        esc((r.dernier.texte || '').slice(0, 220)) +
        ((r.dernier.texte || '').length > 220 ? '…' : '') + '</p></div>'
      : '') +
    '<div class="actions">' +
    '<button class="principal" onclick="fermerModale(); allerA(\'Messages\')">Lire</button>' +
    '<button class="secondaire" onclick="fermerModale()">Plus tard</button></div></div>');
}

  if (etat.estAdmin) {

  html += '<div class="actions"><button class="principal" onclick="ouvrirFormulaireInscrit(\'' + a.id + '\')">Modifier mes informations</button></div>';

      'système ne sont pas possibles dans une application Apps Script. ' +
      '<button class="lien-discret" onclick="expliquerNotifications()">En savoir plus</button></p>';
  }

    '<svg viewBox="0 0 24 24" style="width:16px;height:16px;vertical-align:-3px;margin-right:6px">' +
    '<use href="#ico-quitter"/></svg>Déconnexion</button></div>';
  html += '<p class="muet" style="text-align:center;margin-top:18px">' + esc(etat.role) + ' · ' + esc(a.id) + '</p>';

  document.getElementById('profilContenu').innerHTML = html;

/* ---------- Apparence : choix du membre ---------- */

function blocApparence() {
  const t = etat.theme || { mode: 'auto', couleur: 'sapin' };
  const themes = (etat.ref && etat.ref.themes) || { modes: ['auto', 'clair', 'sombre'], couleurs: [] };
  const libelles = { auto: 'Auto', clair: 'Clair', sombre: 'Sombre' };
  return '<div class="titre-section"><h2>Apparence</h2>' +
    '<span class="muet">sur tous vos appareils</span></div><div class="carte">' +
    '<div class="segment" style="margin:0">' + themes.modes.map(function (m) {
      return '<button type="button" class="' + (t.mode === m ? 'actif' : '') +
        '" onclick="choisirTheme(\'mode\', \'' + m + '\')">' + (libelles[m] || m) + '</button>';
    }).join('') + '</div>' +
    '<p class="muet" style="margin:8px 0 0">Auto suit le réglage clair ou sombre du téléphone.</p>' +
    '<div class="nuancier">' + themes.couleurs.map(function (c) {
      return '<button type="button" class="nuance' + (t.couleur === c.code ? ' actif' : '') +
        '" onclick="choisirTheme(\'couleur\', \'' + c.code + '\')" aria-label="Couleur ' + esc(c.label) + '">' +
        '<span class="rond" style="background:' + esc(c.apercu) + '"></span>' + esc(c.label) + '</button>';
    }).join('') + '</div></div>';
}

let minuteurTheme = null;
function choisirTheme(cle, valeur) {
  etat.theme = Object.assign({ mode: 'auto', couleur: 'sapin' }, etat.theme || {});
  etat.theme[cle] = valeur;
  appliquerTheme(etat.theme);
  rendreProfil();
  // Plusieurs essais d'affilée : un seul enregistrement.
  clearTimeout(minuteurTheme);
  minuteurTheme = setTimeout(function () {
    api('apiEnregistrerTheme', etat.theme).then(function (r) {
      if (!r.ok) notifier(r.message, true);
    });
  }, 700);
}

/* ---------- Paramètres de l'application (admin) ---------- */

  const el = document.getElementById('profilContenu');

}

/** Force la relecture du classeur après une modification faite à la main. */
function viderCacheServeur(bouton) {
  if (bouton) { bouton.disabled = true; bouton.textContent = 'Relecture…'; }
  api('apiViderCache').then(function (r) {
    notifier(r.message, !r.ok);
    if (r.ok) {
      oublierDemarrage();
      chargerScores();
      rafraichirProgression();
    }
  }).then(function () {
    if (bouton) { bouton.disabled = false; bouton.textContent = 'Relire le classeur maintenant'; }
  });
}

function enregistrerParametresApp(e) {
  e.preventDefault();
  const valeurs = {};
  Array.prototype.forEach.call(document.querySelectorAll('#formParametres .parametre'), function (bloc) {
    const champ = bloc.querySelector('[data-cle]');
    if (champ && champ.value !== bloc.dataset.initial) valeurs[champ.dataset.cle] = champ.value;
  });
  if (!Object.keys(valeurs).length) { notifier('Aucune modification.'); return; }
  const btn = document.getElementById('btnParametres');
  btn.disabled = true;
  btn.textContent = 'Enregistrement…';
  api('apiEnregistrerParametres', valeurs).then(function (r) {
    notifier(r.message, !r.ok);
    ouvrirParametresApp();
  }).catch(function () {
    btn.disabled = false;
    btn.textContent = 'Enregistrer';
  });
}

function copierTexte(id, message) {
  const champ = document.getElementById(id);
  if (!champ) return;
  champ.select();
  champ.setSelectionRange(0, 999999);
  const fini = function (ok) {
    notifier(ok ? message : 'Copie impossible : sélectionnez le texte à la main.', !ok);
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(champ.value).then(function () { fini(true); },
      function () { fini(document.execCommand && document.execCommand('copy')); });
  } else {
    fini(document.execCommand && document.execCommand('copy'));
  }
}

/** Feuille de partage du téléphone quand elle est permise, sinon copie. */
function partagerTexte(id, titre) {
  const champ = document.getElementById(id);
  if (!champ) return;
  if (navigator.share) {
    navigator.share({ title: titre, text: champ.value }).catch(function (err) {
      if (!err || err.name !== 'AbortError') copierTexte(id, 'Partage indisponible ici : texte copié.');
    });
  } else {
    copierTexte(id, 'Partage indisponible ici : texte copié.');
  }
}

/* ---------- Classement du club ---------- */

/*
 * Critères du classement. `partie` : la partie qui porte le record (le détail
