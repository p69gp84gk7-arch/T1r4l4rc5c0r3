  if (voleeValidee(v)) {
    confirmer({
      titre: 'Modifier la volée ' + (v + 1) + ' ?',
      message: 'Elle est validée. Vous pourrez la corriger puis la valider à nouveau.',
      valider: 'Modifier',
      danger: false,
    }).then(function (oui) { if (oui) ouvrirVolee(v); });
    return;
  }
  ouvrirVolee(v);
});

/** Efface une volée entière, sans toucher aux autres. */
function viderVolee(numero) {
  if (!verifierSaisieAutorisee()) return;
  const parVolee = Number(document.getElementById('scoreParVolee').value || 6);
  const debut = numero * parVolee;
  const saisies = saisie.fleches.slice(debut, debut + parVolee)
    .filter(function (v) { return v !== undefined && v !== null; }).length;
  if (!saisies) return;
  confirmer({
    titre: 'Effacer la volée ' + (numero + 1) + ' ?',
    message: saisies + ' flèche' + (saisies > 1 ? 's' : '') + ' de cette volée ser' +
      (saisies > 1 ? 'ont effacées' : 'a effacée') + '. Les autres volées ne bougent pas.',
    valider: 'Effacer la volée',
  }).then(function (oui) {
    if (!oui) return;
    if (estEnDirect()) {
      const vides = [];
      for (let f = 0; f < parVolee; f++) vides.push(null);
      ajouterVoleeEnAttente({ adherentId: competition.courant, volee: numero, parVolee: parVolee,
        blason: blasonChoisi(), fleches: vides, impacts: vides.slice(), validee: false });
      envoyerCarteDirecte().then(function (ok) {
        notifier(ok ? 'Volée ' + (numero + 1) + ' effacée.' : 'Effacement pas encore envoyé, nouvel essai automatique.', !ok);
        if (!ok) programmerEnvoiDirect();
      });
      return;
    }
    const instantane = instantaneSeance();
    for (let i = debut; i < debut + parVolee; i++) {
      saisie.fleches[i] = null;
      saisie.impacts[i] = null;
    }
    saisie.validees[numero] = false;
    saisie.index = debut;
    rendreSaisie();
    proposerAnnulation('Volée ' + (numero + 1) + ' effacée.', instantane);
  });
}

function majRecap() {
  const total = nbFlechesPrevues();
  const saisies = saisie.fleches.filter(function (v) { return v !== undefined && v !== null; });
  const score = saisies.reduce(function (t, v) { return t + v; }, 0);
  document.getElementById('recapScore').textContent = score;
  document.getElementById('recapMax').textContent = '/' + total * 10;
  const sauvee = etat.derniereSauvegarde && saisies.length
    ? ' · sauvegardée à ' + etat.derniereSauvegarde.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' })
    : '';
  const pourcent = document.getElementById('recapPourcent');
  if (pourcent) {
    pourcent.textContent = total && saisies.length ? Math.round((score / (total * 10)) * 100) + ' %' : '';
  }
  const volee = saisie.mode === 'global' ? 0 : Math.min(nbVoleesCourant(), premiereVoleeAFaire() + 1);
  document.getElementById('recapAvancement').textContent =
    saisies.length + ' flèche' + (saisies.length > 1 ? 's' : '') + ' sur ' + total +
    (saisies.length ? ' · moyenne ' + (score / saisies.length).toFixed(2) + ' pts/flèche' : '') +
    (volee && saisies.length < total ? ' · volée ' + volee + ' sur ' + nbVoleesCourant() : '') + sauvee;
  document.getElementById('scoreMaxIndice').textContent = total ? '/ ' + total * 10 : '';
  document.getElementById('scorePoints').max = total * 10 || 9999;
}

document.getElementById('btnEffacerFleche').addEventListener('click', function () {
  if (!verifierSaisieAutorisee()) return;
  if (estEnDirect()) { notifier('En direct, touchez une volée pour la corriger.', true); return; }
  const cible = Math.max(0, saisie.index - 1);
  const val = saisie.fleches[cible];
  if (saisie.mode !== 'global' && voleeValidee(Math.floor(cible / parVoleeCourant())) &&
      val !== undefined && val !== null) {
    notifier('Volée ' + (Math.floor(cible / parVoleeCourant()) + 1) +
      ' validée : touchez une de ses flèches pour la modifier.', true);
    return;
  }
  const effacer = function () {
    saisie.index = cible;
    saisie.fleches[cible] = null;
    saisie.impacts[cible] = null;
    rendreSaisie();
  };
  // Une case vide se franchit sans rien demander.
  if (val === undefined || val === null) { effacer(); return; }
  const parVolee = Number(document.getElementById('scoreParVolee').value || 6);
  confirmer({
    titre: 'Effacer cette flèche ?',
    message: 'Volée ' + (Math.floor(cible / parVolee) + 1) + ', flèche ' + (cible % parVolee + 1) +
      ' : ' + (val === 0 ? 'manquée' : val + ' point' + (val > 1 ? 's' : '')) + '.',
    valider: 'Effacer la flèche',
  }).then(function (oui) {
    if (!oui) return;
    const instantane = instantaneSeance();
    effacer();
    proposerAnnulation('Flèche effacée.', instantane);
  });
});

/** Liste des archers à cocher pour la compétition. */
function rendreParticipants() {
  const actifs = (etat.inscrits || []).filter(function (a) { return a.statut !== 'Inactif'; });
  document.getElementById('participants').innerHTML = actifs.map(function (a) {
    const choisi = competition.archers.some(function (x) { return x.id === a.id; });
    return '<label class="' + (choisi ? 'coche' : '') + '">' +
      '<input type="checkbox" value="' + a.id + '"' + (choisi ? ' checked' : '') + '>' +
      esc(a.prenom + ' ' + a.nom) + '</label>';
  }).join('');
}

document.getElementById('participants').addEventListener('change', function (e) {
  const c = e.target.closest('input[type=checkbox]');
  if (!c) return;
  const inscrit = (etat.inscrits || []).filter(function (a) { return a.id === c.value; })[0];
  if (!inscrit) return;

  if (c.checked) {
    competition.archers.push({
      id: inscrit.id, nom: inscrit.prenom + ' ' + inscrit.nom,
      fleches: [], impacts: [], index: 0, validees: [],
    });
    if (!competition.courant) chargerCarte(inscrit.id);
  } else {
    sauverCarteCourante();
    const carte = competition.archers.filter(function (a) { return a.id === c.value; })[0];
    const tirees = carte
      ? carte.fleches.filter(function (v) { return v !== undefined && v !== null; }).length : 0;
    if (tirees) {
      // Décocher efface la carte de l'archer : la case reste cochée jusqu'à confirmation.
      c.checked = true;
      confirmer({
        titre: 'Retirer ' + carte.nom + ' ?',
        message: tirees + ' flèche' + (tirees > 1 ? 's' : '') + ' saisie' + (tirees > 1 ? 's' : '') +
          ' pour cet archer ser' + (tirees > 1 ? 'ont' : 'a') + ' effacée' + (tirees > 1 ? 's' : '') + '.',
        valider: 'Retirer et effacer',
      }).then(function (oui) {
        if (!oui) return;
        const instantane = instantaneSeance();
        c.checked = false;
        const etiquette = c.closest('label');
        if (etiquette) etiquette.classList.remove('coche');
        retirerParticipant(c.value);
        majCompetition();
        majVerrouSeance();
        proposerAnnulation(carte.nom + ' retiré de la compétition.', instantane);
      });
      return;
    }
    retirerParticipant(c.value);
  }
  // On ne redessine pas la liste : cocher une case ne doit pas détruire les
  // autres (ni faire sauter le défilement).
  const etiquette = c.closest('label');
  if (etiquette) etiquette.classList.toggle('coche', c.checked);
  majCompetition();
  majVerrouSeance();
});

function retirerParticipant(id) {
  competition.archers = competition.archers.filter(function (a) { return a.id !== id; });
  if (competition.courant === id) {
    competition.courant = null;
    if (competition.archers.length) chargerCarte(competition.archers[0].id);
    else reinitialiserSaisie();
  }
}

/** Mémorise la carte de l'archer affiché avant d'en changer. */
function sauverCarteCourante() {
  if (!competition.actif || !competition.courant) return;
  const a = competition.archers.filter(function (x) { return x.id === competition.courant; })[0];
  if (!a) return;
  a.fleches = saisie.fleches.slice();
  a.impacts = saisie.impacts.slice();
  a.index = saisie.index;
  a.validees = saisie.validees.slice();
}

/** Affiche la carte d'un participant. */
function chargerCarte(id) {
  sauverCarteCourante();
  const a = competition.archers.filter(function (x) { return x.id === id; })[0];
  if (!a) return;
  competition.courant = id;
  saisie.fleches = a.fleches.slice();
  saisie.impacts = a.impacts.slice();
  saisie.index = a.index;
  saisie.validees = (a.validees || []).slice();
  saisie.visee = null;
  rendreSaisie();
}

function majCompetition() {
  const onglets = document.getElementById('ongletsArchers');
  const classement = document.getElementById('classementDirect');

  sauverCarteCourante();
  const total = function (a) {
    return a.fleches.reduce(function (t, v) { return t + (v || 0); }, 0);
  };
  const tirees = function (a) {
    return a.fleches.filter(function (v) { return v !== undefined && v !== null; }).length;
  };

  const verrouille = estEnDirect() && !etat.saisitPourAutres;
  onglets.innerHTML = competition.archers.map(function (a) {
    return '<button type="button" class="' + (a.id === competition.courant ? 'actif' : '') +
      (verrouille && a.id !== etat.moi.id ? ' verrou' : '') +
      '" onclick="chargerCarte(\'' + a.id + '\')">' + esc(a.nom) +
      '<span class="pts">' + total(a) + ' pts</span></button>';
  }).join('') || '<span class="muet">Aucun participant sélectionné.</span>';

  if (competition.archers.length < 2) { classement.innerHTML = ''; return; }
  const ordre = competition.archers.slice().sort(function (x, y) { return total(y) - total(x); });
  classement.innerHTML = '<div class="titre-section"><h3>Classement provisoire</h3></div>' +
    '<table class="tableau"><thead><tr><th>Archer</th><th>Flèches</th>' +
    '<th>Moyenne</th><th>Score</th></tr></thead><tbody>' +
    ordre.map(function (a, i) {
      const n = tirees(a);
      return '<tr><td>' + (i + 1) + '. ' + esc(a.nom) + '</td><td>' + n + '</td>' +
        '<td>' + (n ? (total(a) / n).toFixed(2) : '—') + '</td>' +
        '<td><strong>' + total(a) + '</strong></td></tr>';
    }).join('') + '</tbody></table>';
}

/**
 * Résumé des réglages, lisible quand le bloc est replié : la cible gagne
 * alors toute la hauteur de l'écran.
 */
/*
 * Trois temps sur l'onglet Score : on choisit ce qu'on veut faire, on règle la
 * partie dans une fenêtre à part, puis le carton s'ouvre avec le récapitulatif
 * des réglages sous les yeux — de quoi ne pas se tromper de distance ou de
 * blason en cours de séance.
 */
function resumeReglagesTexte() {
  const valeur = function (id) { return document.getElementById(id).value; };
  return [
    dateFr(valeur('scoreDate')), valeur('scoreDiscipline'),
    valeur('scoreDistance') ? valeur('scoreDistance') + ' m' : '',
    blasonChoisi(), valeur('scoreVolees') + ' × ' + valeur('scoreParVolee') + ' flèches',
  ].filter(Boolean).join(' · ');
}

function majResumeReglages() {
  const el = document.getElementById('resumeReglages');
  if (el) el.textContent = resumeReglagesTexte();
  majRecapReglages();
}

/** Récapitulatif affiché au-dessus du carton. */
function majRecapReglages() {
  const el = document.getElementById('recapReglages');
  if (!el) return;
  const valeur = function (id) { return document.getElementById(id).value; };
  const qui = competition.actif
    ? competition.archers.length + ' archer(s) : ' +
      competition.archers.map(function (a) { return esc(a.nom); }).join(', ')
    : (etat.saisitPourAutres && valeur('scoreArcher')
      ? esc((document.getElementById('scoreArcher').selectedOptions[0] || {}).textContent || '')
      : esc(etat.moi ? etat.moi.prenom + ' ' + etat.moi.nom : ''));
  const titre = etat.modification
    ? 'Partie enregistrée, en modification'
    : (competition.actif ? 'Mini-compétition' : 'Partie');
  el.innerHTML = '<div class="titre"><strong>' + titre + '</strong>' +
    (estEnDirect()
      ? '<span class="puce vert">en direct</span>'
      : '<span class="boutons-recap">' +
        '<button type="button" class="secondaire" onclick="ouvrirReglages()">Réglages</button>' +
        '<button type="button" class="danger-doux" onclick="annulerPartie()">' +
        (etat.modification ? 'Abandonner' : 'Annuler la partie') + '</button></span>') +
    '</div>' +
    (etat.modification
      ? '<div class="lignes">Partie du <strong>' + dateFr(etat.modification.date) + '</strong> déjà enregistrée. ' +
        '<button type="button" class="secondaire" onclick="abandonnerModification()">Abandonner la modification</button></div>'
      : '') +
    '<div class="lignes"><strong>' + esc(resumeReglagesTexte()) + '</strong><br>' +
    (valeur('scoreSeance') ? esc(valeur('scoreSeance')) + ' · ' : '') +
    esc(valeur('scoreContexte')) + (valeur('scoreLieu') ? ' · ' + esc(valeur('scoreLieu')) : '') +
    '<br>' + qui + '</div>';
}

/** Annule la séance en cours : tout est effacé, après confirmation. */
function annulerPartie() {
  if (estEnDirect()) {
    notifier('Mini-compétition en direct : utilisez le bandeau en haut pour la quitter ou l’abandonner.', true);
    return;
  }
  if (etat.modification) { abandonnerModification(); return; }
  const tirees = (saisie.fleches || []).filter(function (v) { return v !== undefined && v !== null; }).length +
    competition.archers.reduce(function (t, a) {
      return t + (a.fleches || []).filter(function (v) { return v !== undefined && v !== null; }).length;
    }, 0);
  const finir = function () {
    const instantane = instantaneSeance();
    const idBrouillon = brouillon.id;
    document.getElementById('scorePoints').value = '';
    abandonnerSeance();
    // La séance mise de côté est close : elle ne reviendra pas à la connexion.
    brouillon.idSauve = idBrouillon;
    brouillon.derniere = '';
    sauverBrouillon();
    memoriserSeanceLocale('');
    etat.reglagesValides = false;
    majTypeSaisie();
    majEtapeSaisie();
    proposerAnnulation('Partie annulée.', instantane);
  };
  if (!tirees) { finir(); return; }
  confirmer({
    titre: 'Annuler la partie ?',
    message: tirees + ' flèche' + (tirees > 1 ? 's' : '') + ' saisie' + (tirees > 1 ? 's' : '') +
      ' ser' + (tirees > 1 ? 'ont' : 'a') + ' effacée' + (tirees > 1 ? 's' : '') +
      ' et la partie ne sera pas enregistrée. Vous pourrez revenir en arrière pendant quelques secondes.',
    valider: 'Annuler la partie',
  }).then(function (oui) { if (oui) finir(); });
}

/** Affiche l'étape en cours : choix, réglages, ou carton. */
function majEtapeSaisie() {
  const pret = !!etat.reglagesValides;
  const montrer = function (id, visible) {
    const el = document.getElementById(id);
    if (el) el.hidden = !visible;
  };
  montrer('demarrerPartie', !pret);
  montrer('recapReglages', pret);
  const btn = document.getElementById('btnScore');
  if (btn) btn.style.display = pret && !(estEnDirect() && !estMaitreDirect()) ? '' : 'none';
  document.getElementById('blocSaisie').style.display =
    pret && saisie.mode !== 'global' ? '' : 'none';
  document.getElementById('blocGlobal').style.display =
    pret && saisie.mode === 'global' ? '' : 'none';
  document.getElementById('ongletsArchers').style.display = pret && competition.actif ? '' : 'none';
  document.getElementById('classementDirect').style.display = pret && competition.actif ? '' : 'none';
  const nouvelle = document.getElementById('btnNouvelleCompetition');
  if (nouvelle) nouvelle.style.display = etat.saisitPourAutres ? '' : 'none';
  if (pret) majRecapReglages();
}

function ouvrirReglages(type) {
  if (type) {
    competition.actif = type === 'competition';
    Array.prototype.forEach.call(document.querySelectorAll('#typeSaisie button'), function (x) {
      x.classList.toggle('actif', (x.dataset.type === 'competition') === competition.actif);
    });
    majTypeSaisie();
  }
  document.getElementById('frTitre').textContent = etat.modification
    ? 'Réglages de la partie enregistrée'
    : (competition.actif ? 'Réglages de la mini-compétition' : 'Réglages de la partie');
  document.getElementById('frSous').textContent = estEnDirect() && !estMaitreDirect()
    ? 'Réglages fixés par le créateur de la mini-compétition'
    : 'À vérifier avant d’ouvrir le carton';
  document.getElementById('btnValiderReglages').textContent = competition.actif && !estEnDirect()
    ? 'Valider et lancer en direct'
    : (etat.reglagesValides ? 'Valider les réglages' : 'Valider et ouvrir le carton');
  document.getElementById('frAnnuler').textContent = etat.reglagesValides ? 'Annuler' : 'Plus tard';
  document.getElementById('fenetreReglages').hidden = false;
  document.body.classList.add('vv-ouverte');
}

function fermerReglages() {
  document.getElementById('fenetreReglages').hidden = true;
  document.body.classList.remove('vv-ouverte');
  // Fermée sans valider : on revient au choix « Régler une partie ».
  majEtapeSaisie();
}

/** Contrôle des réglages, puis ouverture du carton. */
function validerReglages() {
  const valeur = function (id) { return document.getElementById(id).value; };
  if (!valeur('scoreDate')) { notifier('Indiquez la date de la partie.', true); return; }
  if (!valeur('scoreDiscipline')) { notifier('Choisissez une discipline.', true); return; }
  if (!Number(valeur('scoreVolees')) || !Number(valeur('scoreParVolee'))) {
    notifier('Indiquez le nombre de volées et de flèches par volée.', true);
    return;
  }
  if (competition.actif && competition.archers.length < 1) {
    notifier('Cochez au moins un archer participant.', true);
    return;
  }
  etat.reglagesValides = true;
  fermerReglages();
  majEtapeSaisie();
  rendreSaisie();
  // Une mini-compétition part directement en direct : chacun remplit les
  // cartes depuis son téléphone, sans second bouton à trouver.
  if (competition.actif && !estEnDirect() && competition.archers.length >= 2) {
    lancerDirect();
    return;
  }
  if (!seanceEnCours()) {
    notifier((competition.actif ? 'Mini-compétition réglée' : 'Partie réglée') + ' · ' + resumeReglagesTexte());
  }
}

document.getElementById('btnNouvellePartie').addEventListener('click', function () { ouvrirReglages('partie'); });
document.getElementById('btnNouvelleCompetition').addEventListener('click', function () { ouvrirReglages('competition'); });
document.getElementById('btnValiderReglages').addEventListener('click', function () { validerReglages(); });
document.getElementById('frAnnuler').addEventListener('click', function () { fermerReglages(); });
document.getElementById('frFermer').addEventListener('click', function () { fermerReglages(); });

/** Replie les réglages dès la première flèche, une seule fois par séance. */
function replierReglages() { /* les réglages vivent désormais dans leur fenêtre */ }

/** Ajuste l'affichage au mode courant : cible, clavier ou score global. */
function majModeSaisie() {
  const detaille = saisie.mode !== 'global';
  const pret = !!etat.reglagesValides;
  document.getElementById('blocSaisie').style.display = pret && detaille ? '' : 'none';
  document.getElementById('blocGlobal').style.display = pret && !detaille ? '' : 'none';
  // Le pavé numérique vit désormais dans la vue de saisie d'une volée.
  document.getElementById('clavier').style.display = 'none';
  Array.prototype.forEach.call(
    document.querySelectorAll('#modeSaisie button'),
    function (x) { x.classList.toggle('actif', x.dataset.mode === saisie.mode); }
  );
}

document.getElementById('modeSaisie').addEventListener('click', function (e) {
  const b = e.target.closest('button');
  if (!b) return;
  saisie.mode = b.dataset.mode;
  majModeSaisie();
  rendreSaisie();
});

/* ---------- Mini-compétition suivie en direct ---------- */

/**
 * Plusieurs téléphones sur la même mini-compétition : l'encadrant l'ouvre,
 * chacun remplit sa carte et voit celles des autres se remplir. L'état vit
 * sur le serveur ; on le relit toutes les cinq secondes, et on n'écrase
 * jamais la carte que l'on est en train de remplir.
 */
const direct = { id: null, version: 0, statut: '', createur: '', minuteur: null, envoi: null,
  participants: [], attente: [], envoiEnCours: null, majLe: null };

function estEnDirect() {
  return !!direct.id;
}

/** Le créateur et l'encadrement pilotent : réglages, enregistrement, abandon. */
function estMaitreDirect() {
  return !!(etat.estEncadrant || (estEnDirect() && direct.createur === etat.moi.id));
}

const CHAMPS_REGLAGES = ['scoreDate', 'scoreContexte', 'scoreSeance', 'scoreDiscipline',
  'scoreDistance', 'scoreBlason', 'scoreVolees', 'scoreParVolee', 'scoreLieu'];

/** Recopie des réglages reçus, sans effacer aucune carte. */
function appliquerReglagesPartie(r, seance) {
  const poser = function (id, v) {
    const el = document.getElementById(id);
    if (!el || v === undefined || v === null || v === '') return;
    if (el.tagName === 'SELECT' &&
        !Array.prototype.some.call(el.options, function (o) { return o.value === String(v); })) return;
    if (String(el.value) !== String(v)) el.value = v;
  };
  if (r.discipline && document.getElementById('scoreDiscipline').value !== r.discipline) {
    poser('scoreDiscipline', r.discipline);
    disciplineSaisie = document.getElementById('scoreDiscipline').value;
    remplirListesDiscipline();
  }
  ['distance', 'blason', 'volees', 'parVolee', 'date', 'contexte', 'lieu'].forEach(function (cle) {
    const id = { distance: 'scoreDistance', blason: 'scoreBlason', volees: 'scoreVolees',
      parVolee: 'scoreParVolee', date: 'scoreDate', contexte: 'scoreContexte', lieu: 'scoreLieu' }[cle];
    poser(id, r[cle]);
  });
  document.getElementById('scoreSeance').value = seance || r.seance || '';
  memoriserBlason();
  majResumeReglages();
}

/** En direct, seuls le créateur et l'encadrement touchent aux réglages. */
function majVerrouReglages() {
  const bloque = estEnDirect() && !estMaitreDirect();
  CHAMPS_REGLAGES.forEach(function (id) {
    const el = document.getElementById(id);
    if (el) el.disabled = bloque;
  });
  const resume = document.getElementById('resumeReglages');
  if (resume && estEnDirect()) {
    resume.title = bloque ? 'Réglages fixés par le créateur de la mini-compétition' : '';
  }
}

let minuteurReglagesDirect = null;
function programmerReglagesDirect() {
  if (!estEnDirect() || !estMaitreDirect()) return;
  clearTimeout(minuteurReglagesDirect);
  minuteurReglagesDirect = setTimeout(function () {
    api('apiMajReglagesCompetition', direct.id, reglagesPartie()).then(function (r) {
      if (!r.ok) { notifier(r.message, true); return; }
      if (r.competition) appliquerCompetitionDistante(r.competition);
      notifier('Réglages partagés avec tous les participants.');
    });
  }, 600);
}

/** Ai-je le droit de remplir la carte affichée ? */
function peutSaisirCarteCourante() {
  if (!estEnDirect()) return true;
  if (etat.estEncadrant || etat.saisitPourAutres) return true;
  return competition.courant === etat.moi.id;
}

function verifierSaisieAutorisee() {
  if (peutSaisirCarteCourante()) return true;
  const a = competition.archers.filter(function (x) { return x.id === competition.courant; })[0];
  notifier('Carte de ' + ((a && a.nom) || 'cet archer') + ' : lecture seule.', true);
  return false;
}

function lancerDirect() {
  if (!competition.actif) { notifier('Passez d’abord en mini-compétition.', true); return; }
  if (competition.archers.length < 2) { notifier('Choisissez au moins deux archers.', true); return; }
  sauverCarteCourante();
  const cartes = {};
  competition.archers.forEach(function (a) {
    cartes[a.id] = { fleches: a.fleches, impacts: a.impacts, index: a.index, validees: a.validees || [] };
  });
  const reglages = reglagesPartie();
  api('apiOuvrirCompetition', {
    date: reglages.date,
    seance: reglages.seance || 'Mini-compétition du ' + dateFr(reglages.date),
    reglages: reglages,
    cartes: cartes,
    archers: competition.archers.map(function (a) { return { id: a.id, nom: a.nom }; }),
  }).then(function (r) {
    if (!r.ok) { notifier(r.message, true); return; }
    if (r.rejointe) {
      // Compétition déjà ouverte par un autre : ses cartes font foi.
      competition.archers = [];
      competition.courant = null;
      direct.attente = [];
    }
    appliquerCompetitionDistante(r.competition);
    majTypeSaisie();
    surveillerCompetition();
    notifier(r.rejointe
      ? 'Une mini-compétition est déjà en direct avec ces archers : vous l’avez rejointe.'
      : 'Mini-compétition en direct : les archers peuvent suivre et saisir.');
  });
}

/** Rejoint la compétition ouverte par l'encadrement. */
function rejoindreDirect() {
  const c = etat.competitionProposee;
  if (!c) return;
  const lancer = function () {
    // État relu à l'instant sur le serveur, jamais l'annonce reçue plus tôt ;
    // et aucune carte locale ne doit repartir vers le serveur.
    api('apiEtatCompetition', c.id, -1).then(function (r) {
      if (!r.ok || !r.competition || r.competition.statut !== 'En cours') {
        etat.competitionProposee = null;
        majBandeauDirect();
        if (r && r.competition) { finDirect(r.competition); return; }
        notifier((r && r.message) || 'Cette mini-compétition est terminée.', true);
        return;
      }
      competition.archers = [];
      competition.courant = null;
      direct.attente = [];
      appliquerCompetitionDistante(r.competition);
      majTypeSaisie();
      surveillerCompetition();
      allerA('Score');
      notifier('Vous suivez la mini-compétition en direct.');
    });
  };
  if (seanceEnCours() && !estEnDirect()) {
    confirmer({
      titre: 'Rejoindre la mini-compétition ?',
      message: 'La séance en cours sur ce téléphone, non enregistrée, sera remplacée par les cartes de la compétition.',
      valider: 'Rejoindre',
      danger: false,
    }).then(function (oui) { if (oui) lancer(); });
    return;
  }
  lancer();
}

/** Recopie l'état venu du serveur, sans écraser la carte en cours de saisie. */
function appliquerCompetitionDistante(c) {
  // Une réponse partie avant ma dernière écriture arrive parfois après elle :
  // l'appliquer effacerait ce que je viens d'envoyer (volée « à revalider »).
  if (direct.id && direct.id === c.id && Number(c.version) < Number(direct.version)) return;
  direct.majLe = new Date();
  // En direct, l'onglet Score montre toujours les cartes de la compétition.
  competition.actif = true;
  Array.prototype.forEach.call(document.querySelectorAll('#typeSaisie button'), function (x) {
    x.classList.toggle('actif', x.dataset.type === 'competition');
  });
  direct.id = c.id;
  direct.version = c.version;
  direct.statut = c.statut;
  direct.createur = c.createur;
  direct.participants = c.participants || [];
  etat.reglagesValides = true;

  // Les réglages de la compétition font foi sur tous les téléphones.
  appliquerReglagesPartie(c.reglages || {}, c.seance);

  // Les cartes du serveur font foi. Seules les volées validées ici et pas
  // encore confirmées par le serveur s'y ajoutent : rien d'autre n'est gardé,
  // rien d'autre ne repart.
  const courantAvant = competition.courant;
  const indexAvant = courantAvant ? saisie.index : 0;
  competition.archers = direct.participants.map(function (p) {
    const d = (c.cartes || {})[p.id] || {};
    const carte = {
      id: p.id, nom: p.nom,
      fleches: (d.fleches || []).slice(),
      impacts: (d.impacts || []).slice(),
      index: d.index || 0,
      validees: (d.validees || []).slice(),
    };
    direct.attente.forEach(function (op) { if (op.adherentId === p.id) appliquerOpVolee(carte, op); });
    // Carte affichée : on garde le curseur de saisie de cet appareil.
    if (p.id === courantAvant) carte.index = indexAvant;
    return carte;
  });

  const ids = competition.archers.map(function (a) { return a.id; });
  const voulu = courantAvant && ids.indexOf(courantAvant) !== -1
    ? courantAvant
    : (ids.indexOf(etat.moi.id) !== -1 ? etat.moi.id : ids[0]);
  competition.courant = null;          // la carte affichée vient d'être remplacée : pas de recopie
  if (voulu) chargerCarte(voulu);
  else rendreSaisie();
  majBandeauDirect();
}

/** Relecture régulière : cinq secondes suffisent au pas de tir. */
function surveillerCompetition() {
  clearInterval(direct.minuteur);
  surveillerProposition();
  if (!estEnDirect()) return;
  let tours = 0;
  direct.minuteur = setInterval(function () {
    if (!estEnDirect() || document.hidden) return;
    // Hors de l'onglet Score, une relecture sur quatre suffit : elle sert
    // surtout à savoir si la mini-compétition a été clôturée.
    tours++;
    if (!document.getElementById('vueScore').classList.contains('active') && tours % 4) return;
    relireCompetition(false).catch(function () { /* réseau : on retentera au tour suivant */ });
  }, 5000);
}

/**
 * Bandeau « Mini-compétition en cours » : il doit disparaître dès que la
 * partie est close, même sur le téléphone d'un archer qui ne l'a pas rejointe.
 */
let minuteurProposition = null;
function surveillerProposition() {
  clearInterval(minuteurProposition);
  if (estEnDirect() || !etat.competitionProposee) return;
  minuteurProposition = setInterval(function () {
    if (document.hidden || estEnDirect() || !etat.competitionProposee) return;
    api('apiCompetitionEnCours').then(function (r) {
      if (!r || !r.ok) return;
      const avant = etat.competitionProposee && etat.competitionProposee.id;
      etat.competitionProposee = r.competition || null;
      if (avant && !etat.competitionProposee) {
        notifier('La mini-compétition est terminée.');
      }
      majBandeauDirect();
      surveillerProposition();
    }).catch(function () { /* réseau : on retentera */ });
  }, 30000);
}

/**
 * Relit l'état partagé. `force` : envoie d'abord ma carte, puis redemande
 * l'état complet même si la version n'a pas bougé.
 */
function relireCompetition(force) {
  if (!estEnDirect()) return Promise.resolve(false);
  const avant = (force || direct.attente.length) ? envoyerCarteDirecte() : Promise.resolve(true);
  return avant.then(function () {
    if (!estEnDirect()) return false;
    return api('apiEtatCompetition', direct.id, force ? -1 : direct.version);
  }).then(function (r) {
    if (!r) return false;
    if (!r.ok) { arreterDirect(r.message); return false; }
    if (r.inchange) {
      direct.majLe = new Date();
      majBandeauDirect();
      return true;
    }
    if (r.competition.statut !== 'En cours') {
      finDirect(r.competition);
      return false;
    }
    appliquerCompetitionDistante(r.competition);
    return true;
  });
}

/** Bouton ↻ du bandeau : scores des autres tout de suite, sans attendre 5 s. */
function actualiserDirect(bouton) {
  if (bouton) { bouton.disabled = true; bouton.textContent = '↻ …'; }
  sauverCarteCourante();
  const empreinte = function () {
    return competition.archers.map(function (a) { return a.id + signatureCarte(a); }).join('|');
  };
  const avant = empreinte();
  relireCompetition(true).then(function (ok) {
    if (!ok) return;
    sauverCarteCourante();
    notifier(empreinte() === avant
      ? 'À jour : aucune nouvelle flèche chez les autres archers.'
      : 'Scores mis à jour.');
  }).catch(function () {
    notifier('Actualisation impossible, nouvel essai dans quelques secondes.', true);
  }).then(function () {
    const b = document.getElementById('btnActualiserDirect');
    if (b) { b.disabled = false; b.textContent = '↻ Actualiser'; }
  });
}

/** Nouvel essai d'envoi des volées validées restées en attente (réseau). */
function programmerEnvoiDirect() {
  if (!estEnDirect() || !direct.attente.length) return;
  clearTimeout(direct.envoi);
  direct.envoi = setTimeout(function () {
    envoyerCarteDirecte().then(function (ok) { if (!ok) programmerEnvoiDirect(); });
  }, 3000);
}

/** Contenu d'une carte, sans le curseur de saisie propre à chaque appareil. */
function signatureCarte(a) {
  return a ? JSON.stringify([a.fleches || [], a.impacts || [], a.validees || []]) : '';
}

/** Range une volée dans une carte, exactement comme le fait le serveur. */
function appliquerOpVolee(carte, op) {
  const base = op.volee * op.parVolee;
  for (let f = 0; f < op.parVolee; f++) {
    const x = op.fleches[f];
    carte.fleches[base + f] = x === undefined ? null : x;
    carte.impacts[base + f] = op.impacts[f] || null;
  }
  for (let k = 0; k < carte.fleches.length; k++) {
    if (carte.fleches[k] === undefined) carte.fleches[k] = null;
    if (carte.impacts[k] === undefined) carte.impacts[k] = null;
  }
  carte.validees = carte.validees || [];
  carte.validees[op.volee] = op.validee !== false;
}

/**
 * Une volée validée (ou effacée) sur ce téléphone : elle s'affiche tout de
 * suite et attend son tour d'envoi. C'est la SEULE chose qui part vers le
 * serveur en direct : jamais une carte entière, jamais une flèche isolée.
 */
function ajouterVoleeEnAttente(op) {
  sauverCarteCourante();
  const i = direct.attente.findIndex(function (x) {
    return x.adherentId === op.adherentId && x.volee === op.volee;
  });
  if (i === -1) direct.attente.push(op); else direct.attente[i] = op;
  const carte = competition.archers.filter(function (a) { return a.id === op.adherentId; })[0];
  if (carte) appliquerOpVolee(carte, op);
  const affiche = competition.courant;
  competition.courant = null;          // la carte vient d'être mise à jour : pas de recopie
  if (affiche) chargerCarte(affiche); else rendreSaisie();
  saisie.index = premiereCaseLibre();
}

/**
 * Envoie, une par une, les volées validées ici. La promesse dit si toutes
 * sont arrivées ; une volée non arrivée (réseau) reste en file et repart.
 */
function envoyerCarteDirecte() {
  if (!estEnDirect()) return Promise.resolve(false);
  if (direct.envoiEnCours) {
    // Un envoi tourne déjà : il prendra aussi les volées ajoutées entre-temps.
    return direct.envoiEnCours.then(function () { return !direct.attente.length; });
  }
  const idDirect = direct.id;
  let dernierEtat = null;
  let refus = false;
  const suivante = function () {
    if (!estEnDirect() || direct.id !== idDirect) return Promise.resolve(false);
    const op = direct.attente[0];
    if (!op) return Promise.resolve(true);
    return api('apiValiderVoleeCompetition', direct.id, op).then(function (r) {
      if (r && r.reessayer) return false;                 // serveur occupé : on retentera
      // La volée a été remplacée pendant l'envoi : la nouvelle version part ensuite.
      if (direct.attente[0] === op) direct.attente.shift();
      if (r && r.competition) dernierEtat = r.competition;
      if (!r || !r.ok) {
        refus = true;
        notifier((r && r.message) || 'Volée refusée par le serveur.', true);
      }
      return suivante();
    });
  };
  direct.envoiEnCours = suivante().catch(function () { return false; }).then(function (toutBon) {
    direct.envoiEnCours = null;
    // L'état renvoyé contient aussi les saisies des autres : on l'affiche.
    if (dernierEtat && estEnDirect() && direct.id === idDirect) appliquerCompetitionDistante(dernierEtat);
    return toutBon && !refus;
  });
  return direct.envoiEnCours;
}

/** Clôture par l'encadrement : enregistrer les cartes, ou tout abandonner. */
function terminerDirect() {
  confirmer({
    titre: 'Terminer la mini-compétition ?',
    message: 'Chaque archer ayant tiré recevra sa partie dans ses scores.',
    valider: 'Enregistrer pour tous',
    annuler: 'Continuer',
    danger: false,
  }).then(function (oui) {
    if (!oui) return;
    const btn = document.getElementById('btnScore');
    btn.disabled = true;
    btn.textContent = 'Enregistrement…';
    // Les volées validées ici partent d'abord : aucune ne doit manquer à la clôture.
    envoyerCarteDirecte().then(function () {
      if (direct.attente.length) {
        btn.disabled = false;
        majTypeSaisie();
        notifier('Des volées validées ne sont pas encore arrivées sur le serveur : réessayez dans un instant.', true);
        programmerEnvoiDirect();
        return null;
      }
      return api('apiFermerCompetition', direct.id, true);
    }).then(function (r) {
      if (!r) return;
      btn.disabled = false;
      majTypeSaisie();
      if (!r.ok && r.dejaFaite) { notifier(r.message, true); arreterDirect(''); abandonnerSeance(); return; }
      if (!r.ok) { notifier(r.message, true); return; }
      modale('<h2>Mini-compétition enregistrée</h2>' +
        '<div class="carte"><table class="tableau"><thead><tr><th>Archer</th>' +
        '<th>Moyenne</th><th>Score</th></tr></thead><tbody>' +
        (r.classement || []).map(function (c, i) {
          return '<tr><td>' + (i + 1) + '. ' + esc(c.archer) + '</td>' +
            '<td>' + c.moyenne + '</td><td><strong>' + c.score + '/' + c.max + '</strong></td></tr>';
        }).join('') + '</tbody></table></div>' +
        '<button class="principal" onclick="fermerModale()">Terminé</button>');
      arreterDirect('');
      seanceEnregistree();
      abandonnerSeance();
      chargerScores();
      rafraichirProgression();
    });
  });
}

function abandonnerDirect() {
  confirmer({
    titre: 'Abandonner la mini-compétition ?',
    message: 'Les cartes en cours seront perdues pour tous les participants.',
    valider: 'Abandonner',
  }).then(function (oui) {
    if (!oui) return;
    api('apiFermerCompetition', direct.id, false).then(function (r) {
      notifier(r.message || 'Mini-compétition abandonnée.', !r.ok);
      arreterDirect('');
      abandonnerSeance();
    });
  });
}

/**
 * La mini-compétition vient d'être close par quelqu'un d'autre : on le dit
 * clairement, on range le direct et on rafraîchit les scores — la partie de
 * chacun est déjà enregistrée sur le serveur.
 */
function finDirect(c) {
  const reglages = (c && c.reglages) || {};
  // Celui qui vient de clôturer a déjà son récapitulatif à l'écran : on ne le
  // recouvre pas d'un second message.
  if (reglages.fermeeParId && reglages.fermeeParId === etat.moi.id) {
    arreterDirect('');
    return;
  }
  const qui = esc(reglages.fermeePar || nomParticipant(c && c.createur) || 'le créateur');
  const enregistree = c && c.statut === 'Enregistrée';
  const participe = (c && c.participants || []).some(function (p) { return p.id === etat.moi.id; });
  arreterDirect('');
  abandonnerSeance();
  etat.reglagesValides = false;
  majEtapeSaisie();
  if (enregistree) {
    chargerScores();
    rafraichirProgression();
  }
  modale('<h2>' + (enregistree ? 'Mini-compétition enregistrée' : 'Mini-compétition abandonnée') + '</h2>' +
    '<p class="muet">' + (enregistree
      ? 'La partie a été enregistrée par <strong>' + qui + '</strong>.' +
        (participe ? ' Elle est désormais dans vos scores.' : '')
      : '<strong>' + qui + '</strong> a abandonné la mini-compétition : rien n’a été enregistré.') +
    '</p><div class="actions">' +
    (enregistree && participe
      ? '<button class="secondaire" onclick="fermerModale();allerA(\'Progression\')">Voir mes scores</button>' : '') +
    '<button class="principal" onclick="fermerModale()">Quitter</button></div>');
}

/** Quitter le direct sans y toucher (participant). */
function quitterDirect() {
  arreterDirect('Vous ne suivez plus la mini-compétition.');
}

function arreterDirect(message) {
  if (vv.ouverte) fermerVueVolee(true);
  clearInterval(direct.minuteur);
  clearTimeout(direct.envoi);
  direct.attente = [];
  direct.majLe = null;
  direct.id = null;
  direct.version = 0;
  direct.statut = '';
  direct.participants = [];
  etat.competitionProposee = null;
  // Un archer qui quitte le direct retrouve la saisie d'une partie ordinaire.
  if (!etat.saisitPourAutres && competition.actif) {
    competition.actif = false;
    competition.archers = [];
    competition.courant = null;
    reinitialiserSaisie();
  }
  majTypeSaisie();
  majBandeauDirect();
  if (message) notifier(message);
}

function nomParticipant(id) {
  const p = (direct.participants || []).filter(function (x) { return x.id === id; })[0];
  if (p) return p.nom;
  const a = (etat.inscrits || []).filter(function (x) { return x.id === id; })[0];
  return a ? a.prenom + ' ' + a.nom : '';
}

/** Bandeau en tête de l'onglet Score : rejoindre, suivre, clôturer. */
function majBandeauDirect() {
  majBoutonAnnuler();
  const el = document.getElementById('bandeauDirect');
  if (!el) return;
  majVerrouReglages();
  const actions = document.getElementById('actionsDirect');
  if (actions) {
    actions.style.display = (competition.actif && etat.saisitPourAutres && !estEnDirect()) ? '' : 'none';
  }

  if (estEnDirect()) {
    const maitre = estMaitreDirect();
    el.style.display = '';
    el.innerHTML = '<span class="pastille-direct"></span>' +
      '<span class="titre">En direct · ' + direct.participants.length + ' archers</span>' +
      (direct.majLe ? '<span class="muet">à jour à ' + direct.majLe.toLocaleTimeString('fr-FR') + '</span>' : '') +
      '<span class="muet">' + (maitre
        ? 'Vous pilotez : réglages, enregistrement. Chacun remplit les cartes depuis son téléphone.'
        : 'Réglages et enregistrement : ' + esc(nomParticipant(direct.createur) || 'le créateur') +
          '. Les cartes se mettent à jour toutes les 5 s.') + '</span>' +
      '<button type="button" id="btnActualiserDirect" onclick="actualiserDirect(this)">↻ Actualiser</button>' +
      (maitre
        ? '<button type="button" class="principal" onclick="terminerDirect()">Terminer</button>' +
          '<button type="button" class="danger" onclick="abandonnerDirect()">Abandonner</button>'
        : '<button type="button" onclick="quitterDirect()">Quitter</button>');
    return;
  }

  if (etat.competitionProposee) {
    const c = etat.competitionProposee;
    el.style.display = '';
    el.innerHTML = '<span class="pastille-direct"></span>' +
      '<span class="titre">Mini-compétition en cours</span>' +
      '<span class="muet">' + esc(c.seance || '') + ' · ' + (c.participants || []).length + ' archers</span>' +
      '<button type="button" class="principal" onclick="rejoindreDirect()">Rejoindre</button>';
    return;
  }
  el.style.display = 'none';
}

/** Réglages partagés par la partie ou la compétition. */
function reglagesPartie() {
  return {
    date: document.getElementById('scoreDate').value,
    seance: document.getElementById('scoreSeance').value,
    contexte: document.getElementById('scoreContexte').value,
    discipline: document.getElementById('scoreDiscipline').value,
    distance: document.getElementById('scoreDistance').value,
    blason: blasonChoisi(),
    volees: document.getElementById('scoreVolees').value,
    parVolee: document.getElementById('scoreParVolee').value,
    lieu: document.getElementById('scoreLieu').value,
  };
}

/** Ne retient que les flèches réellement saisies, impacts alignés. */
function flechesSaisies(carte) {
  const total = nbFlechesPrevues();
  const fleches = [];
  const impacts = [];
  for (let i = 0; i < total; i++) {
    const v = carte.fleches[i];
    if (v === undefined || v === null) continue;
    fleches.push(v);
    impacts.push(carte.impacts[i] || null);
  }
  return { fleches: fleches, impacts: impacts };
}

document.getElementById('formScore').addEventListener('submit', function (e) {
  e.preventDefault();
  if (estEnDirect()) { terminerDirect(); return; }
  if (competition.actif) { enregistrerCompetition(); return; }
  enregistrerPartie();
});

/** Enregistre la partie, après confirmation si elle n'est pas terminée. */
function enregistrerPartie(confirme) {
  const btn = document.getElementById('btnScore');
  const archer = document.getElementById('scoreArcher');
  const total = nbFlechesPrevues();

  const tirees = flechesSaisies(saisie);
  const fleches = saisie.mode === 'global' ? [] : tirees.fleches;
  const impacts = saisie.mode === 'global' ? [] : tirees.impacts;
  if (saisie.mode !== 'global' && !fleches.length) {
    notifier('Saisissez au moins une flèche, ou passez en « Score global ».', true);
    return;
  }

  // Partie incomplète : on le signale avant d'enregistrer.
  if (!confirme && saisie.mode !== 'global' && fleches.length < total) {
    const reste = total - fleches.length;
    confirmer({
      titre: 'Partie non terminée',
      message: reste + ' flèche' + (reste > 1 ? 's' : '') + ' sur ' + total +
        ' n’' + (reste > 1 ? 'ont' : 'a') + ' pas été saisie' + (reste > 1 ? 's' : '') +
        '. La partie sera enregistrée telle quelle.',
      valider: 'Enregistrer quand même',
      annuler: 'Continuer la saisie',
      danger: false,
    }).then(function (oui) { if (oui) enregistrerPartie(true); });
    return;
  }

  const data = {
    id: etat.modification ? etat.modification.id : '',
    adherentId: etat.saisitPourAutres && archer.value ? archer.value
      : (etat.modification ? etat.modification.adherentId : etat.moi.id),
    date: document.getElementById('scoreDate').value,
    seance: document.getElementById('scoreSeance').value,
    contexte: document.getElementById('scoreContexte').value,
    discipline: document.getElementById('scoreDiscipline').value,
    distance: document.getElementById('scoreDistance').value,
    blason: blasonChoisi(),
    volees: document.getElementById('scoreVolees').value,
    parVolee: document.getElementById('scoreParVolee').value,
    fleches: fleches,
    impacts: impacts,
    score: document.getElementById('scorePoints').value,
    lieu: document.getElementById('scoreLieu').value,
    brouillonId: brouillon.id,
  };

  clearTimeout(brouillon.minuteur);
  btn.disabled = true;
  btn.textContent = 'Enregistrement…';
  api('apiEnregistrerScore', data).then(function (r) {
    btn.disabled = false;
    if (!r.ok) { notifier(r.message, true); majTypeSaisie(); return; }
    seanceEnregistree();
    majTypeSaisie();
    notifier(r.message);
    document.getElementById('scorePoints').value = '';
    reinitialiserSaisie();
    chargerScores();
    rafraichirProgression();
    if (etat.statsArcher === etat.moi.id) chargerStats(etat.moi.id);
  });
}

/** Enregistre une ligne de score par participant. */
function enregistrerCompetition() {
  sauverCarteCourante();
  const btn = document.getElementById('btnScore');

  const participants = competition.archers.map(function (a) {
    const t = flechesSaisies(a);
    return { adherentId: a.id, nom: a.nom, fleches: t.fleches, impacts: t.impacts };
  }).filter(function (a) { return a.fleches.length; });

  if (participants.length < 2) {
    notifier('Il faut au moins deux archers ayant tiré pour enregistrer une compétition.', true);
    return;
  }

  const data = reglagesPartie();
  data.archers = participants;
  if (!data.seance) data.seance = 'Mini-compétition du ' + dateFr(data.date);
  data.brouillonId = brouillon.id;
  clearTimeout(brouillon.minuteur);

  btn.disabled = true;
  btn.textContent = 'Enregistrement…';
  api('apiEnregistrerCompetition', data).then(function (r) {
    btn.disabled = false;
    btn.textContent = 'Enregistrer la mini-compétition';
    if (!r.ok) { notifier(r.message, true); return; }

    modale('<h2>Mini-compétition enregistrée</h2>' +
      '<p class="muet">' + esc(data.seance) + '</p>' +
      '<div class="carte"><table class="tableau"><thead><tr><th>Archer</th>' +
      '<th>Moyenne</th><th>Score</th></tr></thead><tbody>' +
      r.classement.map(function (c, i) {
        return '<tr><td>' + (i + 1) + '. ' + esc(c.archer) + '</td>' +
          '<td>' + c.moyenne + '</td><td><strong>' + c.score + '/' + c.max + '</strong></td></tr>';
      }).join('') + '</tbody></table></div>' +
      ((r.echecs || []).length
        ? '<p class="muet">Non enregistré : ' + esc(r.echecs.join(' · ')) + '</p>' : '') +
      '<button class="principal" onclick="fermerModale()">Terminé</button>');

    seanceEnregistree();
    competition.archers.forEach(function (a) { a.fleches = []; a.impacts = []; a.index = 0; a.validees = []; });
    reinitialiserSaisie();
    rendreParticipants();
    chargerScores();
    rafraichirProgression();
  });
}

document.getElementById('porteeScores').addEventListener('click', function (e) {
  const b = e.target.closest('button');
  if (!b) return;
  Array.prototype.forEach.call(this.querySelectorAll('button'), function (x) {
    x.classList.toggle('actif', x === b);
  });
  etat.porteeScores = b.dataset.portee;
  chargerScores();
});

function chargerScores() {
  const club = etat.porteeScores === 'club' && etat.voitScores;
  document.getElementById('titreListeScores').textContent =
    club ? 'Parties du club' : 'Dernières parties';

  api('apiListeScores', { limite: club ? 60 : 25, tous: club }).then(function (r) {
    afficherScores(r, club);
  });
}

function afficherScores(r, club) {
  {
    const el = document.getElementById('listeScores');
    document.getElementById('scoresTotal').textContent = r.total ? r.total + ' au total' : '';
    if (!r.scores.length) {
      el.innerHTML = '<div class="vide">' + (club
        ? 'Aucune partie enregistrée au club pour l’instant.'
        : 'Aucune partie enregistrée pour l’instant.<br>Saisissez la première ci-dessus.') + '</div>';
      return;
    }
    etat.scores = r.scores;
    el.innerHTML = r.scores.map(function (s) {
      return '<div class="ligne" onclick="ouvrirPartie(\'' + s.id + '\')">' +

        (r.club ? esc(s.archer) + ' — ' : '') + esc(s.seance || s.discipline) +
        (s.distance ? ' · ' + s.distance + ' m' : '') + '</div>' +

        (s.volees ? ' · ' + s.volees + '×' + s.parVolee : '') + '</div></div>' +
        '<div style="text-align:right"><div style="font-weight:700">' + s.score + '</div>' +
        '<div class="muet" style="font-size:11.5px">' + s.moyenne + ' pts/fl.</div></div></div>';

}

/** Détail d'une partie, ouvert depuis la liste des scores. */
function ouvrirPartie(id) {
  api('apiStatistiquesPartie', id).then(function (r) {
    if (!r.ok) { notifier(r.message, true); return; }
    modale(detailSeance(r, 'modale') +
      '<div class="actions">' +
      '<button class="principal" onclick="voirStatsPartie(\'' + r.partie.id + '\')">Statistiques</button>' +
      (etat.saisitPourAutres || !r.partie.adherentId || r.partie.adherentId === etat.moi.id
        ? '<button class="secondaire" onclick="modifierPartie(\'' + r.partie.id + '\')">Modifier</button>' : '') +
      '<button class="secondaire" onclick="fermerModale()">Fermer</button></div>' +
      // Consulter la partie d'un autre ne permet pas de la supprimer.
      (etat.estEncadrant || !r.partie.adherentId || r.partie.adherentId === etat.moi.id
        ? '<div class="actions"><button class="danger" onclick="supprimerScore(\'' + r.partie.id +
          '\')">Supprimer cette partie</button></div>' : ''));
  });
}

/* ---------- Détail d'une séance, partagé par toutes les vues ---------- */

/**
 * Rend une séance complète : chiffres clés, cible, volées (périmètre, surface,
 * moyenne), évolution de la partie et zones touchées.
 * `r` est la réponse de `apiStatistiquesPartie`.
 */
function detailSeance(r, contexte) {
  const p = r.partie;
  const g = r.groupement;
  etat.seanceDetail = r;
  etat.seanceContexte = contexte || 'inline';

  let html = '<h2>' + esc(p.seance || p.discipline) + '</h2>' +
    '<p class="muet">' + dateFr(p.date) + ' · ' + esc(p.contexte) +
    (p.distance ? ' · ' + p.distance + ' m' : '') +
    (p.blason ? ' · blason ' + esc(p.blason) : '') +
    (p.lieu ? ' · ' + esc(p.lieu) : '') + '</p>';

  html += '<div class="grille-3">' +
    stat(p.score + '/' + p.max, 'Score') +
    stat(p.moyenne, 'Moy./flèche') +
    stat(g && g.centrage !== null ? g.centrage + ' %' : '—', 'Centrage') + '</div>';

  // Chaque flèche porte le numéro de sa volée : le graphique des volées
  // peut ainsi n'en montrer qu'une sur la cible.
  const pre = etat.seanceContexte === 'modale' ? 'M' : 'S';
  const idCible = 'cibleSeance' + pre;
  let impacts = [];
  (r.volees || []).forEach(function (v) {
    impactsAvecValeur(v.impacts, p.blason || p.rayonBlason).forEach(function (i) {
      impacts.push({ x: i.x, y: i.y, valeur: i.valeur, l: v.numero });
    });
  });
  if (!impacts.length) impacts = impactsAvecValeur(p.impacts, p.blason || p.rayonBlason);
  // Le graphique des volées se place juste sous la cible : sur téléphone,
  // on voit la cible pendant qu'on glisse le doigt sur le graphique.
  const grapheSeance = r.volees && r.volees.length ? grapheMesures({
    id: 'gSeance' + pre, cible: impacts.length ? idCible : '', ouvrir: 'volee',
    actif: (etat.graphesActifs || {})['gSeance' + pre],
    mesures: mesuresVolees([{ nom: '', volees: r.volees }]),
  }) : '';
  const blocGraphe = grapheSeance
    ? '<div class="titre-section"><h3>Volée par volée</h3></div><div class="carte">' + grapheSeance + '</div>' : '';
  let colonneCible = '';
  if (impacts.length) {
    colonneCible = '<div><div class="titre-section"><h3>Cible de la séance</h3>' +
      '<span class="muet">' + impacts.length + ' flèche(s)</span></div>' +
      '<div class="carte" id="' + idCible + '"><div class="cible-bloc">' +
      dessinerCible({ blason: p.blason, rayon: p.rayonBlason, impacts: impacts, centre: g }) +
      '</div><div class="revele-info muet">Toutes les flèches</div>' +
      mesuresLiees(idCible, tableMesuresVolees(r, g)) + '</div>' +
      blocGraphe + '</div>';
  }

  if (r.volees && r.volees.length) {
    // Sur grand écran, la cible et les volées se lisent côte à côte.
    html += '<div class="colonnes">' + colonneCible +
      '<div><div class="titre-section"><h3>Volées</h3>' +
      '<span class="muet">' + r.volees.length + ' × ' + (p.parVolee || '') + ' flèches</span></div>' +
      '<div class="carte">' + voleesDetaillees(r.volees) + '</div></div></div>';

    if (!impacts.length) {
      html += blocGraphe || '<div class="titre-section"><h3>Évolution de la partie</h3></div>' +
        '<div class="carte">' + graphiqueVolees(r.volees) + '</div>';
    }
    html += analyseVoleesHtml(r.volees, pre);

    const pointees = r.volees.filter(function (v) { return v.groupement; });
    if (pointees.length) {
      html += '<div class="titre-section"><h3>Groupement par volée</h3>' +
        '<span class="muet">' + (surOrdinateur() ? 'cliquez' : 'touchez') +
        ' une cible pour l’agrandir</span></div>' +
        '<div class="carte"><div class="cibles-volees">' + pointees.map(function (v) {
          return '<div class="mini" onclick="agrandirVolee(' + v.numero + ')">' +
            '<div class="etiquette-mini">V' + v.numero + ' · ' + v.total + ' pts</div>' +
            dessinerCible({
              blason: p.blason, rayon: p.rayonBlason,
              impacts: impactsAvecValeur(v.impacts, p.blason || p.rayonBlason),
              contour: v.impacts,
            }) + '</div>';
        }).join('') + '</div></div>';
    }

  } else if (colonneCible) {
    html += colonneCible;
  }

  if (r.synthese && r.synthese.total) {
    html += '<div class="titre-section"><h3>Zones touchées</h3></div>' +
      '<div class="carte">' + histogrammeZones(r.synthese) + couronnes(r.synthese) + '</div>';
  }
  return html;
}

/** Chiffres d'une séance tirés de ses volées : régularité, moitiés, rangs. */
function analyseVoleesHtml(volees, pre) {
  if (!volees || volees.length < 2) return '';
  const valeurs = [];
  volees.forEach(function (v) {
    v.fleches.forEach(function (f) { valeurs.push(f === 'M' ? 0 : Number(f)); });
  });
  const ratio = function (v) { return v.total / (v.max || 1); };
  const meilleure = volees.reduce(function (b, v) { return ratio(v) > ratio(b) ? v : b; });
  const faible = volees.reduce(function (b, v) { return ratio(v) < ratio(b) ? v : b; });
  const totaux = volees.map(function (v) { return v.total; });
  const moy = totaux.reduce(function (t, x) { return t + x; }, 0) / totaux.length;
  const ecart = Math.sqrt(totaux.reduce(function (t, x) { return t + (x - moy) * (x - moy); }, 0) / totaux.length);
  const moitie = Math.floor(volees.length / 2);
  const moyenneDe = function (liste) {
    let pts = 0;
    let n = 0;
    liste.forEach(function (v) { pts += v.total; n += v.nbFleches || v.fleches.length; });
    return n ? Math.round((pts / n) * 100) / 100 : 0;
  };
  const debut = moyenneDe(volees.slice(0, moitie));
  const fin = moyenneDe(volees.slice(volees.length - moitie));
  const pct = function (test) {
    return valeurs.length ? Math.round((1000 * valeurs.filter(test).length) / valeurs.length) / 10 + ' %' : '—';
  };
  const ecartFin = Math.round((fin - debut) * 100) / 100;

  let html = '<div class="titre-section"><h3>Analyse des volées</h3></div><div class="carte"><div class="grille-3">' +
    stat(meilleure.total + '/' + meilleure.max, 'Meilleure (V' + meilleure.numero + ')') +
    stat(faible.total + '/' + faible.max, 'Plus faible (V' + faible.numero + ')') +
    stat((Math.round(ecart * 100) / 100).toLocaleString('fr-FR'), 'Écart-type') +
    stat(pct(function (x) { return x >= 9; }), '% jaunes') +
    stat(pct(function (x) { return x === 10; }), '% de 10') +
    stat(valeurs.filter(function (x) { return x === 0; }).length, 'Manquées') +
    '</div><p class="muet" style="margin:10px 0 0">1re moitié : <strong>' + debut + '</strong> pts/flèche · ' +
    '2e moitié : <strong>' + fin + '</strong> pts/flèche ' +
    '<span class="puce ' + (ecartFin >= 0 ? 'vert' : 'orange') + '">' + (ecartFin >= 0 ? '▲ +' : '▼ ') + ecartFin.toFixed(2) + '</span>' +
    ' · l’écart-type mesure la régularité des scores de volée (plus bas = plus régulier).</p></div>';

  return html;
}

/**
 * Agrandit une volée : sa cible en grand, ses flèches une par une et ses
 * mesures. Le retour ramène à la partie quand on venait de sa fiche.
 */
function agrandirVolee(numero) {
  const r = etat.seanceDetail;
  if (!r) return;
  const v = (r.volees || []).filter(function (x) { return x.numero === numero; })[0];
  if (!v) return;
  const p = r.partie;

  let html = '<h2>Volée ' + v.numero + '</h2>' +
    '<p class="muet">' + esc(p.seance || p.discipline) + ' · ' + dateFr(p.date) +
    (p.blason ? ' · blason ' + esc(p.blason) : '') + '</p>' +
    '<div class="carte"><div class="cible-bloc">' +
    dessinerCible({
      blason: p.blason, rayon: p.rayonBlason,
      impacts: impactsAvecValeur(v.impacts, p.blason || p.rayonBlason),
      contour: v.impacts,
      centre: v.groupement,
    }) + '</div>' +
    '<div class="volee" style="justify-content:center;margin-top:6px">' +
    '<span class="cases" style="flex:0 0 auto">' + v.fleches.map(function (f) {
      const val = f === 'M' ? 0 : Number(f);
      return '<span class="case remplie z' + val + '">' + esc(f) + '</span>';
    }).join('') + '</span></div></div>';

  html += '<div class="grille-3">' +
    stat(v.total + '/' + v.max, 'Résultat') +
    stat(v.moyenne, 'Moy./flèche') +
    stat(v.centrage !== null && v.centrage !== undefined ? v.centrage + ' %' : '—', 'Centrage') +
    '</div>' +
    '<div class="grille">' +
    stat(v.perimetre + ' cm', 'Périmètre') +
    stat(v.aire ? v.aire.toLocaleString('fr-FR') + ' cm²' : '—', 'Surface') +
    '</div>';

  html += '<div class="actions">' +
    (etat.seanceContexte === 'modale'
      ? '<button class="principal" onclick="ouvrirPartie(\'' + p.id + '\')">← Retour à la partie</button>'
      : '<button class="principal" onclick="fermerModale()">← Retour à la séance</button>') +
    '<button class="secondaire" onclick="fermerModale()">Fermer</button></div>';
  modale(html);
}

/** Ajoute à chaque impact la valeur que lui donne le blason. */
function impactsAvecValeur(impacts, blason) {
  return (impacts || []).filter(function (i) { return i; }).map(function (i) {
    return { x: i.x, y: i.y, valeur: valeurPourPoint(i.x, i.y, blason) };
  });
}

/** Mesures de la partie entière, puis de chaque volée. */
function tableMesuresVolees(r, g) {
  const table = { '*': groupementHtml(g) || '' };
  (r.volees || []).forEach(function (v) {
    const gv = v.groupement;
    table[v.numero] = '<div class="grille-3" style="margin-top:4px">' +
      stat(gv ? gv.ecartCentre + ' cm' : '—', 'Centrage') +
      stat(v.perimetre ? v.perimetre + ' cm' : '—', 'Périmètre') +
      stat(v.aire ? v.aire.toLocaleString('fr-FR') + ' cm²' : '—', 'Surface') + '</div>' +
      '<p class="muet" style="margin:6px 0 0;text-align:center"><strong>Volée ' + v.numero + '</strong> · ' +
      v.total + '/' + v.max + ' · ' + v.moyenne + ' pts/flèche · ' +
      v.fleches.join(' ') + '</p>';
  });
  return table;
}

/** Résumé chiffré d'un groupement. */
function groupementHtml(g) {
  if (!g || g.nombre < 2) return '';
  const vertical = g.centreY > 0 ? 'bas' : 'haut';
  const horizontal = g.centreX > 0 ? 'droite' : 'gauche';
  return '<div class="grille-3" style="margin-top:4px">' +
    stat(g.perimetre + ' cm', 'Périmètre') +
    stat(g.aire ? g.aire.toLocaleString('fr-FR') + ' cm²' : '—', 'Surface') +
    stat(g.ecartCentre + ' cm', 'Écart au centre') + '</div>' +
    '<p class="muet" style="margin:10px 0 0">Le périmètre est la longueur de ficelle ' +
    'qu’il faudrait pour faire le tour des flèches. Centre du groupe décalé de ' +
    Math.abs(g.centreX) + ' cm vers la ' + horizontal + ' et ' +
    Math.abs(g.centreY) + ' cm vers le ' + vertical + '.</p>';
}

/** Volées : flèches, total, moyenne, périmètre et surface. */
function voleesDetaillees(volees) {
  const pointees = volees.filter(function (v) { return v.groupement; }).length;

  const lignes = volees.map(function (v) {
    return '<div class="volee-bloc">' +
      '<div class="volee"><span class="num">V' + v.numero + '</span>' +
      '<span class="cases">' + v.fleches.map(function (f) {
        const val = f === 'M' ? 0 : Number(f);
        return '<span class="case remplie z' + val + '">' + esc(f) + '</span>';
      }).join('') + '</span>' +
      '<span class="total">' + v.total + '</span></div>' +
      '<div class="volee-mesures">' +
      '<span>moyenne <strong>' + v.moyenne + '</strong></span>' +
      (v.groupement
        ? '<span>périmètre <strong>' + v.perimetre + ' cm</strong></span>' +
          '<span>surface <strong>' + (v.aire ? v.aire.toLocaleString('fr-FR') : '0') + ' cm²</strong></span>'
        : '<span class="muet">flèches non pointées</span>') +
      '</div></div>';
  }).join('');

  const moyenne = function (valeurs) {
    const v = valeurs.filter(function (x) { return x; });
    return v.length ? Math.round((v.reduce(function (t, x) { return t + x; }, 0) / v.length) * 10) / 10 : 0;
  };
  const perimetreMoyen = moyenne(volees.map(function (v) { return v.perimetre; }));
  const aireMoyenne = moyenne(volees.map(function (v) { return v.aire; }));

  return lignes + (pointees
    ? '<p class="muet" style="margin:12px 0 0">Moyenne sur ' + pointees + ' volée(s) pointée(s) : ' +
      '<strong>' + perimetreMoyen + ' cm</strong> de ficelle autour des flèches, ' +
      '<strong>' + aireMoyenne.toLocaleString('fr-FR') + ' cm²</strong> couverts.</p>'
    : '<p class="muet" style="margin:12px 0 0">Partie saisie au clavier : sans position ' +
      'des flèches sur la cible, ni périmètre ni surface ne peuvent être calculés.</p>');
}

/**
 * Évolution d'une partie : une barre par volée (son score) et la courbe de la
 * moyenne cumulée, pour voir si la séance monte ou s'essouffle.
 */
/**
 * Rouvre une partie déjà enregistrée dans le carton : réglages, flèches et
 * impacts reviennent tels quels, et « Enregistrer » remplace la partie au lieu
 * d'en créer une seconde.
 */
function modifierPartie(id) {
  const ouvrir = function () {
    api('apiStatistiquesPartie', id).then(function (r) {
      if (!r.ok) { notifier(r.message, true); return; }
      const p = r.partie;
      const fleches = [];
      String(p.detail || '').split('|').forEach(function (bloc) {
        bloc.split('-').forEach(function (v) {
          const t = String(v).trim().toUpperCase();
          if (t === '') return;
          fleches.push(t === 'M' ? 0 : Number(t));
        });
      });
      fermerModale();
      etat.modification = { id: p.id, adherentId: p.adherentId, date: p.date, seance: p.seance };
      etat.reglagesValides = true;
      competition.actif = false;
      competition.archers = [];
      competition.courant = null;
      restaurerSeance({
        type: 'partie',
        reglages: {
          date: p.date, seance: p.seance, contexte: p.contexte, discipline: p.discipline,
          distance: p.distance, blason: p.blason, volees: p.volees, parVolee: p.parVolee,
          lieu: p.lieu, archer: p.adherentId,
        },
        mode: fleches.length ? 'cible' : 'global',
        points: fleches.length ? '' : String(p.score),
        fleches: fleches,
        impacts: (p.impacts || []).slice(),
        index: fleches.length,
        validees: voleesPleines(fleches),
        archers: [],
      }, true);
      // Une partie enregistrée n'est pas un brouillon : rien à reprendre.
      brouillon.id = null;
      seanceEnregistree();
      etat.modification = { id: p.id, adherentId: p.adherentId, date: p.date, seance: p.seance };
      etat.reglagesValides = true;
      majEtapeSaisie();
      majTypeSaisie();
      allerA('Score');
      window.scrollTo(0, 0);
      notifier('Partie du ' + dateFr(p.date) + ' ouverte : modifiez, puis enregistrez.');
    });
  };
  if (seanceEnCours() && !etat.modification) {
    confirmer({
      titre: 'Une séance est en cours',
      message: 'La séance en cours sur ce téléphone, non enregistrée, sera remplacée par la partie à modifier.',
      valider: 'Ouvrir la partie',
      danger: false,
    }).then(function (oui) { if (oui) ouvrir(); });
    return;
  }
  ouvrir();
}

/** Abandonne la modification en cours et revient à une partie neuve. */
function abandonnerModification() {
  etat.modification = null;
  document.getElementById('scorePoints').value = '';
  reinitialiserSaisie();
  seanceEnregistree();
  majTypeSaisie();
  notifier('Modification abandonnée : la partie enregistrée n’a pas changé.');
}

function supprimerScore(id) {
  confirmer({ titre: 'Supprimer cette séance ?', message: 'Tous ses scores, volées et impacts seront effacés définitivement.', valider: 'Supprimer la séance' }).then(function (oui) {
    if (!oui) return;
    api('apiSupprimerScore', id).then(function (r) {
      notifier(r.message, !r.ok);
      if (r.ok) {
        fermerModale();
        chargerScores();
        rafraichirProgression();
        if (etat.statsArcher) chargerStats(etat.statsArcher);
      }
    });
  });
}

/* ---------- Progression ---------- */

document.getElementById('sousOnglets').addEventListener('click', function (e) {
  const b = e.target.closest('button');
  if (!b) return;
  Array.prototype.forEach.call(this.querySelectorAll('button'), function (x) {
    x.classList.toggle('actif', x === b);
  });
  const vue = b.dataset.sous;
  document.getElementById('progressionContenu').style.display = vue === 'Progression' ? '' : 'none';
  document.getElementById('statsContenu').style.display = vue === 'Stats' ? '' : 'none';
  document.getElementById('comparaisonContenu').style.display = vue === 'Comparer' ? '' : 'none';
  document.getElementById('classementContenu').style.display = vue === 'Classement' ? '' : 'none';
  if (vue === 'Classement') rendreClassement();
  if (vue === 'Stats' && !etat.statsArcher) chargerStats(etat.moi.id);
  if (vue === 'Comparer' && !etat.comparaison) rendreComparaison();
});

function rafraichirProgression() {
  chargerProgression(etat.progressionArcher || etat.moi.id);
}

/**
 * Charge la progression : celle d'un archer, ou celle du club entier quand
 * l'encadrement choisit « Tous les archers ».
 */
function chargerProgression(cible) {
  const choix = cible || etat.moi.id;
  const appel = choix === 'club'
    ? api('apiProgressionClub')
    : api('apiProgression', choix);

  appel.then(function (r) {
    if (!r.ok) { notifier(r.message, true); return; }
    etat.progressionArcher = choix;
    etat.progressionNom = r.archer;
    etat.progression = r.progression;
    rendreProgression(r.progression);
  });
}

function changerArcherProgression(id) {
  etat.seanceChoisie = '';
  chargerProgression(id);
}

/**
 * Page Progression. Les deux bandeaux — archer et séance — restent en haut de
 * l'écran quoi qu'il arrive : ils sont rendus avant tout contenu, et affichés
 * même lorsque l'archer choisi n'a encore aucune partie, sinon il n'y aurait
 * plus moyen d'en sélectionner un autre.
 */
function rendreProgression(p) {
  const el = document.getElementById('progressionContenu');
  const club = !!(p && p.club);
  let html = '<div class="bandeaux">';

  if (etat.voitScores) {
    html += '<div class="carte compacte"><label for="choixArcherProgression">Archer</label>' +
      '<select id="choixArcherProgression" onchange="changerArcherProgression(this.value)">' +
      optionsArcherProgression() + '</select></div>';
  }

  const seances = (p && p.seances) || [];
  html += '<div class="carte compacte"><label for="choixSeance">Séance</label>' +
    '<select id="choixSeance" onchange="choisirSeance(this.value)"' +
    (seances.length ? '' : ' disabled') + '>' +
    '<option value="">Vue d’ensemble</option>' +
    seances.map(function (s) {
      return option(s.id, (s.meilleure ? '★ ' : '') + dateFr(s.date) + ' — ' +
        (club ? s.archer + ' · ' : '') + (s.seance || s.discipline) +
        (s.lieu ? ' (' + s.lieu + ')' : '') +
        ' · ' + s.score + ' · ' + s.moyenne + ' pts/flèche', etat.seanceChoisie);
    }).join('') + '</select></div></div>';

  if (!p || !p.nbScores) {
    el.innerHTML = html + '<div class="vide">' +
      (club ? 'Aucune partie enregistrée au club.'
            : 'Aucune partie enregistrée pour cet archer.') + '<br>' +
      'Les séances et les courbes apparaîtront ici.' +
      (etat.progressionArcher === etat.moi.id
        ? '<br><br><button class="secondaire" style="max-width:220px;margin:0 auto" ' +
          'onclick="allerA(\'Score\')">Saisir une partie</button>' : '') +
      '</div>';
    majHauteurEntete();
    return;
  }

  html += '<div class="grille-3">' +
    stat(p.nbScores, 'Parties') +
    stat(club ? p.nbArchers : p.volumeFleches, club ? 'Archers' : 'Flèches') +
    stat(p.moyenneFleche, 'Moy./flèche') + '</div>';

  html += '<div id="zoneSeance"></div>';
  el.innerHTML = html;
  majHauteurEntete();

  if (etat.seanceChoisie) choisirSeance(etat.seanceChoisie);
  else rendreVueEnsemble(p);
}

/** Choix d'archer de la page Progression, le club en tête. */
function optionsArcherProgression() {
  return option('club', '👥 Tous les archers', etat.progressionArcher) +
    (etat.inscrits || []).map(function (a) {
      return option(a.id, a.prenom + ' ' + a.nom, etat.progressionArcher || etat.moi.id);
    }).join('');
}

/** Vue d'ensemble : la liste des parties, puis une carte par discipline. */
function rendreVueEnsemble(p) {
  const zone = document.getElementById('zoneSeance');
  if (!zone) return;
  const club = !!p.club;

  let html = '';
  if ((p.evolution || []).length) {
    html += '<div class="titre-section"><h2>Évolution de la moyenne</h2>' +
      '<span class="muet">' + (club ? 'club, jour par jour' : esc(etat.progressionNom || '')) + '</span></div>' +
      '<div class="carte">' + courbeEvolution(p.evolution, club) + '</div>';
  }
  if ((p.seances || []).length) {
    html += '<div class="titre-section"><h2>' + (club ? 'Parties du club' : 'Mes parties') + '</h2>' +
      '<span class="muet">' + p.seances.length + ' enregistrée(s)</span></div><div class="carte">' +
      p.seances.map(function (s) {
        return '<div class="ligne" onclick="voirStatsPartie(\'' + s.id + '\'' +
          (s.adherentId ? ', \'' + s.adherentId + '\'' : '') + ')">' +
          '<div class="infos"><div class="nom">' +
          (s.meilleure
            ? '<svg class="etoile" viewBox="0 0 24 24"><use href="#ico-etoile"/></svg>' : '') +
          (club ? esc(s.archer) + ' — ' : '') + esc(s.seance || s.discipline) +
          (s.distance ? ' · ' + s.distance + ' m' : '') + '</div>' +
          '<div class="detail">' + dateFr(s.date) +
          (s.lieu ? ' · ' + esc(s.lieu) : '') + ' · ' + esc(s.contexte) +
          (s.centrage !== null && s.centrage !== undefined ? ' · centrage ' + s.centrage + ' %' : '') +
          '</div></div>' +
          '<div style="text-align:right"><div style="font-weight:700">' + s.score + '</div>' +
          '<div class="muet" style="font-size:11.5px">' + s.moyenne + ' pts/fl.</div></div></div>';
      }).join('') + '</div>';
  }

  zone.innerHTML = html + (p.disciplines || []).map(function (d) {
    const tendance = d.tendance === undefined ? '' :
      '<span class="puce ' + (d.tendance >= 0 ? 'vert' : 'orange') + '">' +
      (d.tendance >= 0 ? '▲ +' : '▼ ') + d.tendance + ' pts/flèche</span>';
    return '<div class="titre-section"><h2>' + esc(d.discipline) + '</h2>' + tendance + '</div>' +
      '<div class="carte">' +
      '<div style="display:flex;justify-content:space-between;margin-bottom:10px">' +
      '<div><div class="muet">Record' + (club && d.meilleurArcher ? ' — ' + esc(d.meilleurArcher) : '') +
      '</div><strong>' + d.meilleur + '/' + d.meilleurMax + '</strong> ' +
      '<span class="muet">' + dateFr(d.meilleurDate) + '</span></div>' +
      '<div style="text-align:right"><div class="muet">Moyenne</div><strong>' +
      d.moyenne + ' pts/flèche</strong></div></div>' +
      (d.serie ? courbe(d.serie, 'moyenne') : '') +
      '<div class="muet" style="margin-top:6px">' + d.nb + ' partie(s) enregistrée(s)</div></div>';
  }).join('');
}

/** Le menu déroulant déplie la séance choisie, en dessous. */
function choisirSeance(id) {
  etat.seanceChoisie = id || '';
  const zone = document.getElementById('zoneSeance');
  if (!zone) return;

  if (!etat.seanceChoisie) {
    rendreVueEnsemble(etat.progression);
    return;
  }
  zone.innerHTML = '<div class="chargement">Chargement de la séance…</div>';
  api('apiStatistiquesPartie', etat.seanceChoisie).then(function (r) {
    if (!r.ok) { zone.innerHTML = '<div class="vide">' + esc(r.message) + '</div>'; return; }
    zone.innerHTML = '<div class="carte">' +
      '<div class="actions" style="margin:0 0 14px">' +
      '<button class="secondaire" onclick="retourVueEnsemble()">← Toutes les séances</button>' +
      '<button class="secondaire" onclick="voirStatsPartie(\'' + r.partie.id +
      '\')">Statistiques</button></div>' +
      detailSeance(r) + '</div>';
    zone.scrollIntoView({ block: 'start', behavior: 'smooth' });
  });
}

/** Retour à la liste des séances depuis le détail d'une partie. */
function retourVueEnsemble() {
  const select = document.getElementById('choixSeance');
  if (select) select.value = '';
  choisirSeance('');
}

/**
 * Hauteur réelle de l'en-tête : les bandeaux collants s'y arriment.
 */
function majHauteurEntete() {
  const entete = document.querySelector('header.app');
  if (!entete) return;
  document.documentElement.style.setProperty('--haut-entete', entete.offsetHeight + 'px');
}

/* ---------- Statistiques ---------- */

function chargerStats(adherentId, options) {
  etat.statsArcher = adherentId || etat.moi.id;
  const el = document.getElementById('statsContenu');
  el.innerHTML = '<div class="chargement">Calcul des statistiques…</div>';
  api('apiStatistiques', etat.statsArcher, options || etat.statsFiltres || {}).then(function (r) {
    if (!r.ok) { el.innerHTML = '<div class="vide">' + esc(r.message) + '</div>'; return; }
    etat.stats = r;
    rendreStats(r);
  });
}

function rendreStats(s) {
  const el = document.getElementById('statsContenu');
  const f = etat.statsFiltres || {};
  let html = filtresStats(s, f);

  if (!s.nbParties) {
    el.innerHTML = html + '<div class="vide">Aucune partie ne correspond.' +
      (estFiltre(f) ? '<br><br><button class="secondaire" style="max-width:220px;margin:0 auto" ' +
        'onclick="reinitialiserFiltres()">Retirer les filtres</button>' : '') + '</div>';
    return;
  }

  // Une seule séance sélectionnée : on déplie son détail complet.
  if (f.scoreId && s.parties.length === 1) {
    el.innerHTML = html + '<div class="carte" id="detailSeanceStats">' +
      '<div class="chargement">Chargement de la séance…</div></div>';
    api('apiStatistiquesPartie', f.scoreId).then(function (r) {
      const zone = document.getElementById('detailSeanceStats');
      if (!zone) return;
      zone.innerHTML = r.ok
        ? '<div class="actions" style="margin:0 0 14px">' +
          '<button class="secondaire" onclick="reinitialiserFiltres()">← Toutes les parties</button>' +
          '<button class="secondaire" onclick="ouvrirPartie(\'' + f.scoreId +
          '\')">Fiche complète</button></div>' + detailSeance(r)
        : '<div class="vide">' + esc(r.message) + '</div>';
    });
    return;
  }

  html += '<div class="grille-3">' +
    stat(s.nbParties, 'Parties') +
    stat(s.nbFleches, 'Flèches') +
    stat(s.moyenneFleche, 'Moy./flèche') + '</div>';

  const an = s.analyse || { parties: [] };
  const nomArcher = s.archer || 'Archer';
  html += '<div class="colonnes">';
  if ((s.impacts || []).length) {
    html += '<div><div class="titre-section"><h2>Carte des impacts</h2>' +
      '<span class="muet">blason ' + esc(s.blasonReference) + '</span></div>' +
      '<div class="carte" id="cibleStats"><div class="cible-bloc">' +
      dessinerCible({ blason: s.blasonReference, rayon: s.rayonReference,
        impacts: s.impacts.map(function (i) { return { x: i.x, y: i.y, valeur: i.valeur, l: i.p }; }),
        centre: s.groupement }) +
      '</div><div class="revele-info muet">Toutes les flèches</div>' +
      mesuresLiees('cibleStats', tableMesuresParties(s, an)) +
      '<p class="muet" style="margin:10px 0 0">Les parties tirées sur un autre blason ' +
      'sont ramenées à cette taille pour rester comparables. Centrage : distance du centre ' +
      'du groupe au centre du blason ; dispersion : distance moyenne des flèches au centre du groupe.</p></div></div>';
  }

  // Colonne de droite : l'analyse partie par partie, reliée à la carte des
  // impacts, puis la répartition des touches.
  const grapheParties = an.parties.length > 1 ? grapheMesures({
    id: 'gStats', cible: (s.impacts || []).length ? 'cibleStats' : '', ouvrir: 'partie',
    actif: (etat.graphesActifs || {}).gStats,
    mesures: mesuresParties([{ nom: nomArcher, parties: an.parties }]),
  }) : '';
  if (s.synthese.total || grapheParties) {
    html += '<div>';
    if (grapheParties) {
      html += '<div class="titre-section"><h2>Partie par partie</h2>' +
        '<span class="muet">' + an.parties.length + ' partie(s)</span></div>' +
        '<div class="carte">' + grapheParties + '</div>';
    }
    if (s.synthese.total) {
      html += '<div class="titre-section"><h2>Répartition des touches</h2>' +
        '<span class="muet">' + s.synthese.total + ' flèches pointées</span></div>' +
        '<div class="carte">' + histogrammeZones(s.synthese) + couronnes(s.synthese) + '</div>';
    }
    html += '</div>';
  }
  html += '</div>';

  // Chiffres clés de la sélection.
  const cle = function (v, suffixe) { return v === null || v === undefined || v === 0 && suffixe === ' cm' ? '—' : v + (suffixe || ''); };
  html += '<div class="titre-section"><h2>Analyse</h2><span class="muet">sur la sélection</span></div>' +
    '<div class="carte"><div class="grille-3">' +
    stat(cle(an.jaunes, ' %'), '% jaunes (9-10)') +
    stat(cle(an.dix, ' %'), '% de 10') +
    stat(an.regularite === null ? '—' : an.regularite, 'Écart-type moy.') +
    stat(cle(an.ecartCentre, ' cm'), 'Centrage moyen') +
    stat(cle(an.perimetre, ' cm'), 'Périmètre / volée') +
    stat(an.aire ? an.aire.toLocaleString('fr-FR') + ' cm²' : '—', 'Surface / volée') +
    '</div>' +
    (an.meilleureVolee
      ? '<p class="muet" style="margin:10px 0 0">Meilleure volée : <strong>' + an.meilleureVolee.total + '/' +
        an.meilleureVolee.max + '</strong> (volée ' + an.meilleureVolee.numero + ' du ' + dateFr(an.meilleureVolee.date) + ')' +
        (s.meilleurePartie ? ' · meilleure partie : <strong>' + s.meilleurePartie.score + '/' + s.meilleurePartie.max +
          '</strong> le ' + dateFr(s.meilleurePartie.date) : '') + '.</p>'
      : '') + '</div>';

  const grapheRangs = grapheMesures({
