<style>
  /* Palette : vert sapin et or, couleurs de blason réservées aux données. */
  :root {
    --fond: #f4f3ef;
    --carte: #ffffff;
    --encre: #16211c;
    --encre-doux: #5f6f68;
    --trait: #e2dfd6;
    --accent: #15594a;
    --accent-fort: #0f4438;
    --accent-clair: #e3eee9;
    --or: #c1912f;
    --rouge: #a8342a;
    --rouge-fond: #fbeae7;
    --orange: #9a6414;
    --orange-fond: #fbf1e0;
    --vert: #2c6b4a;
    --vert-fond: #e6f1ea;
    --rayon: 16px;
    --ombre: 0 1px 2px rgba(16, 32, 27, .05), 0 10px 28px rgba(16, 32, 27, .06);
    --safe-bas: env(safe-area-inset-bottom, 0px);

    /* Couronnes du blason — identiques en clair et en sombre. */
    --z-or: #e3b23c;
    --z-rouge: #c9433a;
    --z-bleu: #3d7fbf;
    --z-noir: #333b42;
    --z-blanc: #dfe3e6;
    --z-manque: #a8342a;
  }
  /* Mode sombre : celui du système (« Auto »), sauf choix contraire du membre
     dans son profil — data-theme="light" ou "dark" sur la racine. */
  :root { color-scheme: light dark; }
  :root[data-theme="light"] { color-scheme: light; }
  :root[data-theme="dark"] { color-scheme: dark; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --fond: #0d1311; --carte: #151d1a; --encre: #e9efec; --encre-doux: #93a49d;
      --trait: #26332e; --accent: #58bfa3; --accent-fort: #3fa78b; --accent-clair: #182b26;
      --or: #d9ab49;
      --rouge: #e88178; --rouge-fond: #2c1b18; --orange: #d3a05a; --orange-fond: #2a2217;
      --vert: #7fc79c; --vert-fond: #16281e;
      --ombre: 0 1px 2px rgba(0,0,0,.35), 0 10px 28px rgba(0,0,0,.3);
    }
  }
  :root[data-theme="dark"] {
      --fond: #0d1311; --carte: #151d1a; --encre: #e9efec; --encre-doux: #93a49d;
      --trait: #26332e; --accent: #58bfa3; --accent-fort: #3fa78b; --accent-clair: #182b26;
      --or: #d9ab49;
      --rouge: #e88178; --rouge-fond: #2c1b18; --orange: #d3a05a; --orange-fond: #2a2217;
      --vert: #7fc79c; --vert-fond: #16281e;
      --ombre: 0 1px 2px rgba(0,0,0,.35), 0 10px 28px rgba(0,0,0,.3);
  }

  /* Couleurs de thème (data-couleur) : seul l'accent change. */
  :root[data-couleur="ocean"] { --accent: #1d5f8a; --accent-fort: #154a6c; --accent-clair: #e2edf5; }
  :root[data-couleur="bordeaux"] { --accent: #8a2b3d; --accent-fort: #6d1f2f; --accent-clair: #f5e4e7; }
  :root[data-couleur="lavande"] { --accent: #5b4a9a; --accent-fort: #463878; --accent-clair: #ebe7f5; }
  :root[data-couleur="terre"] { --accent: #9a5520; --accent-fort: #7a4217; --accent-clair: #f6ebe1; }
  :root[data-couleur="ardoise"] { --accent: #3f5566; --accent-fort: #2f4250; --accent-clair: #e6ebef; }
  @media (prefers-color-scheme: dark) {
    :root[data-couleur="ocean"]:not([data-theme="light"]) { --accent: #6fb4e0; --accent-fort: #4f9bcb; --accent-clair: #16252f; }
    :root[data-couleur="bordeaux"]:not([data-theme="light"]) { --accent: #e0899a; --accent-fort: #cc6d80; --accent-clair: #2c1a1e; }
    :root[data-couleur="lavande"]:not([data-theme="light"]) { --accent: #a99ae0; --accent-fort: #9282cf; --accent-clair: #221d31; }
    :root[data-couleur="terre"]:not([data-theme="light"]) { --accent: #e0a46f; --accent-fort: #cf8d55; --accent-clair: #2c2118; }
    :root[data-couleur="ardoise"]:not([data-theme="light"]) { --accent: #9fb4c4; --accent-fort: #87a0b2; --accent-clair: #1c2328; }
  }
  :root[data-theme="dark"][data-couleur="ocean"] { --accent: #6fb4e0; --accent-fort: #4f9bcb; --accent-clair: #16252f; }
  :root[data-theme="dark"][data-couleur="bordeaux"] { --accent: #e0899a; --accent-fort: #cc6d80; --accent-clair: #2c1a1e; }
  :root[data-theme="dark"][data-couleur="lavande"] { --accent: #a99ae0; --accent-fort: #9282cf; --accent-clair: #221d31; }
  :root[data-theme="dark"][data-couleur="terre"] { --accent: #e0a46f; --accent-fort: #cf8d55; --accent-clair: #2c2118; }
  :root[data-theme="dark"][data-couleur="ardoise"] { --accent: #9fb4c4; --accent-fort: #87a0b2; --accent-clair: #1c2328; }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--fond); color: var(--encre);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding-bottom: calc(76px + var(--safe-bas));
  }
  h1, h2, h3 { margin: 0; font-weight: 650; letter-spacing: -.015em; }
  h1 { font-size: 20px; }
  h2 { font-size: 17px; }
  h3 { font-size: 14px; }
  p { margin: 0 0 10px; }
  a { color: var(--accent); }
  svg { display: block; }

  /* ---------- Structure ---------- */
  header.app {
    position: sticky; top: 0; z-index: 20;
    background: linear-gradient(135deg, var(--accent) 0%, var(--accent-fort) 100%);
    color: #fff;
    padding: calc(13px + env(safe-area-inset-top, 0px)) 16px 13px;
    display: flex; align-items: center; gap: 12px;
  }
  header.app .titres h1 { font-size: 18px; }
  header.app .logo-tuile {
    background: #fff; border-radius: 10px; padding: 4px 5px;
    display: flex; align-items: center; flex: 0 0 auto;
  }
  header.app .logo-tuile img { width: 44px; height: auto; display: block; }
  header.app .titres { flex: 1; min-width: 0; }
  header.app .sous { font-size: 12px; opacity: .82; }
  header.app button {
    background: rgba(255,255,255,.16); color: #fff; border: 0;
    border-radius: 999px; padding: 7px 13px; font-size: 13px; font-weight: 600;
    display: flex; align-items: center; gap: 6px;
  }
  header.app button svg { width: 15px; height: 15px; }
  main { padding: 16px 16px 24px; max-width: 720px; margin: 0 auto; }

  /* Deux colonnes côte à côte dès que l'écran le permet. */
  .colonnes { display: block; }

  .vue { display: none; }
  .vue.active { display: block; animation: entree .18s ease-out; }
  @keyframes entree { from { opacity: 0; transform: translateY(6px); } }

  nav.onglets {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 30;
    background: var(--carte); border-top: 1px solid var(--trait);
    display: flex; padding-bottom: var(--safe-bas);
    backdrop-filter: saturate(140%) blur(8px);
  }
  nav.onglets button {
    flex: 1; border: 0; background: none; color: var(--encre-doux);
    padding: 9px 2px 10px; font-size: 10.5px; font-weight: 600; font-family: inherit;
    display: flex; flex-direction: column; align-items: center; gap: 4px;
  }
  nav.onglets button svg { width: 21px; height: 21px; }
  nav.onglets button.actif { color: var(--accent); }
  nav.onglets button { position: relative; }
  /* Séance en cours : les autres onglets passent en retrait. */
  body.seance-en-cours nav.onglets button:not([data-vue="Score"]) { opacity: .4; }

  /* Compteur de messages non lus. */
  .pastille-nb {
    position: absolute; top: 4px; right: 50%; transform: translateX(18px);
    min-width: 17px; height: 17px; padding: 0 4px; border-radius: 9px;
    background: var(--rouge); color: #fff; font-size: 10.5px; font-weight: 700;
    display: flex; align-items: center; justify-content: center;
  }

  /* ---------- Blocs ---------- */
  .carte {
    background: var(--carte); border: 1px solid var(--trait);
    border-radius: var(--rayon); padding: 15px; margin-bottom: 12px;
    box-shadow: var(--ombre);
  }
  .carte.compacte { padding: 11px 13px; }
  .titre-section {
    display: flex; align-items: baseline; justify-content: space-between;
    margin: 22px 0 10px; gap: 10px;
  }
  .titre-section:first-child { margin-top: 0; }
  .muet { color: var(--encre-doux); font-size: 13px; }
  .vide { text-align: center; color: var(--encre-doux); padding: 28px 12px; font-size: 14px; }

  .grille { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
  .grille-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .stat {
    background: var(--carte); border: 1px solid var(--trait);
    border-radius: var(--rayon); padding: 13px;
  }
  .stat .valeur { font-size: 23px; font-weight: 700; letter-spacing: -.025em; }
  .stat .libelle {
    font-size: 11px; color: var(--encre-doux);
    text-transform: uppercase; letter-spacing: .05em; margin-top: 2px;
  }

  .alerte {
    display: flex; gap: 10px; align-items: flex-start;
    padding: 11px 13px; border-radius: 12px; margin-bottom: 8px; font-size: 14px;
  }
  .alerte svg { width: 18px; height: 18px; flex: 0 0 18px; margin-top: 1px; }
  .alerte.rouge { background: var(--rouge-fond); color: var(--rouge); }
  .alerte.orange { background: var(--orange-fond); color: var(--orange); }
  .alerte strong { display: block; }

  .puce {
    display: inline-block; padding: 3px 9px; border-radius: 999px;
    font-size: 11.5px; font-weight: 650; background: var(--accent-clair); color: var(--accent);
  }
  .puce.rouge { background: var(--rouge-fond); color: var(--rouge); }
  .puce.orange { background: var(--orange-fond); color: var(--orange); }
  .puce.vert { background: var(--vert-fond); color: var(--vert); }
  .puce.neutre { background: var(--trait); color: var(--encre-doux); }

  .ligne {
    display: flex; align-items: center; gap: 11px;
    padding: 11px 0; border-bottom: 1px solid var(--trait); cursor: pointer;
  }
  .ligne:last-child { border-bottom: 0; }
  .ligne .infos { flex: 1; min-width: 0; }
  .ligne .nom { font-weight: 600; }
  .ligne .detail {
    font-size: 12.5px; color: var(--encre-doux);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .pastille {
    width: 38px; height: 38px; border-radius: 13px; flex: 0 0 38px;
    background: var(--accent-clair); color: var(--accent);
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 13px;
  }

  .pastille.photo { padding: 0; overflow: hidden; }
  .pastille.photo img { width: 100%; height: 100%; object-fit: cover; display: block; }

  /* ---------- Calendrier ---------- */
  .carte.seance { padding: 13px 14px; }
  .seance-entete { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
  .seance-entete .muet { font-size: 12.5px; margin-top: 2px; }
  .reponses { display: flex; gap: 7px; margin-top: 11px; }
  .reponses .reponse {
    flex: 1; padding: 9px 6px; border-radius: 10px; font: inherit; font-size: 13px;
    font-weight: 650; border: 1px solid var(--trait); background: var(--fond);
    color: var(--encre-doux);
  }
  .reponses .reponse.actif.vert { background: var(--vert-fond); color: var(--vert); border-color: var(--vert); }
  .reponses .reponse.actif.rouge { background: var(--rouge-fond); color: var(--rouge); border-color: var(--rouge); }
  .reponses .reponse.actif.orange { background: var(--orange-fond); color: var(--orange); border-color: var(--orange); }
  .participants-seance { margin-top: 10px; border-top: 1px solid var(--trait); padding-top: 6px; }
  .participants-seance summary { font-size: 12.5px; color: var(--encre-doux); cursor: pointer; }

  /* ---------- Messagerie ---------- */
  .carte.message { padding: 13px 14px; }
  .carte.message.nouveau { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent-clair), var(--ombre); }
  .message-entete { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
  .message-entete .muet { font-size: 12px; }
  .message-texte { margin: 8px 0 0; white-space: pre-wrap; }
  .lien-discret {
    background: none; border: 0; padding: 6px 0 0; font: inherit; font-size: 12.5px;
    color: var(--encre-doux); text-decoration: underline; cursor: pointer;
  }

  /* ---------- Formulaires ---------- */
  label { display: block; font-size: 12.5px; font-weight: 600; color: var(--encre-doux); margin: 0 0 5px; }
  .champ { margin-bottom: 13px; }
  input, select, textarea {
    width: 100%; padding: 11px 12px; font-size: 16px; font-family: inherit;
    color: var(--encre); background: var(--fond);
    border: 1px solid var(--trait); border-radius: 11px;
  }
  input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  textarea { min-height: 72px; resize: vertical; }
  .duo { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

  button.principal, button.secondaire, button.danger {
    width: 100%; padding: 13px; border: 0; border-radius: 12px;
    font-size: 15px; font-weight: 650; font-family: inherit; cursor: pointer;
  }
  button.principal { background: var(--accent); color: #fff; }
  button.secondaire { background: var(--accent-clair); color: var(--accent); }
  button.danger { background: var(--rouge); color: #fff; }
  /* Deux rouges : effacer une flèche est bénin, tout vider ne l'est pas. */
  button.danger-doux { background: var(--rouge-fond); color: var(--rouge); }
  button.danger-doux, button.danger { }
  button[disabled] { opacity: .55; }
  .actions { display: flex; gap: 9px; margin-top: 14px; }

  /* Bandeaux de choix (archer, séance) : ils restent sous l'en-tête. */
  .bandeaux {
    position: sticky; top: var(--haut-entete, 60px); z-index: 15;
    background: var(--fond); margin: -4px -16px 12px; padding: 8px 16px 4px;
    border-bottom: 1px solid var(--trait);
  }
  .bandeaux .carte { margin-bottom: 8px; }
  .bandeaux .carte:last-child { margin-bottom: 0; }

  .segment {
    display: flex; gap: 4px; background: var(--trait); padding: 3px;
    border-radius: 12px; margin: 0 0 14px;
  }
  .segment button {
    flex: 1; border: 0; background: none; color: var(--encre-doux);
    padding: 9px 6px; border-radius: 10px; font: inherit; font-size: 13.5px; font-weight: 650;
  }
  .segment button.actif { background: var(--carte); color: var(--accent); box-shadow: 0 1px 3px rgba(0,0,0,.09); }

  /* ---------- Cible interactive ---------- */
  .cible-bloc { display: flex; flex-direction: column; align-items: center; margin-bottom: 12px; }
  svg.cible { width: 100%; max-width: 320px; height: auto; touch-action: manipulation; }
  #blocCible svg.cible { touch-action: manipulation; cursor: pointer; }

  /* Loupe de visée : flotte au-dessus de la page, jamais sous le doigt. */
  .loupe {
    position: fixed; z-index: 45; left: 50%; transform: translateX(-50%);
    top: calc(74px + env(safe-area-inset-top, 0px));
    background: var(--carte); border: 1px solid var(--trait); border-radius: 16px;
    padding: 8px 8px 6px; box-shadow: 0 8px 28px rgba(0,0,0,.28);
    pointer-events: none; width: min(230px, 62vw);
  }
  .loupe svg.cible { width: 100%; max-width: 100%; }
  .loupe-valeur {
    text-align: center; font-size: 13px; font-weight: 700;
    color: var(--accent); margin-top: 5px;
  }
  svg.cible .viseur line, svg.cible .viseur circle {
    fill: none; stroke: #fff; stroke-width: 1.8; vector-effect: non-scaling-stroke;
    paint-order: stroke; filter: drop-shadow(0 0 1px rgba(0,0,0,.65));
  }
  svg.cible .anneau { stroke: rgba(0,0,0,.22); stroke-width: .7; vector-effect: non-scaling-stroke; }
  svg.cible .croix { stroke: rgba(0,0,0,.3); stroke-width: .8; vector-effect: non-scaling-stroke; }
  svg.cible .impact { stroke: #fff; stroke-width: .35; }
  svg.cible .impact.courant { stroke: var(--accent); stroke-width: .6; }
  svg.cible .impact-pale { opacity: .35; }
  svg.cible .centre-groupe { fill: none; stroke: var(--accent); stroke-width: .3; stroke-dasharray: 1 .8; }
  .cibles-volees {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr));
    gap: 10px; margin-top: 14px;
  }
  .cibles-volees .mini { cursor: pointer; border-radius: 12px; padding: 4px; transition: background .15s; }
  .cibles-volees .mini:active { background: var(--accent-clair); }
  .cibles-volees .mini svg.cible { max-width: 100%; }
  .cibles-volees .etiquette-mini {
    font-size: 11px; color: var(--encre-doux); font-weight: 650;
    text-align: center; margin-bottom: 3px;
  }
  svg.cible .contour { fill: var(--accent); fill-opacity: .18; stroke: var(--accent); stroke-width: .25; }

  .cible-indice { font-size: 12.5px; color: var(--encre-doux); margin-top: 8px; text-align: center; }

  /* ---------- Saisie flèche par flèche ---------- */
  /* Les points d'abord, en grand ; le détail de la séance juste en dessous. */
  .recap-saisie { margin: 4px 0 12px; font-size: 13px; }
  .recap-saisie .points { display: flex; align-items: baseline; gap: 6px; flex-wrap: wrap; }
  .recap-saisie #recapScore { font-size: 30px; font-weight: 700; letter-spacing: -.03em; }
  .recap-saisie #recapMax { font-size: 15px; }
  .recap-saisie #recapAvancement { margin-top: 2px; line-height: 1.45; }

  .volee-bloc { padding: 9px 0; border-bottom: 1px solid var(--trait); }
  .volee-bloc:last-child { border-bottom: 0; }
  .volee-mesures {
    display: flex; flex-wrap: wrap; gap: 4px 14px; margin: 5px 0 0 33px;
    font-size: 12px; color: var(--encre-doux);
  }
  .volee-mesures strong { color: var(--encre); font-weight: 650; }

  .volee { display: flex; align-items: center; gap: 7px; margin-bottom: 7px; }
  .volee-bloc .volee { margin-bottom: 0; }
  .volee .num { width: 26px; flex: 0 0 26px; font-size: 11.5px; color: var(--encre-doux); font-weight: 650; }
  /* Effacer une volée entière, sans quitter la grille. */
  .volee .vider-volee {
    flex: 0 0 26px; width: 26px; height: 26px; border-radius: 8px; border: 0; padding: 0;
    background: var(--rouge-fond); color: var(--rouge); font: inherit; font-size: 13px;
    font-weight: 700; cursor: pointer;
  }
  .volee .vider-volee[disabled] { opacity: .3; }

  /* Mini-compétition suivie en direct. */
  /* ---------- Vue de saisie d'une volée ---------- */
  .vue-volee {
    position: fixed; inset: 0; z-index: 45; background: var(--fond);
    display: flex; flex-direction: column; overflow-y: auto;
    padding: calc(10px + env(safe-area-inset-top, 0px)) 14px calc(12px + var(--safe-bas));
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
  }
  .vue-volee[hidden] { display: none; }
  /* Un élément marqué « hidden » est masqué, même si sa mise en page est en flex. */
  [hidden] { display: none !important; }
  body.vv-ouverte { overflow: hidden; }
  .vv-entete { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; max-width: 560px; width: 100%; margin-left: auto; margin-right: auto; }
  .vv-titres { flex: 1; min-width: 0; }
  .vv-titres strong { display: block; font-size: 17px; }
  .vv-titres .muet { display: block; font-size: 12.5px; }
  .vv-fermer {
    flex: none; width: 40px; height: 40px; border-radius: 12px; font-size: 16px;
    background: var(--carte); color: var(--encre); border: 1px solid var(--trait);
  }
  .vv-total { flex: none; text-align: right; font-size: 26px; font-weight: 750; letter-spacing: -.03em; line-height: 1.1; }
  .vv-total .muet { display: block; font-size: 11.5px; font-weight: 500; letter-spacing: 0; }
  .vv-cases { display: flex; gap: 7px; justify-content: center; flex-wrap: wrap; margin-bottom: 6px; }
  .vv-cases .case { width: 46px; height: 46px; font-size: 17px; }
  .vv-mesures { text-align: center; font-size: 12px; color: var(--encre-doux); min-height: 18px; margin-bottom: 4px; }
  .vv-cible { display: flex; flex-direction: column; align-items: center; }
  .vv-cible svg.cible { touch-action: none; width: 100%; max-width: min(94vw, 54vh); }
  .vue-volee .loupe { z-index: 48; }
  .vue-volee .clavier { max-width: 560px; width: 100%; margin-left: auto; margin-right: auto; }
  .vv-actions {
    display: flex; gap: 9px; margin-top: auto; padding-top: 12px;
    max-width: 560px; width: 100%; margin-left: auto; margin-right: auto;
  }
  .vv-actions button { flex: 1; }
  .vv-actions .principal { flex: 2; }
  .volee { cursor: pointer; }
  .volee .saisir-volee {
    flex: none; border: 1px solid var(--accent); border-radius: 8px; background: var(--accent-clair);
    color: var(--accent); font: inherit; font-size: 12px; font-weight: 700; padding: 5px 9px; cursor: pointer;
  }
  #reglagesPartie select:disabled, #reglagesPartie input:disabled { opacity: .7; }

  /* ---------- Validation des volées ---------- */
  .volee-bloc.validee { background: linear-gradient(90deg, var(--vert-fond), transparent 70%); }
